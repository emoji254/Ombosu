/* ---- conditioning results: what the client actually achieved in each timed block ---- */
function parseClockInput(text){
  const t=String(text??'').trim();if(!t)return null;
  const m=t.match(/^(\d+):(\d{1,2})$/);if(m)return Number(m[1])*60+Number(m[2]);
  const n=Number(t);return Number.isFinite(n)&&n>=0?Math.round(n):null;
}
/* "7 rounds + 5 reps · RPE 8 · note" — one readable line for a block's result. */
function conditioningResultText(r,mode){
  if(!r)return '';
  const parts=[],m=mode||r.mode;
  if(m==='amrap'){if(r.roundsCompleted!=null||r.extraReps)parts.push(`${r.roundsCompleted??0} round${(r.roundsCompleted??0)===1?'':'s'}${r.extraReps?` + ${r.extraReps} rep${r.extraReps===1?'':'s'}`:''}`);}
  else if(m==='forTime'){
    if(r.timeSeconds!=null)parts.push(formatClock(r.timeSeconds)+(r.capped?' (time cap)':''));
    if(r.roundsCompleted)parts.push(`${r.roundsCompleted} round${r.roundsCompleted===1?'':'s'}`);
  }else if(r.roundsCompleted)parts.push(`${r.roundsCompleted} ${m==='emom'?'interval':'round'}${r.roundsCompleted===1?'':'s'}`);
  if(r.calories!=null)parts.push(`${r.calories} cal`);
  if(r.distance!=null)parts.push(`${r.distance} m`);
  if(r.rpe!=null)parts.push(`RPE ${r.rpe}`);
  if(r.note)parts.push(r.note);
  return parts.join(' · ');
}
/* Called when a block finishes in a live session: keep what the timer measured, then ask for the rest. */
function captureConditioningResult(ss,state,opts={ask:true}){
  const idx=ss.currentBlockIndex,block=(ss.blocks||[])[idx];if(!block)return;
  ss.results=ss.results||{};
  const prev=ss.results[idx]||{};
  ss.results[idx]={...prev,blockIndex:idx,mode:block.mode,roundsCompleted:state.roundsCompleted??0,elapsedSeconds:state.elapsed??0,
    ...(block.mode==='forTime'?{timeSeconds:state.elapsed??0,capped:!!state.capped}:{})};
  // Group session: the same timer reading is the starting point for the partner too (they can differ in the dialog).
  (ss.clientIds||[]).slice(1).forEach(p=>{
    ss.partnerResults=ss.partnerResults||{};const pr=ss.partnerResults[p]=ss.partnerResults[p]||{},m=ss.results[idx];
    pr[idx]={...(pr[idx]||{}),blockIndex:idx,mode:block.mode,roundsCompleted:m.roundsCompleted,elapsedSeconds:m.elapsedSeconds,...(block.mode==='forTime'?{timeSeconds:m.timeSeconds,capped:m.capped}:{})};
  });
  scheduleWorkoutAutosave();
  if(opts.ask!==false)openConditioningResultDialog(ss,idx);
}
/* The result fields for one block (and optionally one person: `s` is an id suffix), and the matching reader. Used by the
   live "Block result" window and by editing a saved session. */
function conditioningResultFieldsHTML(mode,r,s){
  const val=v=>v==null?'':esc(v);
  const field=(id,label,value,attrs='')=>`<label class="field"><span>${label}</span><input id="${id}" type="text" inputmode="decimal" value="${val(value)}" ${attrs}></label>`;
  const rpeOptions=['','6','6.5','7','7.5','8','8.5','9','9.5','10'].map(v=>`<option value="${v}" ${String(r.rpe??'')===v?'selected':''}>${v||'—'}</option>`).join('');
  return `<div class="inline-fields">
      ${mode==='forTime'?field('cr_time'+s,'Time (min:sec)',r.timeSeconds!=null?formatClock(r.timeSeconds):'','placeholder="7:42"'):''}
      ${field('cr_rounds'+s,mode==='emom'?'Intervals completed':'Rounds completed',r.roundsCompleted,'inputmode="numeric"')}
      ${mode==='amrap'?field('cr_extra'+s,'Extra reps',r.extraReps,'inputmode="numeric"'):''}
      ${field('cr_cal'+s,'Calories (optional)',r.calories,'inputmode="numeric"')}
      ${field('cr_dist'+s,'Distance, metres (optional)',r.distance,'inputmode="numeric"')}
      <label class="field"><span>RPE (optional)</span><select id="cr_rpe${s}">${rpeOptions}</select></label>
    </div>
    <label class="field"><span>Note (optional)</span><textarea id="cr_note${s}" placeholder="How did it go?">${esc(r.note||'')}</textarea></label>`;
}
/* Returns the new result for the block, or null (after a message) when the time is not written as min:sec. */
function readConditioningResultFields(mode,prev,idx,s){
  const val2=id=>document.getElementById(id)?.value.trim()??'';
  const num=id=>{const t=val2(id);if(t==='')return null;const n=Number(t);return Number.isFinite(n)&&n>=0?n:null;};
  const next={...prev,blockIndex:idx,mode};
  const set=(key,v)=>{if(v==null||v==='')delete next[key];else next[key]=v;};
  set('roundsCompleted',num('cr_rounds'+s));
  if(mode==='amrap')set('extraReps',num('cr_extra'+s));
  if(mode==='forTime'){const t=parseClockInput(val2('cr_time'+s));if(val2('cr_time'+s)!==''&&t==null){toast('Enter the time as min:sec, e.g. 7:42');return null;}set('timeSeconds',t);}
  set('calories',num('cr_cal'+s));set('distance',num('cr_dist'+s));
  const rpe=val2('cr_rpe'+s);set('rpe',rpe===''?null:Number(rpe));
  set('note',val2('cr_note'+s));
  return next;
}
function openConditioningResultDialog(ss,idx){
  const block=(ss.blocks||[])[idx];if(!block)return;
  const mode=block.mode;
  const group=!!sessionClientIds(ss),people=group?ss.clientIds:[null];   // group: one set of fields per client
  const resultOf=k=>k===0?((ss.results||{})[idx]||{}):((((ss.partnerResults||{})[people[k]])||{})[idx]||{});
  const fieldsFor=k=>conditioningResultFieldsHTML(mode,resultOf(k),group?'_'+k:'');
  const body=`<p class="small muted">${esc(block.name||'Block '+(idx+1))} · ${esc(conditioningModeName(mode))}. Filled in from the timer.</p>`
    +people.map((cid,k)=>group?`<fieldset class="cr-person"><legend>${esc((S.clients[cid]||{}).name||'Client')}</legend>${fieldsFor(k)}</fieldset>`:fieldsFor(k)).join('');
  dialog('Block result',body,[
    {label:'Skip'},
    {label:'Save result',kind:'primary',onClick:()=>{
      const nexts=[];
      for(let k=0;k<people.length;k++){
        const next=readConditioningResultFields(mode,resultOf(k),idx,group?'_'+k:'');
        if(next===null)return false;
        nexts.push(next);
      }
      nexts.forEach((next,k)=>{
        if(k===0){ss.results=ss.results||{};ss.results[idx]=next;}
        else{ss.partnerResults=ss.partnerResults||{};(ss.partnerResults[people[k]]=ss.partnerResults[people[k]]||{})[idx]=next;}
      });
      scheduleWorkoutAutosave();render();toast('Result saved');
    }}
  ]);
}
/* Edit a saved conditioning session: its date and notes (conditioning-only sessions) and each block's result. Group sessions
   save one log per client, so this changes only this client's record. */
function openConditioningLogEdit(logId){
  const l=S.logs[logId];if(!l||!l.conditioningSession)return;
  const cs=l.conditioningSession,blocks=Array.isArray(cs.blocks)?cs.blocks:[],only=l.type==='conditioning';
  const meaningful=r=>['roundsCompleted','extraReps','timeSeconds','calories','distance','rpe','note'].some(k=>r[k]!=null&&r[k]!=='');
  const body=`${l.sharedSessionId?'<p class="small muted">This was a group session. Only this client\'s record is changed here.</p>':''}
    ${only?`<label class="field"><span>Date</span><input type="date" id="ce_date" value="${esc(l.date||todayISO())}"></label>`:''}
    ${blocks.length?blocks.map((b,i)=>`<fieldset class="cr-person"><legend>Block ${i+1} · ${esc(b.name||conditioningModeName(b.mode))} · ${esc(conditioningModeName(b.mode))}</legend>${conditioningResultFieldsHTML(b.mode,(cs.results||{})[i]||{},'_'+i)}</fieldset>`).join(''):'<p class="small muted">Detailed block data was not recorded for this older session.</p>'}
    ${only?`<label class="field"><span>Session notes</span><textarea id="ce_notes">${esc(l.notes||'')}</textarea></label>`:''}`;
  dialog('Edit conditioning session',body,[
    {label:'Cancel'},
    {label:'Save changes',kind:'primary',onClick:async()=>{
      const date=only?document.getElementById('ce_date').value:l.date;
      const notesVal=only?(document.getElementById('ce_notes')?document.getElementById('ce_notes').value.trim():(l.notes||'')):null;   // read now: the move-attendance question below replaces this window
      if(only&&!isISODate(date)){toast('Choose a date');return false;}
      const results={...(cs.results||{})};
      for(let i=0;i<blocks.length;i++){
        const r=readConditioningResultFields(blocks[i].mode,results[i]||{},i,'_'+i);
        if(r===null)return false;
        if(meaningful(r)||results[i])results[i]=r;
        if(!meaningful(r)&&results[i]&&Object.keys(results[i]).every(k=>['blockIndex','mode','elapsedSeconds','capped'].includes(k)))delete results[i];
      }
      // A changed date takes this client's "attended" mark along, if that mark belongs to this session alone.
      let move=null;
      if(only&&date!==l.date){
        const rec=S.attendance[attId(l.date,l.clientId)];
        const other=Object.entries(S.logs).some(([id,x])=>id!==logId&&x.clientId===l.clientId&&x.date===l.date);
        if(rec&&rec.status==='attended'&&!other){
          const choice=await askChoice('Move attendance too?',`<p>You changed the date from <strong>${esc(l.date)}</strong> to <strong>${esc(date)}</strong>. Should the "attended" mark move as well?</p>`,[
            {label:'Cancel',value:'cancel'},{label:'Keep attendance where it is',value:'keep'},{label:'Move attendance',value:'move',kind:'primary'}]);
          if(!choice||choice==='cancel')return false;
          if(choice==='move')move=rec;
        }
      }
      const next={...l,date,conditioningSession:{...cs,results},...(only?{notes:notesVal}:{})};
      try{await Store.put('logs',logId,next);}catch(e){showSaveError(e);return false;}

/* Per-session stats: total sets recorded, and every movement performed
   that day with its best (heaviest) set — no session-wide "top set"
   singled out, since the point is to show the whole session at a glance. */
function sessionSummary(l){
  let totalSets = 0;
  const movements = [];
  workoutLogEntries(l).forEach(e => {
    const sets = loggedExerciseSets(e).filter(s => s.weight != null || s.kg!=null || s.load!=null || s.reps != null || s.rep!=null || s.actualRPE!=null || s.actualRIR!=null || s.note || s.done);
    if (!sets.length) return;
    totalSets += sets.length;
    const best = sets.slice().sort((a,b) => Number(b.weight??b.kg??b.load??0) - Number(a.weight??a.kg??a.load??0))[0];
    movements.push({ name: entryDisplayName(e), weight: best.weight??best.kg??best.load, reps: best.reps??best.rep });
  });
  return { totalSets, movements };
}

/* Weight PRs for every logged session of a client, from one oldest-to-newest pass with running bests
   per exercise (by id and by name). Sessions that tie on date and time don't count against each other. */
function prIndex(cid){
  logIndex();
  if (!Idx.prs) Idx.prs = new Map();
  if (Idx.prs.has(cid)) return Idx.prs.get(cid);
  const logs = (logIndex().byClient[cid] || []).slice().reverse();
  const map = {}, best = new Map();   // best weight so far, per exercise (each equipment variant on its own)
  let i = 0;
  while (i < logs.length){
    let j = i + 1; while (j < logs.length && compareLogsNewestFirst(logs[i], logs[j]) === 0) j++;
    const pending = [];
    for (let k = i; k < j; k++){
      const l = logs[k], prs = [];
      workoutLogEntries(l).forEach(e => {
        const current = loggedExerciseSets(e).filter(s => !isWarmupSet(s)).map(setWeight).filter(v => v !== null && v !== undefined && v !== '').map(Number).filter(n => Number.isFinite(n) && n >= 0);
        if (!current.length) return;
        const max = Math.max(...current), key = entryExerciseKey(e);
        if (!key) return;
        if (best.has(key) && max > best.get(key)) prs.push({ name: entryDisplayName(e) || 'Exercise', weight: max });
        pending.push({ key, max });
      });
      map[l.id] = prs;
    }
    pending.forEach(p => best.set(p.key, Math.max(best.has(p.key) ? best.get(p.key) : -Infinity, p.max)));
    i = j;
  }
  Idx.prs.set(cid, map);
  return map;
}
function sessionMetrics(l,cid){
  let totalVolume=0,hasVolume=false;
  const weightValue=setWeight;
  const entries=workoutLogEntries(l);
  entries.forEach(e=>loggedExerciseSets(e).forEach(s=>{
    const rawWeight=weightValue(s),rawReps=setReps(s),weight=Number(rawWeight),reps=Number(rawReps);
    if(rawWeight!==null&&rawWeight!==undefined&&rawWeight!==''&&rawReps!==null&&rawReps!==undefined&&rawReps!==''&&Number.isFinite(weight)&&weight>=0&&Number.isFinite(reps)&&reps>0){totalVolume+=weight*reps;hasVolume=true;}
  }));
  const completed=Number(l.completedAt||l.loggedAt||l.conditioningSession?.completedAt)||0;
  const started=Number(l.startedAt||l.conditioningSession?.startedAt)||0;
  const duration=Number(l.durationSeconds);
  const durationSeconds=Number.isFinite(duration)&&duration>=0?duration:(started&&completed>=started?Math.floor((completed-started)/1000):null);
  const indexedPrs=prIndex(cid)[l.id];
  const prior=indexedPrs?[]:clientLogs(cid).filter(other=>other.id!==l.id&&isLogBefore(other,l));
  const prs=indexedPrs?indexedPrs.slice():[];
  if(!indexedPrs)entries.forEach(e=>{
    const current=loggedExerciseSets(e).filter(s=>!isWarmupSet(s)).map(weightValue).filter(value=>value!==null&&value!==undefined&&value!=='').map(Number).filter(n=>Number.isFinite(n)&&n>=0);
    if(!current.length)return;
    const max=Math.max(...current),key=entryExerciseKey(e);
    const earlier=key?prior.flatMap(old=>workoutLogEntries(old)).filter(x=>entryExerciseKey(x)===key):[];
    const bestBefore=earlier.flatMap(x=>loggedExerciseSets(x).filter(s=>!isWarmupSet(s))).map(weightValue).filter(value=>value!==null&&value!==undefined&&value!=='').map(Number).filter(n=>Number.isFinite(n)&&n>=0);
    // A PR needs something to beat: the first time a lift is logged is a baseline, not a PR.
    if(bestBefore.length&&max>Math.max(...bestBefore))prs.push({name:entryDisplayName(e)||'Exercise',weight:max});
  });
  const extra=prExtras(cid)[l.id]||{rep:[],e1rm:[]};
  return {durationSeconds,totalVolume:hasVolume?totalVolume:null,prs,repPrs:extra.rep,e1rmPrs:extra.e1rm};
}
function formatSessionDuration(seconds){
  if(seconds==null)return 'Not recorded';
  const value=Math.max(0,Math.floor(seconds)),h=Math.floor(value/3600),m=Math.floor(value%3600/60),s=value%60;
  return h?`${h}h ${m}m`:`${m}m ${s}s`;
}

function historyConditioningHTML(session){

/* ---- Progress: rep and e1RM PRs, charts ----
   Rep PR  = more reps than ever before at the same or a heavier load.
   e1RM PR = a higher estimated 1RM (Epley, sets of 1–12 reps) than ever before.
   Both need something earlier to beat, so a first-ever lift is a baseline, not a PR. */
function prExtras(cid){
  logIndex();
  if (!Idx.prx) Idx.prx = new Map();
  if (Idx.prx.has(cid)) return Idx.prx.get(cid);
  const logs = (logIndex().byClient[cid] || []).slice().reverse();
  const exKey = e => entryExerciseKey(e) || 'n:';   // (each equipment variant has its own records)
  const repBest = new Map(), e1Best = new Map(), map = {};
  let i = 0;
  while (i < logs.length){
    let j = i + 1; while (j < logs.length && compareLogsNewestFirst(logs[i], logs[j]) === 0) j++;
    const pending = [];
    for (let k = i; k < j; k++){
      const l = logs[k], rep = [], e1 = [];
      workoutLogEntries(l).forEach(e => {
        const key = exKey(e); if (key === 'n:') return;
        const sets = loggedExerciseSets(e).filter(s => !isWarmupSet(s)).map(s => ({ w:Number(setWeight(s)), r:Number(setReps(s)) }))
          .filter(s => Number.isFinite(s.w) && s.w > 0 && Number.isFinite(s.r) && s.r > 0);
        if (!sets.length) return;
        const priorReps = repBest.get(key), priorE1 = e1Best.get(key);
        let bestRep = null, bestE1 = null;
        sets.forEach(s => {
          if (priorReps){
            let m = 0; priorReps.forEach((r, w) => { if (w >= s.w && r > m) m = r; });
            if (m > 0 && s.r > m && (!bestRep || s.r > bestRep.reps || (s.r === bestRep.reps && s.w > bestRep.weight))) bestRep = { weight:s.w, reps:s.r };
          }
          if (priorE1 != null && s.r <= 12){ const v = s.w * (1 + s.r / 30); if (v > priorE1 && (bestE1 == null || v > bestE1)) bestE1 = v; }
        });
        const name = entryDisplayName(e) || 'Exercise';
        if (bestRep) rep.push({ name, ...bestRep });
        if (bestE1 != null) e1.push({ name, e1rm:Math.round(bestE1) });
        pending.push({ key, sets });
      });
      map[l.id] = { rep, e1rm:e1 };
    }
    pending.forEach(p => {
      const rb = repBest.get(p.key) || new Map();
      let eb = e1Best.get(p.key);
      p.sets.forEach(s => {
        if ((rb.get(s.w) || 0) < s.r) rb.set(s.w, s.r);
        if (s.r <= 12){ const v = s.w * (1 + s.r / 30); if (eb == null || v > eb) eb = v; }
      });
      repBest.set(p.key, rb); if (eb != null) e1Best.set(p.key, eb);
    });
    i = j;
  }
  Idx.prx.set(cid, map);
  return map;
}
/* "Squat · 100 kg", "Squat · 8 reps at 80 kg", "Squat · est. 1RM 112 kg" */
function prLinesOf(metrics){
  return [
    ...metrics.prs.map(p => `${p.name} · ${p.weight} kg`),
    ...(metrics.repPrs||[]).map(p => `${p.name} · ${p.reps} reps at ${p.weight} kg`),
    ...(metrics.e1rmPrs||[]).map(p => `${p.name} · est. 1RM ${p.e1rm} kg`)
  ];
}
/* Shown after a new session is saved, when it set any record. */
function showPrSummary(logId){

  const lines = prLinesOf(sessionMetrics({ ...l, id:logId }, l.clientId)); if (!lines.length) return;
  dialog('New personal records 🎉', `<ul class="pr-summary">${lines.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, [{label:'Nice', kind:'primary'}]);

const chartNum = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
/* Inline SVG line chart, no library. series: [{name, color, points:[{i, y, label}]}]; i is the session index. */
function lineChartSVG(series, o){
  const W = 320, H = 180, pl = 40, pr = 12, pt = 12, pb = 26, fmt = o.fmt || chartNum;
  const vals = series.flatMap(s => s.points.map(p => p.y));
  if (!vals.length) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi){ lo -= 1; hi += 1; }
  const padY = (hi - lo) * 0.1, floor = Math.min(...vals) >= 0 ? 0 : -Infinity; lo = Math.max(floor, lo - padY); hi += padY;   // (counts and times never go below 0)
  const n = o.count, xAt = i => pl + (n <= 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1)), yAt = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const grid = [0, 1, 2, 3].map(k => { const v = lo + (hi - lo) * k / 3, y = yAt(v); return `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${pl-4}" y="${(y+3).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`; }).join('');
  const lines = series.map(s => `<polyline fill="none" style="stroke:${s.color}" stroke-width="2" points="${s.points.map(p => xAt(p.i).toFixed(1) + ',' + yAt(p.y).toFixed(1)).join(' ')}"/>` +
    s.points.map(p => `<circle class="pt" r="3.5" cx="${xAt(p.i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" style="fill:${s.color}"><title>${esc(s.name)} ${esc(fmt(p.y))} · ${esc(p.label)}</title></circle>`).join('')).join('');
  const first = o.labels[0], last = o.labels[o.labels.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${grid}${lines}
    <text x="${pl}" y="${H-8}" text-anchor="start">${esc(first)}</text>${n > 1 ? `<text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(last)}</text>` : ''}</svg>`;
}
function barChartSVG(values, labels, o){
  const W = 320, H = 130, pl = 24, pr = 8, pt = 10, pb = 22, max = Math.max(1, ...values), slot = (W - pl - pr) / values.length;
  const bars = values.map((v, i) => { const h = (H - pt - pb) * v / max, x = pl + i * slot + slot * 0.15; return `<rect class="bar" x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(slot*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(labels[i])}: ${v}</title></rect>${v ? `<text x="${(x+slot*0.35).toFixed(1)}" y="${(H-pb-h-3).toFixed(1)}" text-anchor="middle">${v}</text>` : ''}`; }).join('');
  const ticks = values.map((v, i) => (i % 4 === 0 || i === values.length - 1) ? `<text x="${(pl+i*slot+slot/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}"><line class="grid" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${bars}${ticks}</svg>`;
}
/* Exercises this client has logged, most-logged first; one option per exercise (each equipment variant on its own),
   whether it was recorded by id or by name. `id` is the exercise's key. */
function progressExercises(cid){
  const opts = new Map();
  clientLogs(cid).forEach(l => {
    const seen = new Set();
    workoutLogEntries(l).forEach(e => {
      const key = entryExerciseKey(e); if (!key) return;
      let o = opts.get(key);
      if (!o){ const ex = S.exercises.find(x => 'id:' + x.id === key); o = { id:key, name:'', label:ex ? exLabelOf(ex) : entryDisplayName(e), sessions:0 }; opts.set(key, o); }
      if (!seen.has(key)){ seen.add(key); o.sessions++; }
    });
  });
  return [...opts.values()].sort((a,b) => b.sessions - a.sessions || a.label.localeCompare(b.label));
}
function exerciseSeries(cid, opt){
  const out = [];
  clientLogs(cid).slice().reverse().forEach(l => {
    let top = null, e1 = null;
    workoutLogEntries(l).filter(e => entryExerciseKey(e) === opt.id).forEach(e => {
      loggedExerciseSets(e).filter(s => !isWarmupSet(s)).forEach(s => {
        const w = Number(setWeight(s)), r = Number(setReps(s));
        if (!Number.isFinite(w) || w <= 0) return;
        if (!top || w > top.w || (w === top.w && r > top.r)) top = { w, r: Number.isFinite(r) ? r : 0 };
        if (Number.isFinite(r) && r > 0 && r <= 12){ const v = Math.round(w * (1 + r / 30)); if (e1 == null || v > e1) e1 = v; }
      });
    });
    if (top) out.push({ date:l.date, top:top.w, reps:top.r, e1rm:e1 });
  });
  return out;
}
/* One number per conditioning block result, so a template's sessions can be compared over time. */
function conditioningScore(r, mode){
  if (!r) return null;
  const m = mode || r.mode;
  if (m === 'forTime') return Number(r.timeSeconds) > 0 ? { v:Number(r.timeSeconds), kind:'time' } : null;   // (a block stopped at 0:00 has no time to compare)
  if (m === 'amrap') return r.roundsCompleted != null ? { v:Number(r.roundsCompleted) + (Number(r.extraReps) || 0) / 100, kind:'rounds' } : null;
  if (r.calories != null) return { v:Number(r.calories), kind:'cal' };
  if (r.roundsCompleted) return { v:Number(r.roundsCompleted), kind:'rounds' };
  return null;
}
function conditioningTrends(cid){
  const groups = new Map();
  clientLogs(cid).slice().reverse().forEach(l => {
    const cs = l.conditioningSession; if (!cs || !Array.isArray(cs.blocks) || !cs.results) return;
    // A block is matched to the same block in other sessions by program, name, timer mode and what's measured,
    // so two blocks that share a name (every new block starts as "Main Block") never end up on one line.
    const seen = new Map();
    cs.blocks.forEach((b, i) => {
      const sc = conditioningScore(cs.results[i], b.mode); if (!sc || !Number.isFinite(sc.v)) return;
      const name = b.name || 'Block ' + (i + 1), base = [cs.templateName || 'Conditioning', name, b.mode, sc.kind].join('|');
      const nth = (seen.get(base) || 0) + 1; seen.set(base, nth);
      const id = base + '|' + nth, key = (cs.templateName || 'Conditioning') + ' · ' + name + (nth > 1 ? ' (' + nth + ')' : '') + ' · ' + conditioningModeName(b.mode);
      if (!groups.has(id)) groups.set(id, { key, kind:sc.kind, mode:b.mode, points:[] });
      groups.get(id).points.push({ date:l.date, v:sc.v });
    });
  });
  return [...groups.values()].sort((a,b) => b.points.length - a.points.length).slice(0, 4);
}
function progressHTML(cid){
  const opts = progressExercises(cid);
  const week = [], d = new Date(), dow = (d.getDay() + 6) % 7;   // Monday-based weeks
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  for (let w = 11; w >= 0; w--){ const s = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - w * 7), e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); week.push({ from:isoOf(s), to:isoOf(e), label:s.toLocaleDateString(undefined, { day:'numeric', month:'short' }) }); }
  const att = attList(cid).filter(a => a.status === 'attended');
  const counts = week.map(w => att.filter(a => a.date >= w.from && a.date < w.to).length);
  const selId = S.sel.progressEx && opts.some(o => (o.id || o.name) === S.sel.progressEx) ? S.sel.progressEx : (opts[0] && (opts[0].id || opts[0].name));
  const opt = opts.find(o => (o.id || o.name) === selId);
  let lift = '<p class="small muted">Log a few sessions to see lift progress here.</p>';
  if (opt){
    const pts = exerciseSeries(cid, opt), labels = pts.map(p => p.date);
    if (!pts.length) lift = '<p class="small muted">No weighted sets logged for this exercise yet.</p>';
    else {
      const top = { name:'Top set (kg)', color:'var(--plate-blue)', points:pts.map((p, i) => ({ i, y:p.top, label:p.date })) };
      const e1 = { name:'Est. 1RM (kg)', color:'var(--series-2)', points:pts.map((p, i) => p.e1rm != null ? { i, y:p.e1rm, label:p.date } : null).filter(Boolean) };
      lift = `${lineChartSVG([top, ...(e1.points.length ? [e1] : [])], { count:pts.length, labels, aria:`${opt.label}: top set went from ${pts[0].top} kg to ${pts[pts.length-1].top} kg over ${pts.length} session${pts.length===1?'':'s'}` })}
        <div class="row tight small muted"><span class="key"><i class="k-slot" style="background:var(--plate-blue)"></i> Top set</span><span class="key"><i class="k-slot" style="background:var(--series-2)"></i> Est. 1RM</span><span class="num">${pts.length} session${pts.length===1?'':'s'}</span></div>`;
    }
  }
  const trends = conditioningTrends(cid);
  const fmtFor = k => k === 'time' ? (v => formatClock(Math.round(v))) : chartNum;
  const cond = trends.map(g => g.points.length < 2
    ? `<div class="small"><strong>${esc(g.key)}</strong> <span class="muted">· ${esc(fmtFor(g.kind)(g.points[0].v))} on ${esc(g.points[0].date)} — one more session to draw a trend</span></div>`
    : `<div><div class="small"><strong>${esc(g.key)}</strong> <span class="muted">${g.kind === 'time' ? '(lower is better)' : g.kind === 'cal' ? '(calories)' : '(rounds)'}</span></div>${lineChartSVG([{ name:g.key, color:'var(--plate-red)', points:g.points.map((p, i) => ({ i, y:p.v, label:p.date })) }], { count:g.points.length, labels:g.points.map(p => p.date), fmt:fmtFor(g.kind), aria:`${g.key}: ${g.points.length} sessions` })}</div>`).join('');
  return `<details class="panel progress-panel" id="progressPanel" open><summary><h3 style="display:inline">Progress</h3></summary>
    <div class="stack" style="margin-top:.6rem">
      <div><label class="field" style="max-width:320px"><span>Lift</span><select id="progressEx">${opts.map(o => `<option value="${esc(o.id || o.name)}" ${(o.id||o.name)===selId?'selected':''}>${esc(o.label)} (${o.sessions})</option>`).join('') || '<option value="">No lifts logged</option>'}</select></label>
        ${lift}</div>
      <div><div class="small"><strong>Sessions attended per week</strong> <span class="muted">· last 12 weeks</span></div>
        ${barChartSVG(counts, week.map(w => w.label), { aria:`Sessions attended per week over the last 12 weeks: ${counts.join(', ')}` })}</div>
      ${cond ? `<div class="stack"><div class="small"><strong>Conditioning scores</strong></div>${cond}</div>` : ''}
    </div></details>`;
}

function historyDayDetail(cid, logId){
  const c = S.clients[cid], l = S.logs[logId];
  if (!c || !l) return '<p>Session not found.</p>';
  const metrics = sessionMetrics(l, cid);
  const norm = v => String(v||'').trim().toLocaleLowerCase().replace(/\s+/g,' ');
  const groups = workoutLogEntries(l).map(e => ({
    name: entryDisplayName(e),
    bar: e.bar && Number(e.bar.kg) >= 0 ? e.bar : null,   // recorded when the session was saved (bar exercises)
    sets: loggedExerciseSets(e).filter(s => s.weight != null || s.kg!=null || s.load!=null || s.reps != null || s.rep!=null || s.actualRPE!=null || s.actualRIR!=null || s.note || s.done)
  })).filter(g => g.sets.length);
  // PRs for one exercise, plus which set rows to mark (the first set that made the heaviest-weight or rep PR).
  const prsFor = g => {
    const n = norm(g.name), same = p => norm(p.name) === n;
    const tags = [], rows = new Set();
    const w = s => Number(s.weight??s.kg??s.load??s.actualWeight), r = s => Number(s.reps??s.rep??s.actualReps);
    metrics.prs.filter(same).forEach(p => { tags.push(`Heaviest ${p.weight} kg`); const i = g.sets.findIndex(s => w(s) === Number(p.weight)); if (i >= 0) rows.add(i); });

/* Browsers allow roughly 5 MB of localStorage per site (it varies), so this is an estimate. */
const LOCAL_STORAGE_BUDGET = 5 * 1000 * 1000;
// Counts everything stored for this address (not just Nyaega's keys) — that total is what the browser's limit applies to.
function localStorageUsage(){
  let used = 0;
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k) used += k.length + (localStorage.getItem(k) || '').length; } } catch {}
  return { used, pct: Math.min(100, Math.round(used / LOCAL_STORAGE_BUDGET * 100)) };
}
function storageUsageHTML(){
  if (LOCAL === 'idb'){
    const e = S.storageEst;
    if (!e || !e.quota) return '<div class="small muted" id="storageBox">Storage: measuring…</div>';
    const pct = Math.min(100, Math.round(e.usage / e.quota * 100)), mb = (e.usage / 1000000).toFixed(e.usage < 100000 ? 2 : 1);
    const level = pct >= 90 ? 'full' : pct >= 75 ? 'warn' : '';
    return `<div id="storageBox"><div class="small"><strong>Storage used by this app:</strong> about ${mb} MB (${pct}% of what this browser allows)</div>
      <div class="storage-meter ${level}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Storage used"><i style="width:${Math.max(pct,1)}%"></i></div>
      <div class="small ${level ? '' : 'muted'}">${level ? 'Storage is getting full — export a backup now.' : ''}</div></div>`;
  }
  const { used, pct } = localStorageUsage();
  const mb = (used / 1000000).toFixed(used < 100000 ? 2 : 1);
  const level = pct >= 90 ? 'full' : pct >= 75 ? 'warn' : '';
  const note = pct >= 90 ? 'Storage is nearly full — export a backup now. New sessions may fail to save.'
    : pct >= 75 ? 'Storage is filling up — export a backup soon.'
    : 'Approximate — browsers allow around 5 MB and it varies.';
  return `<div><div class="small"><strong>Storage used on this device:</strong> about ${mb} MB of ~5 MB (${pct}%)</div>
    <div class="storage-meter ${level}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Storage used"><i style="width:${Math.max(pct,1)}%"></i></div>

}

/* ---------------------------------------------------------------
   Safe input: nothing from a file or from the server reaches the app unchecked.
----------------------------------------------------------------*/
const MAX_IMPORT_BYTES = 50 * 1000 * 1000;
const DANGEROUS_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
/* JSON.parse that drops keys used for prototype pollution. */
function safeParse(text){ return JSON.parse(text, (k, v) => DANGEROUS_KEYS.has(k) ? undefined : v); }
function sanitizeDoc(doc){ return safeParse(JSON.stringify(doc)); }
/* A record that arrived from the server must be the right shape, with a safe id and a sane size. */
function validRemoteDoc(coll, id, doc){
  if (!SAFE_ID.test(String(id))) return false;
  if (coll === 'exercises'){
    if (String(id) === 'library') return isPlainObject(doc) && Array.isArray(doc.list) && doc.list.length < 5000 && doc.list.every(e => isPlainObject(e) && typeof e.name === 'string' && SAFE_ID.test(String(e.id)));
    return isPlainObject(doc) && typeof doc.name === 'string' && doc.name.length < 200 && JSON.stringify(doc).length < 5000;
  }
  if (!isPlainObject(doc)) return false;
  const check = IMPORT_CHECKS[coll]; if (check && !check(doc)) return false;
  try { if (JSON.stringify(doc).length > 1000000) return false; } catch { return false; }
  return true;
}

/* ---------------------------------------------------------------
   Encrypted backup: AES-256-GCM, key derived from a passphrase with PBKDF2-SHA256 (Web Crypto).
   The passphrase is never stored; without it the file cannot be opened.
----------------------------------------------------------------*/
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveBackupKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function encryptBackup(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const key = await deriveBackupKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text)));
  return JSON.stringify({ app:'nyaega-encrypted', v:1, kdf:'PBKDF2-SHA256', iter, salt:b64(salt), iv:b64(iv), data:b64(ct) });
}
async function decryptBackup(obj, pass){
  if (!isPlainObject(obj) || obj.v !== 1 || typeof obj.salt !== 'string' || typeof obj.iv !== 'string' || typeof obj.data !== 'string' || !Number.isInteger(obj.iter) || obj.iter < 100000 || obj.iter > 2000000)
    throw new Error('That is not a valid encrypted backup.');
  try {
    const key = await deriveBackupKey(pass, unb64(obj.salt), obj.iter);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(obj.iv) }, key, unb64(obj.data));
    return new TextDecoder().decode(pt);
  } catch { throw new Error('Wrong passphrase, or the file was changed.'); }
}

/* ---------------------------------------------------------------
   Installable app. Only active on the built site (served over http/https with a manifest and sw.js).
   A new version waits until the coach taps "Reload to update"; nothing reloads by itself mid-session.
----------------------------------------------------------------*/
function registerServiceWorker(){
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http') || !document.querySelector('link[rel="manifest"]')) return;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => { if (reg.waiting && navigator.serviceWorker.controller) showUpdateReady(reg); };
    check();
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') check(); }); });
    setInterval(() => { reg.update().catch(() => {}); }, 60 * 60 * 1000);
  }).catch(e => console.warn('Offline mode is not available', e));
}
function showUpdateReady(reg){
  if (document.getElementById('updateBar')) return;
  const bar = document.createElement('div'); bar.id = 'updateBar'; bar.className = 'update-bar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span>Update ready.</span><button type="button" class="btn sm primary" id="updateNow">Reload to update</button><button type="button" class="btn sm ghost" id="updateLater">Later</button>';
  document.body.appendChild(bar);
  bar.querySelector('#updateLater').onclick = () => bar.remove();
  bar.querySelector('#updateNow').onclick = () => { try { flushWorkoutAutosave(); } catch {} reg.waiting && reg.waiting.postMessage('skipWaiting'); };
}

/* ---- import: validate a backup and plan the merge before anything is written ---- */
const IMPORT_LABELS = { clients:'clients', groups:'pairings', programs:'programs', logs:'logged sessions', attendance:'attendance marks', conditioning:'conditioning programs', schedule:'one-off sessions', scheduleExceptions:'skipped sessions' };
const SAFE_ID = /^[\w.:-]{1,100}$/;   // ids the app generates; also keeps crafted ids out of HTML attributes
const isPlainObject = v => !!v && typeof v === 'object' && !Array.isArray(v);
const isISODate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
// The minimum each record needs so the screens that read it can't break.
const IMPORT_CHECKS = {
  clients: d => typeof d.name === 'string' && d.name.trim() !== '',
  groups: d => typeof d.name === 'string' && (d.dow == null || Array.isArray(d.dow)),
  programs: d => typeof d.name === 'string' && Array.isArray(d.days) && d.days.every(day => isPlainObject(day) && Array.isArray(day.items)),
  logs: d => typeof d.clientId === 'string' && isISODate(d.date),
  attendance: d => typeof d.clientId === 'string' && isISODate(d.date) && typeof d.status === 'string',
  conditioning: d => typeof d.name === 'string' && (d.blocks == null || Array.isArray(d.blocks)),
  schedule: d => isISODate(d.date) && Array.isArray(d.clientIds),
  scheduleExceptions: d => isISODate(d.date) && typeof d.key === 'string'
};
function planImport(data){
  const plan = { records:[], counts:{}, exercisesToAdd:[], exercisesKept:0, exercisesMatched:0, skipped:0, reasons:[] };
  const skip = reason => { plan.skipped++; if (plan.reasons.length < 5) plan.reasons.push(reason); };
  for (const coll of COLLS){
    const counts = plan.counts[coll] = { added:0, replaced:0 };
    const section = data[coll];
    if (section == null) continue;
    if (!isPlainObject(section)){ skip(`"${coll}" isn't in the expected format`); continue; }
    for (const [id, doc] of Object.entries(section)){
      if (!SAFE_ID.test(id)){ skip(`a ${IMPORT_LABELS[coll].replace(/s$/,'')} with an invalid id`); continue; }
      if (!isPlainObject(doc) || !IMPORT_CHECKS[coll](doc)){ skip(`${IMPORT_LABELS[coll]} record "${id}" is incomplete`); continue; }
      const exists = Object.prototype.hasOwnProperty.call(S[coll], id);
      counts[exists ? 'replaced' : 'added']++;
      plan.records.push({ coll, id, doc: JSON.parse(JSON.stringify(doc)) });
    }
  }
  // Exercise library merge. Same id → keep ours. Same name, different id (e.g. the starter
  // exercises, which get new ids in every browser) → use ours and point imported records at it.
  const remap = {};
  if (data.exercises != null){
    if (!Array.isArray(data.exercises)) skip('the exercise library isn\'t in the expected format');
    else {
      const have = new Set(S.exercises.map(e => String(e.id))), adding = new Set();
      const known = activeExercises().slice();   // matched by name and equipment, so a variant is added, not merged
      for (const ex of data.exercises){
        if (!isPlainObject(ex) || typeof ex.id !== 'string' || !SAFE_ID.test(ex.id) || typeof ex.name !== 'string' || !ex.name.trim()){ skip('an exercise with a missing name or invalid id'); continue; }
        if (have.has(ex.id) || adding.has(ex.id)){ plan.exercisesKept++; continue; }
        const equipment = typeof ex.equipment === 'string' ? ex.equipment : '';
        const same = !ex.archived && findExerciseVariant(known, ex.name, equipment);
        if (same){ remap[ex.id] = String(same.id); plan.exercisesMatched++; continue; }
        adding.add(ex.id);
        const added = { id: ex.id, name: ex.name.trim(), category: typeof ex.category === 'string' ? ex.category : 'Other', equipment, ...(ex.archived === true ? { archived: true } : {}) };
        if (!ex.archived) known.push(added);
        plan.exercisesToAdd.push(added);
      }
    }
  }
  if (Object.keys(remap).length){
    const fix = obj => { if (!isPlainObject(obj)) return; for (const k of ['exId','exerciseId']) if (typeof obj[k] === 'string' && remap[obj[k]]) obj[k] = remap[obj[k]]; };
    for (const { coll, doc } of plan.records){
      if (coll === 'programs') (doc.days||[]).forEach(day => (day.items||[]).forEach(fix));
      if (coll === 'logs') ['entries','exercises'].forEach(k => { if (Array.isArray(doc[k])) doc[k].forEach(fix); });
    }
  }
  return plan;
}
function importSummaryHTML(plan, fileName){
  const rows = COLLS.filter(c => plan.counts[c].added || plan.counts[c].replaced).map(c => {
    const { added, replaced } = plan.counts[c];
    return `<tr><td>${esc(IMPORT_LABELS[c])}</td><td class="num">${added}</td><td class="num">${replaced}</td></tr>`;
  }).join('');
  return `<p class="small muted">From <strong>${esc(fileName)}</strong>. Nothing has been changed yet.</p>
    ${rows ? `<div class="tablewrap"><table><thead><tr><th>What</th><th>New</th><th>Replaces yours</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted">"Replaces yours" means a record with the same id already exists here; the backup's version will overwrite it.</p>` : '<p>No records to import.</p>'}
    <p class="small"><strong>Exercise library:</strong> ${plan.exercisesToAdd.length} new exercise${plan.exercisesToAdd.length===1?'':'s'} will be added${(plan.exercisesKept + plan.exercisesMatched) ? `; ${plan.exercisesKept + plan.exercisesMatched} you already have will be kept as ${(plan.exercisesKept + plan.exercisesMatched)===1?'it is':'they are'}` : ''}. Nothing in your library is removed.${plan.exercisesMatched ? ' Imported programs and sessions will use your existing exercises where the names match.' : ''}</p>
    ${plan.skipped ? `<p class="small"><strong>${plan.skipped} item${plan.skipped===1?'':'s'} will be skipped</strong> because ${plan.skipped===1?'it is':'they are'} damaged or incomplete, e.g. ${plan.reasons.map(esc).join('; ')}.</p>` : ''}`;
}
async function runImport(plan){
  let imported = 0;
  try {
    // In data-file mode this writes the file once at the end instead of once per record.
    await Store.batch(async () => {
      for (const { coll, id, doc } of plan.records){ await Store.put(coll, id, doc); S[coll][id] = doc; imported++; }
    });
  } catch(e){
    if (!isStorageError(e)) throw e;
    if (MODE === 'file') imported = 0;   // the batch was undone as a whole
    showSaveError(e); toast(imported ? `Import stopped after ${imported} of ${plan.records.length} records — the rest were not saved` : 'Import failed — nothing was saved'); render(); return;
  }
  if (plan.exercisesToAdd.length && !(await saveExerciseList([...S.exercises, ...plan.exercisesToAdd]))){
    toast(`Imported ${imported} records, but the new exercises were not saved`); render(); return;
  }
  await migratePackOffsets();
  invalidateLogIndex(); invalidateAttIndex();
  try { await migrate(0, { force:true }); } catch(e){ showSaveError(e); }
  Audit.log('import', { records:imported });
  const parts = [`Imported ${imported} record${imported===1?'':'s'}`];
  if (plan.exercisesToAdd.length) parts.push(`${plan.exercisesToAdd.length} new exercise${plan.exercisesToAdd.length===1?'':'s'}`);
  if (plan.skipped) parts.push(`${plan.skipped} skipped`);
  toast(parts.join(' · ')); render();
}
/* One CSV cell. Text starting with = + - @ (or a tab/return) is prefixed with ' so spreadsheet
   apps show it as text instead of running it as a formula. Real numbers are left alone. */
function csvCell(v){
  let s = v == null ? '' : String(v);
  if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function attendanceCsv(){
  const rows = [['date','weekday','client','status','pairing']];
  Object.values(S.attendance).sort((a,b) => (a.date||'').localeCompare(b.date||'')).forEach(a => {
    rows.push([a.date, DOW[dowOf(a.date)], (S.clients[a.clientId]||{}).name || a.clientId, a.status, (S.groups[a.groupId]||{}).name || '']);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\n');
}
function logsCsv(){
  const rows = [['date','client','day','exercise','set','weight','reps','notes','actual_rpe','actual_rir','set_type','set_note','target_rpe','block_mode','block_rounds','block_extra_reps','block_time_seconds','block_calories','block_distance_m']];
  const noBlock = ['','','','','',''];
  Object.values(S.logs).sort((a,b) => (a.date||'').localeCompare(b.date||'')).forEach(l => {
    const cname = (S.clients[l.clientId] || {}).name || l.clientId;
    workoutLogEntries(l).forEach(e => loggedExerciseSets(e).forEach((s,i) => {
      if (setWeight(s)==null&&setReps(s)==null&&setRPE(s)==null&&s.actualRIR==null&&!s.note&&!s.done) return;
      rows.push([l.date, cname, l.dayLabel||'', loggedEntryName(e), s.setNumber||i+1, setWeight(s)??'', setReps(s)??'', (l.notes||'').replace(/\n/g,' '),setRPE(s)??'',s.actualRIR??'',s.setType||'working',(s.note||'').replace(/\n/g,' '),e.targetRPE||'', ...noBlock]);
    }));
    // Conditioning blocks: one row each (exercise = "Conditioning · template · block"), results in the block_* columns.
    const cs = l.conditioningSession;
    if (cs && Array.isArray(cs.blocks)){
      const done = new Set(cs.blocksCompleted || []);
      cs.blocks.forEach((b,i) => {
        const r = (cs.results || {})[i];
        if (!r && !done.has(i)) return;
        rows.push([l.date, cname, l.dayLabel||'', `Conditioning · ${cs.templateName||'Conditioning'} · ${b.name||'Block '+(i+1)}`, '', '', '', ((r&&r.note)||'').replace(/\n/g,' '), r?.rpe ?? '', '', 'conditioning', '', '',
          conditioningModeName(b.mode), r?.roundsCompleted ?? '', r?.extraReps ?? '', r?.timeSeconds ?? '', r?.calories ?? '', r?.distance ?? '']);
      });
    }
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\n');
}

      {label:'Restore', kind:'danger', onClick: async () => { try { await restoreSnapshot(key); } catch(e){ S.restoring = false; if (isStorageError(e)) showSaveError(e); else toast('Restore failed — ' + e.message); return false; } }}
    ]);
  });
  if (document.getElementById('snapshotList') || document.getElementById('storageBox')){
    (async () => {
      try {
        if (MODE === 'local' && LOCAL === 'idb'){
          const list = await listSnapshots(); await refreshStorageEstimate();
          if (JSON.stringify(list) !== JSON.stringify(S.snapshotList)){ S.snapshotList = list; render({ keepScroll:true }); return; }
          const box = document.getElementById('storageBox'); if (box){ const tmp = document.createElement('div'); tmp.innerHTML = storageUsageHTML(); box.replaceWith(tmp.firstElementChild); }
        }
      } catch(e){ console.warn('Could not refresh the backups panel', e); }
    })();
  }
  const ec = document.getElementById('exportCsv');
  if (ec) ec.onclick = () => { if (assistantBlocked()) return; Audit.log('export', { kind:'sessions csv' }); download('nyaega-sessions-' + todayISO() + '.csv', logsCsv(), 'text/csv'); };
  const ea = document.getElementById('exportAtt');
  if (ea) ea.onclick = () => { if (assistantBlocked()) return; Audit.log('export', { kind:'attendance csv' }); download('nyaega-attendance-' + todayISO() + '.csv', attendanceCsv(), 'text/csv'); };
  const er = document.getElementById('exportRoster');
  if (er) er.onclick = () => { if (assistantBlocked()) return; Audit.log('export', { kind:'roster' }); downloadRosterXlsx(); };
  const ib = document.getElementById('importBtn');
  if (ib) ib.onclick = () => document.getElementById('importFile').click();
  const fileInput = document.getElementById('importFile');
  if (fileInput) fileInput.onchange = async () => {
    const f = fileInput.files[0]; if (!f) return;
    fileInput.value = '';   // lets the same file be chosen again later
    if (f.size > MAX_IMPORT_BYTES){ toast('That file is too large to be a Nyaega backup'); return; }
    let data;
    try { data = safeParse(await f.text()); }
    catch(e){ toast('That file did not import — it isn\'t a valid backup file'); return; }
    if (isPlainObject(data) && data.app === 'nyaega-encrypted'){
      dialog('Encrypted backup', '<p class="small muted">Enter the passphrase you used when you exported it.</p><label class="field"><span>Passphrase</span><input type="password" id="impPass" autocomplete="off"></label>', [{label:'Cancel'},{label:'Unlock', kind:'primary', onClick: async () => {
        let plain;
        try { plain = safeParse(await decryptBackup(data, document.getElementById('impPass').value)); }
        catch(e){ toast(e.message || 'Could not unlock that file'); return false; }
        setTimeout(() => startImport(plain, f.name), 80);
      }}]);
      return;
    }
    startImport(data, f.name);
  };
  m.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => {
    const t = b.dataset.theme;
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('nyaega:theme', t); } catch {}
  });
  const soundCues = document.getElementById('soundCues');
  if (soundCues) soundCues.onchange = () => { Cues.setMuted(!soundCues.checked); Cues.unlock(); toast(soundCues.checked ? 'Workout sounds on' : 'Workout sounds off'); };
  const fileOpen = document.getElementById('fileOpen');
  if (fileOpen) fileOpen.onclick = openDataFile;
  const fileNew = document.getElementById('fileNew');
  if (fileNew) fileNew.onclick = newDataFile;
  const fileDisconnect = document.getElementById('fileDisconnect');
  if (fileDisconnect) fileDisconnect.onclick = () => dialog('Disconnect this file',
    '<p>The page will reload and fall back to browser storage. The file itself is untouched — reconnect to it anytime.</p>',
    [{label:'Cancel'},{label:'Disconnect', kind:'danger', onClick: disconnectFile}]);

  wireConditioning();
  wireConditioningWorkout();

  const wipe = document.getElementById('wipe');
  if (wipe) wipe.onclick = () => assistantBlocked() ? null : dialog('Delete all data',
    '<p>Every client, program and logged session goes. Export a backup first if you might want any of it.</p>' + (Sync.linkedId ? '<label class="row tight small" style="gap:.4rem;align-items:flex-start;margin-top:.6rem"><input type="checkbox" id="wipeOnline" checked style="width:auto;margin-top:.2rem"> Also delete my online copy (recommended). If unticked, the online copy stays and comes back the next time you sign in.</label>' : ''),
    [{label:'Cancel'},{label:'Delete everything', kind:'danger', onClick: async () => {
      const alsoOnline = !!(document.getElementById('wipeOnline') && document.getElementById('wipeOnline').checked);
      try {
        // In data-file mode: one file write for the whole delete (undone as a whole if it fails).
        await Store.batch(async () => {
          for (const coll of COLLS){ for (const id of Object.keys(S[coll])){ await Store.del(coll, id); delete S[coll][id]; } }
          invalidateLogIndex(); invalidateAttIndex();
        });
      } catch(e){ showSaveError(e); S.sel = {}; toast(MODE === 'file' ? 'Delete failed — nothing was deleted' : 'Delete stopped part-way — some data is still stored'); render(); return; }
      if (!(await saveExerciseList(SEED_EXERCISES))){ S.sel = {}; render(); return; }
      // Unfinished-workout copies belong to the deleted clients too.
      clearTimeout(activeWorkoutSaveTimer); activeWorkoutSaveTimer = null;
      try { await Store.putMeta('activeWorkoutDraft', null); await Store.putMeta('activeSessions', null); await Store.putMeta('workoutDraftArchive', []); }
      catch(e){ showSaveError(e); }
      S.recoveryList = []; S.sessions = []; S.recoverySaved = false; S.recoveryArchive = []; S.parkedWorkout = null;
      await clearBackupsAfterWipe();
      await Audit.log('delete-all');
      if (alsoOnline){
        // the deletions are already queued: push them now, or keep them queued until the next sign-in
        S.sel = {};
        if (Sync.signedIn()){ try { await Sync.run(); } catch {} }
        toast(Sync.signedIn() && !Sync.pending ? 'Everything deleted, including your online copy' : 'Everything deleted here. The online copy is deleted when you next sign in and sync.');
        render(); return;
      }
      try { await IDB.run(['outbox', 'versions', 'conflicts'], 'readwrite', tx => { ['outbox', 'versions', 'conflicts'].forEach(s => tx.objectStore(s).clear()); }); await Store.putMeta('syncInitial', null); await Store.putMeta('syncCursor', null); S.conflicts = []; await Sync.signOut(); } catch {}
      S.sel = {}; toast('Everything deleted from this device. Your online copy was kept.'); render();
    }}]);
}

function groupDialog(gid){
  const g = gid ? S.groups[gid] : { name:'', time:'' };
  const clients = Object.entries(S.clients).map(([id,c]) => ({id,...c})).sort(byName);
  const dlg = dialog(gid ? 'Edit pairing' : 'Add pairing',
    `<label class="field"><span>Name</span><input type="text" id="g_name" value="${esc(g.name)}" placeholder="e.g. Amina &amp; Beatrice, or just Amina"></label>
     ${timeFieldHTML('g_time', g.time, 'Time')}
     <label class="field"><span>Repeats on</span></label>
     <div class="row tight" style="margin-bottom:.6rem">${DOW.map((d,i) => `<label class="row tight small" style="gap:.2rem">
        <input type="checkbox" class="gdow" value="${i}" ${(g.dow||[]).includes(i)?'checked':''} style="width:auto"> ${d}</label>`).join('')}</div>
     ${recurrenceFieldsHTML('g', groupRule(g))}
     <label class="field"><span>Who's in it — one client for 1:1, two for a pairing, never more</span></label>
     <div class="stack small">${clients.map(c => `<label class="row tight" style="gap:.4rem">
        <input type="checkbox" class="gmem" value="${esc(c.id)}" ${c.groupId===gid?'checked':''} style="width:auto"> ${esc(c.name)}</label>`).join('') || '<span class="muted">No clients yet.</span>'}</div>`,
    [ ...(gid ? [{label:'Delete', kind:'danger', onClick: async () => {
        try {
          await Store.del('groups', gid); delete S.groups[gid];
          for (const [id,c] of Object.entries(S.clients)) if (c.groupId === gid){ const next = { ...c, groupId: '' }; await Store.put('clients', id, next); S.clients[id] = next; }
        } catch(e){ showSaveError(e); }
        render();
      }}] : []),
      {label:'Cancel'},
      {label:'Save', kind:'primary', onClick: async () => {
        const name = val('g_name'); if (!name){ toast('Name is required'); return false; }
        const checked = [...document.querySelectorAll('.gmem:checked')].map(i => i.value);
        if (checked.length > 2){ toast('A pairing can have at most 2 clients — uncheck one'); return false; }
        const id = gid || uid();
        const dow = [...document.querySelectorAll('.gdow:checked')].map(i => Number(i.value));
        const rec = readRecurrence(dlg, 'g', dow); if (!rec) return false;
        const data = { name, dow, time: timeFieldVal('g_time'), ...(rec.every > 1 ? { every:rec.every } : {}), ...(rec.start ? { start:rec.start } : {}), ...(rec.end ? { end:rec.end } : {}) };
        if (gid){
          if (g.dowFrom) data.dowFrom = g.dowFrom;
          const dk = a => JSON.stringify([...(a || [])].sort());
          if (dk(dow) !== dk(g.dow) || rec.every !== (Number(g.every) || 1) || rec.start !== (g.start || '')) data.dowFrom = todayISO();   // missed-session counting restarts from today
        }
        try { await Store.put('groups', id, data); } catch(e){ showSaveError(e); return false; }
        S.groups[id] = data;
        const checkedSet = new Set(checked);
        try {
          for (const [cid,c] of Object.entries(S.clients)){
            const should = checkedSet.has(cid);
            if (should && c.groupId !== id){ const next = { ...c, groupId: id, groupFrom: todayISO() }; await Store.put('clients', cid, next); S.clients[cid] = next; }
            else if (!should && c.groupId === id){ const next = { ...c, groupId: '' }; await Store.put('clients', cid, next); S.clients[cid] = next; }
          }
        } catch(e){ showSaveError(e); toast('Pairing saved, but some members were not updated'); }
        render();
      }} ]);
  wireRecurrenceFields(dlg, 'g', () => [...dlg.querySelectorAll('.gdow:checked')].map(i => Number(i.value)));
  dlg.querySelectorAll('.gmem').forEach(box => box.onchange = () => {
    const checked = dlg.querySelectorAll('.gmem:checked');
    if (checked.length > 2){ box.checked = false; toast('A pairing can have at most 2 clients'); }
  });
}

(() => {
  const link = document.querySelector('link[rel="icon"]'); if (!link) return;
  const sys = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  const sync = () => {
    const t = document.documentElement.getAttribute('data-theme');
    const dark = t === 'dark' || (t !== 'light' && !!(sys && sys.matches));
    const href = dark ? 'icon-dark-192.png' : 'icon-192.png';
    if (link.getAttribute('href') !== href) link.setAttribute('href', href);
  };

  if (sys && sys.addEventListener) sys.addEventListener('change', sync);
})();

const navSvg = (paths, w = 1.9) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

/* Same effect as the top tabs: park any open workout, leave the program editor saved, go to the screen.
   `sel` opens something on that screen (a client, a program); by default the screen opens at its start. */
function navigateTo(view, sub, sel){
  flushProgramEditor(); parkWorkout();
  S.view = view; if (view === 'dashboard') S.sub = sub || 'today';
  S.sel = sel || (view === 'programs' ? { programSection:'programs' } : {});
  render(); window.scrollTo({ top:0 });
}
/* Which bottom-bar tab is current; '' for Home, Schedule and Settings, which are reached from the header. */
function navKeyNow(){
  const v = S.view === 'session' ? ((S.returnTo && S.returnTo.view) || 'dashboard') : S.view;
  if (v === 'dashboard'){ const s = S.sub || 'today'; return s === 'clients' ? 'clients' : s === 'groups' ? 'pairings' : ''; }
  if (v === 'programs' || v === 'conditioning') return 'programs';
  return v === 'exercises' || v === 'history' ? v : '';
}
function ensureMobileNav(){
  if (document.getElementById('bottomNav')) return;
  const nav = document.createElement('nav'); nav.id = 'bottomNav'; nav.setAttribute('aria-label', 'Main'); nav.hidden = true;
  nav.innerHTML = MOBILE_NAV.map(([k, label]) => `<button type="button" data-bn="${k}" aria-current="false">${navSvg(NAV_ICON[k])}<span>${label}</span></button>`).join('');
  const fab = document.createElement('button'); fab.type = 'button'; fab.id = 'fab'; fab.hidden = true;
  fab.setAttribute('aria-label', 'Quick actions'); fab.setAttribute('aria-haspopup', 'menu'); fab.setAttribute('aria-expanded', 'false'); fab.innerHTML = navSvg('<path d="M12 5v14M5 12h14"/>', 2.8);
  const menu = document.createElement('div'); menu.id = 'navMenu'; menu.setAttribute('role', 'menu'); menu.hidden = true;
  document.body.append(nav, fab, menu);
  nav.querySelectorAll('[data-bn]').forEach(b => b.onclick = () => navPress(b.dataset.bn));
  fab.onclick = () => navMenuIsOpen('fab') ? closeNavMenu() : openNavMenu('fab', quickActionItems());
  wireHeader();
  document.addEventListener('click', e => { if (navMenuIsOpen() && !e.target.closest('#navMenu, #fab, #hdrProfile')) closeNavMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && navMenuIsOpen()){ const a = document.getElementById('navMenu').dataset.anchor; closeNavMenu(); const f = document.getElementById(a === 'profile' ? 'hdrProfile' : 'fab'); if (f) f.focus(); } });

function navPress(k){
  if (k === 'clients') return navigateTo('dashboard', 'clients');
  if (k === 'pairings') return navigateTo('dashboard', 'groups');
  if (k === 'programs') return navigateTo('programs');
  navigateTo(k);   // exercises, history
}
const navMenuIsOpen = anchor => { const m = document.getElementById('navMenu'); return !!m && !m.hidden && (!anchor || m.dataset.anchor === anchor); };
function closeNavMenu(){
  const m = document.getElementById('navMenu'); if (m){ m.hidden = true; m.innerHTML = ''; }
  const f = document.getElementById('fab'); if (f){ f.setAttribute('aria-expanded', 'false'); f.classList.remove('open'); }
  const p = document.getElementById('hdrProfile'); if (p) p.setAttribute('aria-expanded', 'false');
}
function openNavMenu(anchor, items, headHTML = ''){
  const m = document.getElementById('navMenu'); if (!m) return;
  m.dataset.anchor = anchor; m.hidden = false;
  m.innerHTML = headHTML + items.map((it, i) => `<button type="button" role="menuitem" data-mi="${i}"${it.danger ? ' class="menu-danger"' : ''}>${it.icon ? navSvg(NAV_ICON[it.icon]) : ''}<span>${esc(it.label)}${it.note ? `<small>${esc(it.note)}</small>` : ''}</span></button>`).join('');
  m.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => { const it = items[Number(b.dataset.mi)]; closeNavMenu(); it.go(); });
  const f = document.getElementById('fab'); if (f && anchor === 'fab'){ f.setAttribute('aria-expanded', 'true'); f.classList.add('open'); }
  const p = document.getElementById('hdrProfile'); if (p && anchor === 'profile') p.setAttribute('aria-expanded', 'true');
  const first = m.querySelector('button'); if (first) { try { first.focus({ preventScroll:true }); } catch {} }

/* Called at the end of every render(). */
function updateBottomNav(){
  ensureMobileNav();
  const show = S.bootState === 'ready' && !document.body.classList.contains('in-session');
  const nav = document.getElementById('bottomNav'), fab = document.getElementById('fab');
  nav.hidden = !show; fab.hidden = !show;
  document.body.classList.toggle('has-bottomnav', show);
  if (!show) closeNavMenu();
  const cur = navKeyNow();
  nav.querySelectorAll('[data-bn]').forEach(b => b.setAttribute('aria-current', String(b.dataset.bn === cur)));
  const acts = document.getElementById('topActions'); if (acts) acts.hidden = S.bootState !== 'ready';

/* ---- header search: clients, pairings, programs and exercises ---- */
function searchResults(q){
  const n = String(q || '').trim().toLocaleLowerCase(); if (!n) return [];
  const has = (...vals) => vals.some(v => String(v || '').toLocaleLowerCase().includes(n));
  const out = [];
  Object.entries(S.clients).filter(([, c]) => has(c.name, c.email)).sort((a, b) => byName(a[1], b[1]))
    .forEach(([id, c]) => out.push({ kind:'Clients', label:c.name, note:c.status === 'archived' ? 'Archived' : ((S.programs[c.programId] || {}).name || ''), go:() => navigateTo('dashboard', 'clients', { client:id }) }));
  Object.entries(S.groups).filter(([id, g]) => has(g.name, ...groupMembers(id).map(m => m.name))).sort((a, b) => byName(a[1], b[1]))
    .forEach(([, g]) => out.push({ kind:'Pairings', label:g.name || 'Pairing', note:'', go:() => navigateTo('dashboard', 'groups') }));
  Object.entries(S.programs).filter(([, p]) => has(p.name)).sort((a, b) => byName(a[1], b[1]))
    .forEach(([id, p]) => out.push({ kind:'Programs', label:p.name, note:'Strength', go:() => navigateTo('programs', '', { programsKind:'strength', program:id }) }));
  Object.entries(S.conditioning).filter(([, p]) => has(p.name)).sort((a, b) => byName(a[1], b[1]))
    .forEach(([id, p]) => out.push({ kind:'Programs', label:p.name, note:'Conditioning', go:() => navigateTo('programs', '', { programsKind:'conditioning', conditioningId:id, conditioningDraft:null }) }));
  S.exercises.filter(e => has(e.name, e.category, e.equipment)).sort(byName)
    .forEach(e => out.push({ kind:'Exercises', label:e.name, note:[e.category, e.archived ? 'Archived' : ''].filter(Boolean).join(' · '), go:() => { S.search.exercises = e.name; navigateTo('exercises'); } }));
  return out;
}
function openSearch(){
