/* Schema v2: starter exercises get the same id on every device. Old random starter ids are remapped by name in the
   library, programs, logs and any open sessions. */
async function migrateSeedIds(){
  const seeds = new Map(SEED_EXERCISES.filter(e => !isSeedVariant(e)).map(e => [normExName(e.name), e]));   // (the original of each name)
  const have = new Set(S.exercises.map(e => e.id)), map = {}, claimed = new Set();
  const next = S.exercises.map(e => {
    const s = seeds.get(normExName(e.name));
    if (!s || e.id === s.id || have.has(s.id) || claimed.has(s.id)) return e;
    if (e.equipment && normExName(e.equipment) !== normExName(s.equipment)) return e;   // a variant, not the starter exercise
    claimed.add(s.id); map[e.id] = s.id; return { ...e, id:s.id };
  });
  if (!Object.keys(map).length) return 0;
  if (!(await saveExerciseList(next))) throw new Error('Could not save the exercise library');
  await relinkExerciseIds(map);
  return Object.keys(map).length;
}
/* Points programs, conditioning stations, saved sessions and open workouts from one exercise id to another
   ({ oldId:newId }). Only the link changes: what was logged (names, sets, notes) is left exactly as it was. */
async function relinkExerciseIds(map){
  const progPairs = [], condPairs = [], logPairs = [];
  for (const [id, p] of Object.entries(S.programs)){
    let ch = false; (p.days || []).forEach(d => (d.items || []).forEach(it => { if (map[it.exId]){ it.exId = map[it.exId]; ch = true; } }));
    if (ch) progPairs.push([id, p]);
  }
  for (const [id, w] of Object.entries(S.conditioning)){
    let ch = false; (w.blocks || []).forEach(b => (b.steps || []).forEach(s => { if (map[s.exId]){ s.exId = map[s.exId]; ch = true; } }));
    if (ch) condPairs.push([id, w]);
  }
  for (const [id, l] of Object.entries(S.logs)){
    let ch = false; workoutLogEntries(l).forEach(e => { for (const k of ['exId', 'exerciseId', 'movementId']) if (map[e[k]]){ e[k] = map[e[k]]; ch = true; } });
    if (ch) logPairs.push([id, l]);
  }
  await Store.batch(async () => {
    if (progPairs.length) await Store.bulkPut('programs', progPairs, S.programs);
    if (condPairs.length) await Store.bulkPut('conditioning', condPairs, S.conditioning);
    if (logPairs.length) await Store.bulkPut('logs', logPairs, S.logs);
  });
  const fix = dr => ((dr && dr.entries) || []).forEach(e => { if (map[e.exId]) e.exId = map[e.exId]; });
  fix(S.sel && S.sel.draft); fix(S.parkedWorkout && S.parkedWorkout.draft); S.sessions.forEach(r => fix(r.draft)); (S.recoveryArchive || []).forEach(r => fix(r.draft));
  invalidateLogIndex();
  return logPairs.length;
}
/* Schema v3: the starter equipment variants come to an existing library.
   - The coach already has it (same name and equipment): nothing to do.
   - The coach has it under their own name ("DB RDL", "Romanian deadlift (dumbbell)", "Cable lateral raises"): that
     exercise is edited to the starter name and equipment and keeps its id, so its sessions, PRs and programs stay
     with it (its category is kept). The starter copy isn't added.
   - Otherwise the starter variant is added. Every other exercise is left as it is.
   Assistants get the library from their coach instead. */
async function addStarterVariants(){
  try { if (localStorage.getItem(LAST_ROLE_KEY) === 'assistant') return 0; } catch {}
  let list = S.exercises.slice(), n = 0;
  const used = new Set();
  for (const s of SEED_EXERCISES.filter(isSeedVariant)){
    if (list.some(e => e.id === s.id || (normExName(e.name) === normExName(s.name) && normExName(e.equipment) === normExName(s.equipment)))) continue;
    const want = variantKeyOf(s.name, s.equipment);
    const mine = list.find(e => !e.archived && !String(e.id).startsWith('seed-') && !used.has(e.id) && (k => k.base === want.base && k.equipment === want.equipment)(variantKeyOf(e.name, e.equipment)));
    if (mine){
      used.add(mine.id);
      list = list.map(e => e === mine ? { ...e, name:s.name, equipment:s.equipment, category:(e.category && e.category !== 'Other') ? e.category : s.category } : e);
    } else list.push({ ...s });
    n++;
  }
  if (n && !(await saveExerciseList(list))) throw new Error('Could not save the exercise library');
  return n;
}
/* After a sync two devices can each have the same exercise (same name and equipment) under different ids — for
   example a starter variant added on one and the coach's own edited on the other. They're merged into one: the
   coach's own is kept (or, between two of the same kind, the one with the smaller id, so every device picks the same),
   everything that used the other is relinked to it, and the other leaves the library (on every device, via sync). */
async function mergeDuplicateExercises(){
  const groups = new Map();
  S.exercises.forEach(e => { if (e.archived) return; const k = normExName(e.name) + '|' + normExName(e.equipment); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const map = {};
  for (const list of groups.values()){
    if (list.length < 2) continue;
    const rank = e => (String(e.id).startsWith('seed-') ? '1' : '0') + String(e.id);
    const keep = list.slice().sort((a, b) => rank(a).localeCompare(rank(b)))[0];
    list.forEach(e => { if (e !== keep) map[e.id] = keep.id; });
  }
  if (!Object.keys(map).length) return 0;
  if (!(await saveExerciseList(S.exercises.filter(e => !map[e.id])))) return 0;
  await relinkExerciseIds(map);
  return Object.keys(map).length;
}

/* ---------------------------------------------------------------
   Periodisation. A program has a base prescription (sets, reps, load, RPE, RIR, tempo, rest, notes per exercise) and
   optional per-week changes: item.weeks[week] holds only the fields that differ in that week. program.weekPlan[week]
   gives a week a name and can mark it as a deload. A client's currentWeek picks which week a new session starts from,
   and can advance by itself once every day of the week has been logged.
----------------------------------------------------------------*/
const WEEK_FIELDS = ['sets', 'reps', 'load', 'rpe', 'rir', 'tempo', 'rest', 'notes'];
const weekPlanOf = (p, w) => (p && p.weekPlan && p.weekPlan[w]) || {};
const isDeloadWeek = (p, w) => !!weekPlanOf(p, w).deload;
const weekLabelOf = (p, w) => weekPlanOf(p, w).label || (weekPlanOf(p, w).deload ? 'Deload' : '');
const weekTextFor = (p, w) => 'week ' + w + (weekLabelOf(p, w) ? ' · ' + weekLabelOf(p, w) : '');
/* The program row as it applies in a given week: the base with that week's changes on top. */
function weekItem(item, week){
  const over = item && item.weeks && item.weeks[week];
  return over ? { ...item, ...over } : item;
}
function weekHasChanges(p, w){
  if (p && p.weekPlan && p.weekPlan[w]) return true;
  return ((p && p.days) || []).some(d => (d.items || []).some(it => it.weeks && it.weeks[w] && Object.keys(it.weeks[w]).length));
}
const isPeriodised = p => !!p && Array.from({ length:Number(p.weeks) || 0 }, (_, i) => i + 1).some(w => weekHasChanges(p, w));
/* Auto-advance is on for a client when they chose it, or (if they never chose) when their program is periodised. */
const autoWeekOn = (c, p) => c && c.autoWeek !== undefined ? !!c.autoWeek : isPeriodised(p);
/* "75%" means 75% of the client's estimated one-rep max for that exercise. */
function percentLoad(load){ const m = String(load == null ? '' : load).trim().match(/^(\d+(?:\.\d+)?)\s*%$/); return m ? Number(m[1]) : null; }
function bestE1RMOf(cid, exId){
  let best = 0;
  for (const l of clientLogs(cid)){
    for (const e of workoutLogEntries(l)){
      if (String(loggedExerciseId(e) ?? '') !== String(exId)) continue;
      for (const s of loggedExerciseSets(e)){
        const w = Number(setWeight(s)), r = Number(setReps(s));
        if (w > 0 && r > 0 && r <= 12) best = Math.max(best, w * (1 + r / 30));
      }
    }
  }
  return best || null;
}
const roundLoad = (kg, step = 2.5) => Math.round(kg / step) * step;
const programWeekNow = p => Math.min(Math.max(0, Number(S.sel && S.sel.progWeek) || 0), Number(p.weeks) || 4);

function programWeekBarHTML(p, wk){
  const total = Number(p.weeks) || 4, plan = weekPlanOf(p, wk);
  const tabs = Array.from({ length:total }, (_, i) => i + 1).map(w => {
    const tag = isDeloadWeek(p, w) ? ' · deload' : weekLabelOf(p, w) ? ' · ' + weekLabelOf(p, w) : '';
    return `<button type="button" data-pweek="${w}" aria-current="${wk === w}" class="${weekHasChanges(p, w) ? 'has-over' : ''}">Wk ${w}${esc(tag)}</button>`;
  }).join('');
  const others = Array.from({ length:total }, (_, i) => i + 1).filter(w => w !== wk && weekHasChanges(p, w)).map(w => `<option value="${w}">Week ${w}</option>`).join('');
  return `<div class="panel stack" id="weekBar">
    <div class="spread"><strong>Weekly plan</strong><span class="small muted">${wk ? 'Editing week ' + wk + ' only.' : 'Applies to every week. Pick a week to change it.'}</span></div>
    <nav class="week-tabs" aria-label="Program weeks"><button type="button" data-pweek="0" aria-current="${wk === 0}">Base</button>${tabs}</nav>
    ${wk ? `<div class="inline-fields">

      <label class="row tight small" style="gap:.4rem;align-self:end"><input type="checkbox" id="wk_deload" ${plan.deload ? 'checked' : ''} style="width:auto"> Deload week (no automatic load increases)</label></div>
      <div class="row tight"><button type="button" class="btn ghost sm" id="wkReset">Reset this week to the base</button>${others ? `<select id="wkCopyFrom" aria-label="Copy changes from another week"><option value="">Copy changes from…</option>${others}</select><button type="button" class="btn ghost sm" id="wkCopy">Copy</button>` : ''}</div>` : ''}
  </div>`;
}

/* After a session is saved: if every day of the client's current week is now logged, move them to the next week. */
async function maybeAdvanceWeek(cid){
  const c = S.clients[cid], p = c && S.programs[c.programId];
  if (!c || !p || !(p.days || []).length || !autoWeekOn(c, p)) return;
  const week = c.currentWeek || 1, total = Number(p.weeks) || 0;
  if (total < 2 || week >= total) return;   // the last week of the block: what comes next is the coach's decision
  const norm = v => String(v || '').trim().toLocaleLowerCase();
  const since = c.weekFrom || isoOf(new Date(Date.now() - 14 * 86400000)), done = new Set();
  for (const l of clientLogs(cid)){
    if (l.type === 'conditioning' || l.programId !== c.programId || (l.week || 1) !== week || String(l.date) < since) continue;
    done.add(norm(l.dayLabel));
  }
  if (!p.days.every(d => done.has(norm(d.name)))) return;
  const before = { ...c }, next = { ...c, currentWeek:week + 1, weekFrom:todayISO() };
  try { await Store.put('clients', cid, next); } catch(e){ showSaveError(e); return; }
  S.clients[cid] = next;
  undoToast(c.name + ' moves to ' + weekTextFor(p, week + 1), async () => {
    const back = { ...before }; await Store.put('clients', cid, back); S.clients[cid] = back; render({ keepScroll:true });
  });
}

/* ---------------------------------------------------------------
   Group conditioning (a pairing): one conditioning session, one shared timer, results kept per client.
   ss.clientIds = [client, partner]; the first client's results are ss.results, the partner's are
   ss.partnerResults[partnerId]. Saving writes one conditioning log per client (linked by sharedSessionId).
----------------------------------------------------------------*/
const sessionClientIds = ss => (ss && Array.isArray(ss.clientIds) && ss.clientIds.length > 1) ? ss.clientIds : null;
const clientNamesOf = (cid, ss) => (sessionClientIds(ss) || [cid]).map(i => (S.clients[i] || {}).name || 'Client').join(' & ');
/* The other active member of this client's pairing, if there is one and they have no session open. */
function partnerOf(cid){
  const c = S.clients[cid]; if (!c || !c.groupId) return null;
  return groupMembers(c.groupId).find(m => m.id !== cid && !sessionFor(m.id)) || null;
}

/* Blocking screen shown when stored data can't be read. The app is never
   rendered and nothing is written, so the stored data stays exactly as it is. */
function showLoadFailure(err){
  S.bootState = 'failed';
  const local = MODE === 'local';
  const status = document.getElementById('status'); if (status){ status.textContent = 'Data not loaded — nothing is being saved'; status.hidden = false; }
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('main').innerHTML = `<div class="panel stack" role="alert" style="max-width:640px;margin:2rem auto">
    <h2>Couldn't load your data</h2>
    <p>${esc(err && err.message ? err.message : 'An unknown error occurred')}.</p>
    <p class="small muted">To protect your records, the app has stopped before showing or saving anything. Nothing has been changed or deleted.</p>
    ${local ? `<p class="small muted">If this keeps happening, stored data on this device may be damaged. Download a raw copy of everything stored first, so nothing is lost, then ask for help restoring it.</p>` : `<p class="small muted">This is usually a connection problem. Check your connection and try again.</p>`}
    <div class="row">
      <button type="button" class="btn primary" id="retryLoad">Retry</button>
      ${local ? `<button type="button" class="btn ghost" id="downloadRawData">Download raw stored data</button>` : ''}
    </div>
  </div>`;
  document.getElementById('retryLoad').onclick = () => location.reload();
  const raw = document.getElementById('downloadRawData');
  if (raw) raw.onclick = async () => {
    const dump = {};
    try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('nyaega:')) dump[k] = localStorage.getItem(k); } } catch {}
    let idb = null;
    try { if (window.indexedDB){ idb = {}; for (const s of [...COLLS, 'meta']) idb[s] = await IDB.all(s); } } catch(e){ idb = { error:String(e) }; }
    download('nyaega-raw-storage-' + todayISO() + '.json', JSON.stringify({ app:'nyaega', rawLocalStorage:true, savedAt:new Date().toISOString(), keys:dump, indexedDb:idb }, null, 2), 'application/json');
  };
}

const DASH_SUBS = [['today','Today'],['calendar','Calendar'],['clients','Clients'],['groups','Pairings'],['data','Data']];

/* The live logger and the conditioning session are their own screen (S.view === 'session'). Starting one from
   anywhere remembers where it began; saving or leaving it returns there. */
const sessionOpen = () => !!(S.sel && (S.sel.conditioningClient || S.sel.logClient));
function normalizeSessionRoute(){
  if (sessionOpen() && S.view !== 'session'){ S.returnTo = { view:S.view, sub:S.sub }; S.view = 'session'; }
  else if (!sessionOpen() && S.view === 'session'){
    const r = S.returnTo || {};
    S.view = r.view && r.view !== 'session' ? r.view : 'dashboard';
    if (!S.sub) S.sub = r.sub || 'today';
    S.returnTo = null;
  }
}
function viewSession(){
  if (S.sel.conditioningClient) return sessionChipsHTML() + conditioningWorkoutSheet();
  if (S.sel.logClient) return sessionChipsHTML() + logSheet(S.sel.logClient);
  return '';
}

/* The sidebar (wide screens) and the in-workout top tabs (phones) list the same five places as the phone's bottom bar
   (MOBILE_NAV and navPress, in 38-mobile-nav.js; built after boot, when that file has loaded). Home is the logo;
   Schedule and Settings are the header icons. */
function buildTabs(){
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  MOBILE_NAV.forEach(([k,label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.k = k;
    b.onclick = () => navPress(k);
    nav.appendChild(b);
  });
}
/* Used by empty-state shortcuts (e.g. "Add a client") that need to land
   on a Dashboard sub-tab rather than a top-level tab. */
function goTo(key){
  if (DASH_SUBS.some(([k]) => k === key)){ S.view = 'dashboard'; S.sub = key; }
  else S.view = key;
  S.sel = {};
}
/* ---- parallel sessions (semi-private coaching: two clients at once) ----
   The session on screen lives in S.sel (strength: logClient + draft; conditioning: conditioningClient +
   conditioningSession). Every other open session waits in S.sessions, a list of snapshots (most recent first).
   In the combined strength + conditioning flow the strength half waits in S.parkedWorkout and travels with it. */
const sessionKey = rec => (rec && ((rec.draft && rec.draft.id) || (rec.conditioningSession && rec.conditioningSession.id))) || '';
function foregroundKey(){
  if (S.sel?.conditioningClient && S.sel?.conditioningMode === 'both' && S.parkedWorkout) return sessionKey(S.parkedWorkout);
  return (S.sel && S.sel.draft && S.sel.draft.id) || (S.sel && S.sel.conditioningSession && S.sel.conditioningSession.id) || '';
}
function upsertSession(rec, atEnd){
  const k = sessionKey(rec);
  S.sessions = S.sessions.filter(x => sessionKey(x) !== k);
  if (atEnd) S.sessions.push(rec); else S.sessions.unshift(rec);
}
const sessionFor = cid => S.sessions.find(r => r.logClient === cid || ((r.conditioningSession && r.conditioningSession.clientIds) || []).includes(cid)) || null;
const doneSetsOf = d => ((d && d.entries) || []).reduce((n, e) => n + (e.sets || []).filter(s => s.done).length, 0);
/* Moves the session on screen into the parked list (it keeps running by wall clock; nothing is lost). */
function parkWorkout(){
  if (S.sel && S.sel.logClient && S.sel.draft){
    upsertSession({ sessionType:'strength', activePhase:'strength', logClient:S.sel.logClient, dayIndex:S.sel.dayIndex||0, draft:S.sel.draft, backTo:S.sel.backTo||'' });
    return;
  }
  if (S.sel && S.sel.conditioningClient && S.sel.conditioningMode === 'both' && S.parkedWorkout){
    const p = S.parkedWorkout;
    p.draft.conditioningInProgress = S.sel.conditioningSession;
    p.activePhase = 'conditioning';
    p.conditioningId = S.sel.conditioningId;
    p.conditioningMode = 'both';
    p.conditioningSession = S.sel.conditioningSession;
    upsertSession(p); S.parkedWorkout = null;
    return;
  }
  if (S.sel && S.sel.conditioningClient && S.sel.conditioningMode !== 'both'){
    const ss = S.sel.conditioningSession || {};
    if (!ss.id) ss.id = uid();
    upsertSession({ sessionType:'conditioning', logClient:S.sel.conditioningClient, conditioningId:S.sel.conditioningId, conditioningMode:'conditioning', conditioningSession:ss, draft:{ clientId:S.sel.conditioningClient, date:ss.date||todayISO(), startedAt:ss.startedAt||Date.now(), entries:[] } });
  }
}
/* ---- banner listing saved interrupted workouts (S.recoveryArchive, newest first) ---- */
function describeSavedWorkout(w){

  const conditioning=w.sessionType==='conditioning';
  const what=conditioning?(S.conditioning[w.conditioningId]?.name||'Conditioning'):(w.draft?.dayLabel||'Workout');
  const started=Number(w.draft?.startedAt||w.conditioningSession?.startedAt)||0;

  const when=started?new Date(started).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return {client,what,when,sets,conditioning};

function resumeParkedWorkout(key){
  if (typeof key !== 'string') key = '';
  if (sessionOpen()){
    if (key && key === foregroundKey()) return true;   // already on screen
    if (S.sel.conditioningClient && ConditioningTimer.state()?.running) ConditioningTimer.pause();
    parkWorkout();
  }
  const i = key ? S.sessions.findIndex(r => sessionKey(r) === key) : 0;
  const parked = S.sessions[i]; if (!parked) return false;
  S.sessions.splice(i, 1);
  if (parked.sessionType === 'conditioning'){
    S.sel = { conditioningClient:parked.logClient, conditioningId:parked.conditioningId, conditioningMode:'conditioning', conditioningSession:parked.conditioningSession };
  } else if (parked.activePhase === 'conditioning' && parked.conditioningSession){
    S.parkedWorkout = parked;
    S.sel = { conditioningClient:parked.logClient, conditioningId:parked.conditioningId || parked.draft.conditioningTemplateId, conditioningMode:'both', conditioningSession:parked.conditioningSession };
  } else {
    S.sel = { logClient:parked.logClient, dayIndex:parked.dayIndex, draft:parked.draft, backTo:parked.backTo };
  }
  render(); scheduleWorkoutAutosave(); return true;
}
let activeWorkoutSaveTimer=null,activeWorkoutSaveChain=Promise.resolve(),legacyDraftCleared=false;
/* Everything open right now: the session on screen first, then the parked ones. null when nothing is open. */
function currentWorkoutSnapshot(){

  else if (S.sel?.conditioningClient && S.sel?.conditioningSession) list.push({ sessionType:S.sel.conditioningMode==='both'?'both':'conditioning', logClient:S.sel.conditioningClient, conditioningId:S.sel.conditioningId, conditioningMode:S.sel.conditioningMode, conditioningSession:S.sel.conditioningSession, draft:S.parkedWorkout?.draft||null, parkedWorkout:S.parkedWorkout||null });
  S.sessions.forEach(r => list.push(r));
  return list.length ? list : null;
}
/* Switch to another open session: the current one is parked, the chosen one comes up. */
function switchSession(key){ resumeParkedWorkout(key); }
function sessionChipsHTML(){

  else if (S.sel?.conditioningClient && S.sel?.conditioningSession) items.push({ key:foregroundKey(), name:clientNamesOf(S.sel.conditioningClient, S.sel.conditioningSession), label:S.sel.conditioningMode==='both'?doneSetsOf(S.parkedWorkout&&S.parkedWorkout.draft)+' sets + conditioning':'conditioning', current:true });
  S.sessions.forEach(r => items.push({ key:sessionKey(r), name:clientNamesOf(r.logClient, r.conditioningSession), label:r.sessionType==='conditioning'?'conditioning':doneSetsOf(r.draft)+' sets'+(r.activePhase==='conditioning'?' + conditioning':''), current:false }));

}
function setWorkoutSaveStatus(text){const el=document.getElementById('workoutSaveStatus');if(el)el.textContent=text;}
function persistWorkoutSnapshot(snapshot){
  const saved = { sessions:snapshot, savedAt:Date.now() };
  activeWorkoutSaveChain=activeWorkoutSaveChain.then(async()=>{
    try{
      await Store.putMeta('activeSessions',JSON.parse(JSON.stringify(saved)));
      if(!legacyDraftCleared){legacyDraftCleared=true;try{await Store.putMeta('activeWorkoutDraft',null);}catch{}}
      const destination=MODE==='file'?'in data file':'on this device';
      setWorkoutSaveStatus(`Saved ${destination} · ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`);
      S.recoverySaved=true;
      return true;
    }catch(error){console.error('Workout autosave failed',error);setWorkoutSaveStatus('Save failed');showSaveError(error,{background:true});return false;}
  });
  return activeWorkoutSaveChain;
}
function scheduleWorkoutAutosave(){
  const snapshot=currentWorkoutSnapshot();if(!snapshot)return;
  setWorkoutSaveStatus('Saving…');
  clearTimeout(activeWorkoutSaveTimer);
  activeWorkoutSaveTimer=setTimeout(()=>persistWorkoutSnapshot(currentWorkoutSnapshot()||[]),350);
}
function flushWorkoutAutosave(){
  const snapshot=currentWorkoutSnapshot();if(!snapshot)return;
  clearTimeout(activeWorkoutSaveTimer);activeWorkoutSaveTimer=null;
  // localStorage writes synchronously, so a refresh/page close cannot interrupt
  // the most recent draft while an async debounce is still pending.
  if(MODE==='local'){
    try{localStorage.setItem(LOCAL==='idb'?'nyaega:pending:activeSessions':'nyaega:meta:activeSessions',JSON.stringify({sessions:snapshot,savedAt:Date.now()}));if(LOCAL!=='idb')localStorage.removeItem('nyaega:meta:activeWorkoutDraft');S.recoverySaved=true;}
    catch(error){console.error('Workout autosave flush failed',error);}
    return;
  }
  persistWorkoutSnapshot(snapshot);
}
/* The session on screen was saved or discarded: keep the backup of every OTHER open session, drop the rest. */
async function clearWorkoutAutosave(){
  clearTimeout(activeWorkoutSaveTimer);await activeWorkoutSaveChain;
  try{
    const rest=S.sessions.map(r=>JSON.parse(JSON.stringify(r)));
    await Store.putMeta('activeSessions',rest.length?{sessions:rest,savedAt:Date.now()}:null);
    await Store.putMeta('activeWorkoutDraft',null);
    try{localStorage.removeItem('nyaega:pending:activeSessions');}catch{}
    S.recoveryList=[];S.recoverySaved=rest.length>0;
  }catch(error){console.error('Could not clear workout recovery state',error);}
}
window.addEventListener('pagehide',flushWorkoutAutosave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushWorkoutAutosave();else takeDailySnapshot();});
/* True when two saved workout snapshots are the same workout (by draft/session id, else by content). */
function sameWorkout(a,b){
  if(!a||!b)return false;
  const idOf=w=>w.draft?.id||w.conditioningSession?.id||null;
  if(idOf(a)&&idOf(b))return idOf(a)===idOf(b);
  return JSON.stringify(a.draft||null)===JSON.stringify(b.draft||null)&&JSON.stringify(a.conditioningSession||null)===JSON.stringify(b.conditioningSession||null);
}
function resumeRecovery(snapshot){
  if(!snapshot)return;
  if(sessionOpen())parkWorkout();
  const key=sessionKey(snapshot.sessionType==='both'&&snapshot.parkedWorkout?snapshot.parkedWorkout:snapshot);
  if(key)S.sessions=S.sessions.filter(r=>sessionKey(r)!==key);   // the recovered copy replaces one already parked
  if(snapshot.sessionType==='conditioning'){S.parkedWorkout=null;S.sel={conditioningClient:snapshot.logClient,conditioningId:snapshot.conditioningId,conditioningMode:'conditioning',conditioningSession:snapshot.conditioningSession};}
  else if(snapshot.sessionType==='both'&&snapshot.parkedWorkout){S.parkedWorkout=snapshot.parkedWorkout;S.sel={conditioningClient:snapshot.logClient,conditioningId:snapshot.conditioningId,conditioningMode:'both',conditioningSession:snapshot.conditioningSession};}
  else{S.parkedWorkout=null;S.sel={logClient:snapshot.logClient,dayIndex:snapshot.dayIndex||0,draft:snapshot.draft,backTo:snapshot.backTo||''};}
  S.recoveryList=[];render();scheduleWorkoutAutosave();
}
/* Recover every open session: the first comes up, the rest wait as parked sessions. */
function resumeAllRecovery(list){
  const snaps=(list||[]).slice(),first=snaps.shift();
  snaps.forEach(sn=>{
    const rec=sn.sessionType==='both'&&sn.parkedWorkout?{...sn.parkedWorkout,activePhase:'conditioning',conditioningId:sn.conditioningId,conditioningMode:'both',conditioningSession:sn.conditioningSession}:sn;
    upsertSession(rec,true);
  });
  resumeRecovery(first);
}
async function loadRecoveryList(){
  let a=await Store.getMeta('activeSessions',null);
  // A page-close copy written synchronously (IndexedDB can't finish during unload): use it if it's newer, and move it into the database.
  try{
    const raw=localStorage.getItem('nyaega:pending:activeSessions');
    if(raw){
      const p=JSON.parse(raw);
      if(p&&Array.isArray(p.sessions)&&p.sessions.length&&(!a||!a.savedAt||(p.savedAt||0)>=a.savedAt)){a=p;await Store.putMeta('activeSessions',p);}
      localStorage.removeItem('nyaega:pending:activeSessions');
    }
  }catch(e){console.warn('Could not read the page-close session copy',e);}
  if(a&&Array.isArray(a.sessions)&&a.sessions.length)return a.sessions;
  const legacy=await Store.getMeta('activeWorkoutDraft',null);   // older versions kept a single draft here
  return legacy?[legacy]:[];
}

function formatClock(seconds){
  const n=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(n/3600), m=Math.floor((n%3600)/60), s=n%60;
  return h ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function formatSessionClock(seconds){const n=Math.max(0,Math.floor(Number(seconds)||0));return `${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor((n%3600)/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}

/* ---- audio + vibration cues, and keeping the screen awake during a session ---- */
const Cues={
  ctx:null,
  muted(){try{return localStorage.getItem('nyaega:muted')==='1';}catch{return false;}},
  setMuted(v){try{v?localStorage.setItem('nyaega:muted','1'):localStorage.removeItem('nyaega:muted');}catch{}},
  // Browsers only allow sound after a tap, so the audio context is created on the first tap/keypress.
  unlock(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}
      if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    }catch{}
  },
  beep(freq,seconds,startIn=0,volume=0.25){
    const ctx=this.ctx;if(!ctx||ctx.state!=='running')return;
    const t=ctx.currentTime+startIn,osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,t+seconds);
    osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+seconds+0.02);
  },
  play(type){
    if(this.muted())return;
    const shapes={
      tick:{beeps:[[880,0.09]],vibrate:[40]},
      restEnd:{beeps:[[988,0.14],[988,0.14,0.2],[1319,0.3,0.4]],vibrate:[200,100,200,100,350]},
      work:{beeps:[[1175,0.18]],vibrate:[120]},
      rest:{beeps:[[587,0.22]],vibrate:[60,60,60]},
      done:{beeps:[[784,0.15],[988,0.15,0.18],[1319,0.4,0.36]],vibrate:[300,120,300]}
    };
    const s=shapes[type];if(!s)return;
    s.beeps.forEach(([f,d,at])=>this.beep(f,d,at||0));
    // (Browsers refuse to vibrate before the first tap on the page.)
    try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(s.vibrate);}catch{}
  }
};
const cue=type=>Cues.play(type);

let wakeLockSentinel=null;
async function syncWakeLock(){
  const want=!!(S.sel?.draft||S.sel?.conditioningSession||S.parkedWorkout||S.sessions.length);
  if(want&&!wakeLockSentinel&&document.visibilityState==='visible'&&navigator.wakeLock){
    try{
      const sentinel=await navigator.wakeLock.request('screen');
      wakeLockSentinel=sentinel;sentinel.addEventListener('release',()=>{if(wakeLockSentinel===sentinel)wakeLockSentinel=null;});
    }catch(e){console.warn('Wake lock unavailable',e);}
  }else if(!want&&wakeLockSentinel){
    try{await wakeLockSentinel.release();}catch{}
    wakeLockSentinel=null;
  }
}

  const day=prog?.days?.[S.sel?.dayIndex??0],item=day?.items?.find(it=>String(it.exId)===String(entry.exId));
  if(item)return weekItem(item,draft.week||1);
  return entry.targetReps?{sets:entry.targetSets,reps:entry.targetReps,progression:'double',increment:2.5}:null;
}
function entrySuggestion(entry){
  const item=programItemFor(entry);if(!item)return null;
  const draft=S.sel.draft;
  // A deload week, or a load set as a % of the client's max, is prescribed by the plan: no automatic "add weight" advice.
  if(isDeloadWeek(S.programs[draft.programId],draft.week||1)||percentLoad(item.load)!=null)return null;
  return progressionSuggestion(item,exerciseHistory(draft.clientId,entry.exId).last);
}

}

function buildDraft(cid, dayIndex){
  // A client deleted mid-session still gets a (free) draft rather than a crash.
  const c = S.clients[cid] || {}, prog = S.programs[c.programId];
  const day = prog ? prog.days[dayIndex] : null;
  const week = c.currentWeek || 1;
  const entries = (day ? day.items : []).map(base => {
    const it = weekItem(base, week);   // this week's prescription
    const { last, best } = exerciseHistory(cid, it.exId);
    const pct = percentLoad(it.load), e1 = pct != null ? bestE1RMOf(cid, it.exId) : null;
    const wkLoad = base.weeks && base.weeks[week] && 'load' in base.weeks[week] && /^\d+(\.\d+)?$/.test(String(it.load)) ? Number(it.load) : null;
    const targetKg = pct != null ? (e1 ? roundLoad(e1 * pct / 100) : null) : wkLoad;   // shown as the grey hint in the weight box
    return {
      ...(targetKg ? { targetKg } : {}),
      exId: it.exId, name: exName(it.exId), groupId:it.groupId||null, groupType:it.groupType||null,
      target: [it.sets && it.reps ? it.sets + '×' + it.reps : '', it.load || '', it.rpe ? 'RPE ' + it.rpe : ''].filter(Boolean).join(' · '),
      targetSets:it.sets||'',targetReps:it.reps||'',targetLoad:it.load||'',targetRPE:it.rpe||'',targetRIR:it.rir||'',targetTempo:it.tempo||'',targetNotes:it.notes||'',targetRest:it.rest||'90s',
      lastDate: last ? last.date : null, best,
      sets: Array.from({length: Number(it.sets) || 3}, (_,i) => ({
        weight:null, reps:null, done:false,actualRPE:null,actualRIR:null,setType:'working',note:'',
        lastWeight: last && last.sets[i] ? last.sets[i].weight : null,
        lastReps: last && last.sets[i] ? last.sets[i].reps : null
      }))
    };
  });
  // id is fixed when the workout starts and becomes the saved log's id, so a repeated save can't duplicate it.
  return { id: uid(), clientId: cid, date: todayISO(), dayLabel: day ? day.name : 'Open session',
           programId: c.programId || null, week, entries, notes:'', ...(day&&day.notes?{dayNotes:day.notes}:{}), ...(day&&day.conditioningId?{dayConditioningId:day.conditioningId}:{}), usePack: true, startedAt:Date.now(), restRemainingMs:90000, restDurationSeconds:90,restRunning:false, restEndAt:null,autoRestAfterSet:true,focusedExerciseIndex:0 };
}

  const day=program?.days?.[dayIndex>=0?dayIndex:0];

  const source=loggedEntries.length?loggedEntries:(day?.items||[]).map(item=>({...item,exId:item.exId,name:item.name||exName(item.exId)}));
  const entries=source.map(item=>{
    const exId=loggedExerciseId(item)??item.exId, name=loggedExerciseName(item)||item.name||exName(exId),{last,best}=exerciseHistory(cid,exId);
    const sets=loggedExerciseSets(item),lastLoggedSet=Math.max(0,...sets.map((set,index)=>Number(set?.setNumber)||index+1)),count=Math.max(1,sets.length,lastLoggedSet,Number(item.targetSets??item.sets)||0);

      const w0=warmFlags[i]?Number(setWeight(sets[i])):NaN,r0=warmFlags[i]?Number(setReps(sets[i])):NaN;   // warm-ups come back filled in (they're planned, not a result)
      return {weight:w0>0?w0:null,reps:r0>0?r0:null,done:false,actualRPE:null,actualRIR:null,setType:warmFlags[i]?'warmup':'working',note:'',lastWeight:wi<0?null:last?.sets?.[wi]?.weight??null,lastReps:wi<0?null:last?.sets?.[wi]?.reps??null};}))(Array.from({length:count},(_,i)=>isWarmupSet(sets[i])))};

  const draft={id:uid(),clientId:cid,date:todayISO(),dayLabel:day?.name||log.dayLabel||'Open session',programId,week:client.currentWeek||log.week||1,entries,notes:'',usePack:true,startedAt:Date.now(),restRemainingMs:90000,restDurationSeconds:90,restRunning:false,restEndAt:null,autoRestAfterSet:true,...(loggedEntries.length?{repeatOf:log.id}:{})};

/* ---- editing a saved session: reopen it in the logger, save overwrites the same log ---- */
function beginEditSession(logId){
  const log=S.logs[logId];if(!log)return;
  const cid=log.clientId;if(!S.clients[cid]){toast('That client no longer exists');return;}
  archiveParkedWorkoutBeforeStartingAnother(cid);
  const copy=JSON.parse(JSON.stringify(log));['exercises','workoutEntries','movements','lifts'].forEach(k=>delete copy[k]);
  const entries=workoutLogEntries(log).map(item=>{
    const exId=loggedExerciseId(item)??item.exId,name=loggedExerciseName(item)||exName(exId);
    const sets=loggedExerciseSets(item).map(s=>ensureSetDefaults({...s,weight:setWeight(s),reps:setReps(s),actualRPE:setRPE(s)}));
    return {exId,name,...(item.groupId?{groupId:item.groupId,groupType:item.groupType}:{groupId:null,groupType:null}),...(item.bar?{bar:item.bar}:{}),target:item.target||'',targetSets:item.targetSets||'',targetReps:item.targetReps||'',targetLoad:item.targetLoad||'',targetRPE:item.targetRPE||'',targetRIR:item.targetRIR||'',targetTempo:item.targetTempo||'',targetNotes:item.targetNotes||'',targetRest:item.targetRest||'90s',sets:sets.length?sets:[ensureSetDefaults({weight:null,reps:null})]};
  });

    editOriginal:{date:log.date,completedAt:log.completedAt??null,durationSeconds:Object.prototype.hasOwnProperty.call(log,'durationSeconds')?log.durationSeconds:undefined},
    notes:log.notes||'',usePack:false,startedAt:Date.now(),restRemainingMs:90000,restDurationSeconds:90,restRunning:false,restEndAt:null,autoRestAfterSet:true};
  S.sel={logClient:cid,dayIndex:0,draft,backTo:''};
  // "Previous", best and hints come from sessions BEFORE this one (exerciseHistory skips the session being edited).
  entries.forEach(e=>{const h=exerciseHistory(cid,e.exId);e.best=h.best;e.lastDate=h.last?.date||null;e.sets.forEach((s,i)=>{s.lastWeight=h.last?.sets?.[i]?.weight??null;s.lastReps=h.last?.sets?.[i]?.reps??null;});});

/* Ask a question with several answers; resolves with the chosen value, or null if dismissed. */
function askChoice(title,bodyHTML,choices){
  return new Promise(resolve=>{
    let settled=false;const finish=v=>{if(!settled){settled=true;resolve(v);}};
    const dlg=dialog(title,bodyHTML,choices.map(c=>({label:c.label,kind:c.kind,onClick:()=>{finish(c.value);}})));
    dlg.addEventListener('close',()=>finish(null),{once:true});
  });
}
function hasRepeatWorkoutSource(cid,log){
  if(workoutLogEntries(log).length)return true;
  const client=S.clients[cid],programId=log?.programId&&S.programs[log.programId]?log.programId:client?.programId,program=programId?S.programs[programId]:null;
  return !!program?.days?.some(day=>Array.isArray(day.items)&&day.items.length&&(!log?.dayLabel||String(day.name||'').trim().toLowerCase()===String(log.dayLabel).trim().toLowerCase()));
}

/* Starting a new session for a client moves THEIR unfinished one to the saved list. Other clients' open sessions stay open. */
function archiveParkedWorkoutBeforeStartingAnother(cid){
  const mine=S.sessions.filter(r=>r.logClient===cid);if(!mine.length)return;
  S.sessions=S.sessions.filter(r=>r.logClient!==cid);
  mine.forEach(r=>{S.recoveryArchive=[JSON.parse(JSON.stringify(r)),...(S.recoveryArchive||[])].slice(0,8);});
  Store.putMeta('workoutDraftArchive',S.recoveryArchive).catch(error=>{console.warn('Could not archive parked workout',error);showSaveError(error);});
}

/* The program day after the client's most recent strength session on their current program
   (wrapping to the first day); the first day when there's no history. */
function nextDayIndex(cid){
  const c=S.clients[cid],p=c&&S.programs[c.programId],days=p?.days||[];if(!days.length)return 0;
  const norm=v=>String(v||'').trim().toLocaleLowerCase(),names=days.map(d=>norm(d.name));
  for(const l of clientLogs(cid)){   // newest first
    if(l.type==='conditioning')continue;
    if(l.programId&&l.programId!==c.programId)continue;   // a session from a different program
    const i=names.indexOf(norm(l.dayLabel));if(i>=0)return (i+1)%days.length;
  }
  return 0;
}
function beginClientWorkout(cid,mode,templateId='',partnerId=''){
  const c=S.clients[cid];if(!c){toast('That client no longer exists');return;}
  if(consentState(c)==='withdrawn')toast('Consent was withdrawn for '+c.name+'. Consider archiving them instead of logging new data.');
  archiveParkedWorkoutBeforeStartingAnother(cid);
  if(mode==='conditioning'){
    if(!templateId||!S.conditioning[templateId]){toast('Choose a conditioning program first');return;}
    let partner='';
    if(partnerId){
      if(partnerId===cid||!S.clients[partnerId]||sessionFor(partnerId)){toast('That client already has a session open. Finish or save it first.');return;}
      partner=partnerId;
      if(consentState(S.clients[partner])==='withdrawn')toast('Consent was withdrawn for '+S.clients[partner].name+'. Consider archiving them instead of logging new data.');
    }
    S.sel={conditioningClient:cid,conditioningId:templateId,conditioningMode:'conditioning',conditioningSession:{id:uid(),date:todayISO(),startedAt:Date.now(),blocksCompleted:[],blocks:JSON.parse(JSON.stringify(S.conditioning[templateId].blocks||[])),flow:conditioningFlowOf(S.conditioning[templateId]),...(partner?{clientIds:[cid,partner],partnerResults:{}}:{})}};render();return;
  }
  const dayIndex=nextDayIndex(cid),draft=buildDraft(cid,dayIndex);
  S.sel={logClient:cid,dayIndex,draft};render();
  packLowWarning(cid);
}
function packLowWarning(cid){
  const c=S.clients[cid];if(!c||!c.packTotal)return;
  const left=sessionsLeft(c,cid);
  if(left===0)toast(c.name+'s pack is used up — renew it in their profile');
  else if(left===1)toast(c.name+' has 1 session left in the pack');
}
/* Pick a conditioning template, then start it for this client. */
function openConditioningChooser(cid){
  if(!Object.keys(S.conditioning).length){toast('Create a conditioning program first');return;}
  const partner=partnerOf(cid);
  const templates=Object.entries(S.conditioning).map(([id,w])=>`<button type="button" class="card program-kind-card" data-start-conditioning-template="${esc(id)}"><span class="program-kind-icon">◷</span><strong>${esc(w.name||'Conditioning program')}</strong><span class="small muted">${(w.blocks||[]).length} timed block${(w.blocks||[]).length===1?'':'s'}</span></button>`).join('');
  const templateDialog=dialog('Choose conditioning program',`${partner?`<label class="row tight small" style="gap:.4rem;margin-bottom:.6rem"><input type="checkbox" id="condWithPartner" style="width:auto"> Also run it for ${esc(partner.name)} — one shared timer, a separate result for each</label>`:''}<div class="grid start-workout-choices">${templates}</div>`,[{label:'Cancel'}]);
  templateDialog.querySelectorAll('[data-start-conditioning-template]').forEach(button=>button.onclick=()=>{
    const templateId=button.dataset.startConditioningTemplate;
    if(!S.conditioning[templateId]){toast('This conditioning program is no longer available');return;}
    const withPartner=!!(partner&&document.getElementById('condWithPartner')?.checked);
    templateDialog.close();
    beginClientWorkout(cid,'conditioning',templateId,withPartner?partner.id:'');
  });
}
/* "More" in the + menu's session picker: resume, start a conditioning session, or open the profile. (No attendance buttons here:
   No-show and Cancelled are set on the Schedule tab, and a logged session marks the client attended.) */
function openTodayActions(cid){
  const c=S.clients[cid];if(!c)return;
  const p=S.programs[c.programId],di=nextDayIndex(cid),dayName=p?.days?.[di]?.name;
  const parked=!!sessionFor(cid);
  const dlg=dialog(c.name,`<p class="small muted">${p?esc(p.name):'No program assigned'}</p>
    <div class="today-actions">
      ${parked?`<button type="button" class="btn primary" data-today-action="resume">Resume workout in progress</button>`:''}
      <button type="button" class="btn ${parked?'ghost':'primary'}" data-today-action="start">${dayName?'Log session · '+esc(dayName):'Log session'}</button>
      <button type="button" class="btn ghost" data-today-action="conditioning">Conditioning…</button>
      <button type="button" class="btn ghost" data-today-action="profile">Open profile</button>
    </div>`,[{label:'Close'}]);
  const act=kind=>{
    if(kind==='resume'){dlg.close();resumeParkedWorkout(sessionKey(sessionFor(cid)));return;}
    if(kind==='start'){dlg.close();beginClientWorkout(cid,'strength');return;}
    if(kind==='conditioning'){openConditioningChooser(cid);return;}
    if(kind==='profile'){dlg.close();S.view='dashboard';S.sub='clients';S.sel={client:cid};render();return;}
  };
  dlg.querySelectorAll('[data-today-action]').forEach(b=>b.onclick=()=>act(b.dataset.todayAction));
}function markStrengthActivity(){
  const d=S.sel&&S.sel.draft;
  // (Editing a saved session must not move its strength/conditioning order.)
  if(d&&!d.editing&&(d.conditioningTemplateId||d.conditioningInProgress||d.conditioningSession))d.strengthCompletedAt=Date.now();
  if(d)scheduleWorkoutAutosave();
}
/* Opens the timed conditioning part of a strength workout (the workout stays parked and is resumed after). */
function startSessionConditioning(templateId){
  const d=S.sel?.draft,cid=S.sel?.logClient;if(!d||!S.conditioning[templateId]){toast('That conditioning program is no longer available');return false;}
  d.conditioningTemplateId=templateId;d.strengthCompletedAt=Date.now();
  const progress=d.conditioningInProgress||{id:uid(),date:d.date||todayISO(),startedAt:d.startedAt||Date.now(),blocksCompleted:[],flow:conditioningFlowOf(S.conditioning[templateId])};
  S.parkedWorkout={sessionType:'strength',activePhase:'strength',logClient:cid,dayIndex:S.sel.dayIndex||0,draft:d,backTo:S.sel.backTo||''};   // the strength half waits while conditioning runs

/* Delete / copy a set — used by the buttons in the set's Effort panel and by the swipe gestures. */
function deleteSetAt(ei,si){
  const entry=S.sel.draft?.entries?.[ei],removed=entry?.sets?.[si];if(!removed)return;
  if(entry.sets.length<2){toast('Keep at least one set for this exercise');return;}
  entry.sets.splice(si,1);markStrengthActivity();render();
  undoToast(`Set ${si+1} of ${entry.name} deleted`,()=>{
    if(!S.sel.draft||!S.sel.draft.entries.includes(entry))return;   // the exercise itself is gone
    entry.sets.splice(Math.min(si,entry.sets.length),0,removed);markStrengthActivity();render();
  });

function copyPreviousSet(ei,si){

  const previous=last&&(last.weight!=null||last.reps!=null)?last:(above&&(above.weight!=null||above.reps!=null)?above:null);

/* The kg × reps shown as grey hints in this set's boxes: the progression suggestion when

function previousSetValues(ei,si){
  const draft=S.sel?.draft,entry=draft?.entries?.[ei],set=entry?.sets?.[si];if(!entry)return {weight:null,reps:null};
  const num=v=>v==null||v===''||!Number.isFinite(Number(v))?null:Number(v);   // older logs may hold "60" as text

function completeWorkoutSet(ei,si,opts={}){

    if(box){box.scrollIntoView({block:'center',behavior:'smooth'});try{box.focus({preventScroll:true});box.select();}catch{}}

/* ---- Finished exercises fold to one line (phone-friendly). An exercise folds when all its sets are ticked; in a superset
   or tri-set, when every exercise in it is finished. Tapping a folded title opens it (entry.uiOpen); it folds again when
   the coach moves on to another exercise. Nothing folds while a saved session is being edited. ---- */
const entryFinished=e=>!!(e&&e.sets&&e.sets.length&&e.sets.every(s=>s.done));
function exerciseFolded(draft,ei){
  const e=draft?.entries?.[ei];if(!e||draft.editing||e.uiOpen||!entryFinished(e))return false;
  return !e.groupId||draft.entries.filter(x=>x.groupId===e.groupId).every(entryFinished);
}
function foldFinishedExercises(ei){
  const draft=S.sel?.draft;if(!draft||draft.editing)return;
  const e=draft.entries[ei];if(!entryFinished(e))return;
  const members=e.groupId?draft.entries.map((x,i)=>x.groupId===e.groupId?i:-1).filter(i=>i>=0):[ei];
  if(!members.every(i=>entryFinished(draft.entries[i])))return;
  setTimeout(()=>{   // a moment to see the last ✓
    if(S.sel?.draft!==draft||!members.every(i=>entryFinished(draft.entries[i])))return;   // gone, or a set was reopened meanwhile
    members.forEach(i=>delete draft.entries[i].uiOpen);
    render({keepScroll:true});   // redraws the folded title rows (keeps scroll and focus)
    const last=Math.max(...members),next=draft.entries.findIndex((x,i)=>i>last&&!entryFinished(x));
    const target=next>=0?next:draft.entries.findIndex(x=>!entryFinished(x));
    const block=target>=0?document.querySelector(`.exblock[data-ei="${target}"]`):null;
    if(block){   // the next exercise, with the folded one just above it still in view
      const above=block.previousElementSibling?.classList.contains('exblock')?block.previousElementSibling:null;
      const head=document.querySelector('header.top'),pos=head?getComputedStyle(head).position:'';
      const covered=head&&(pos==='sticky'||pos==='fixed')?Math.max(0,head.getBoundingClientRect().bottom):0;
      window.scrollTo({top:Math.max(0,block.getBoundingClientRect().top+window.scrollY-covered-(above?above.offsetHeight+14:12)),behavior:'smooth'});
    }
    scheduleWorkoutAutosave();
  },650);
}
/* ---- Done warm-ups leave the screen: once every warm-up of an exercise is ticked they're hidden from the logger (they
   stay in the session, so they're saved and shown in History), the first working set gets its kg and reps filled in
   (still editable) and is marked as next. Its numbers: the work set chosen in the warm-up pop-up (entry.warmupWork;
   the other sets' hints shift with it), else the usual suggestion / previous. Not while a saved session is edited. ---- */
function warmupFoldState(draft,en){
  const idx=[];(en.sets||[]).forEach((s,i)=>{if(isWarmupSet(s))idx.push(i);});
  const done=!draft.editing&&idx.length>0&&idx.every(i=>en.sets[i].done),first=en.sets.findIndex(s=>!isWarmupSet(s));
  return {idx,done,next:first>=0&&!en.sets[first].done?first:-1};
}
/* The work set chosen in the warm-up pop-up moves the working sets' hints with it: set 1 gets it, the others shift by
   the same amount (planned 100 / 90 / 80, 105 chosen → 105 / 95 / 85). base: this set's usual hint; base0: set 1's. */
function warmupShiftedHint(en,wi,base,base0){
  const w=Number(en.warmupWork);if(!(w>0))return base;
  if(wi===0)return w;
  return base==null||base===''||!(Number(base0)>0)?base:round2(Number(base)+w-Number(base0));
}
function foldDoneWarmups(ei){
  const draft=S.sel?.draft,en=draft?.entries?.[ei];if(!en||draft.editing||!warmupFoldState(draft,en).done||entryFinished(en))return;
  setTimeout(()=>{   // a moment to see the last ✓
    const st=S.sel?.draft===draft&&warmupFoldState(draft,en);if(!st||!st.done)return;   // gone, or a warm-up was reopened meanwhile
    if(st.next>=0){   // fill in the next set (only boxes still empty: anything typed stays)
      const s=en.sets[st.next],pv=previousSetValues(ei,st.next),empty=v=>v==null||v==='';
      if(empty(s.weight)&&pv.weight!=null)s.weight=pv.weight;
      if(empty(s.reps)&&pv.reps!=null)s.reps=pv.reps;
    }
    render({keepScroll:true});
    const row=document.querySelector(`.exblock[data-ei="${ei}"] .setrow.is-next`);
    if(row)row.scrollIntoView({block:'center',behavior:'smooth'});
    markStrengthActivity();
  },650);
}
/* Press and hold an exercise's title, then drag it up or down to reorder the workout (a superset moves as one
   block). A quick swipe still scrolls: the hold only starts if the finger stays put for HOLD_MS. */
const HOLD_MS=450,HOLD_SLOP=8;
function wireExerciseDrag(m){
  const draft=S.sel&&S.sel.draft;if(!draft||draft.entries.length<2)return;
  const unitsOf=()=>{const units=[];draft.entries.forEach((en,i)=>{const last=units[units.length-1];if(en.groupId&&last&&draft.entries[last[0]].groupId===en.groupId)last.push(i);else units.push([i]);});return units;};
  m.querySelectorAll('.exblock[data-ei]>header').forEach(head=>{
    const block=head.parentElement,ei=Number(block.dataset.ei);
    let timer=null,start=null,drag=null,suppressClick=false;
    head.addEventListener('contextmenu',e=>{if(timer||drag)e.preventDefault();});
    const cancelHold=()=>{clearTimeout(timer);timer=null;};
    const begin=(x,y)=>{
      timer=null;
      const units=unitsOf(),u=units.findIndex(un=>un.includes(ei));if(u<0)return;
      const mine=units[u].map(i=>m.querySelector(`.exblock[data-ei="${i}"]`)).filter(Boolean);
      drag={u,units,mine,startY:y,lastY:y,target:u,raf:0};
      document.querySelectorAll('.exercise-actions-menu[open]').forEach(d=>d.removeAttribute('open'));
      mine.forEach(b=>b.classList.add('ex-dragging'));document.body.classList.add('ex-reordering');
      try{navigator.vibrate&&navigator.vibrate(15);}catch{}
      const loop=()=>{if(!drag)return;const edge=70,y2=drag.lastY;if(y2<edge)window.scrollBy(0,-10);else if(y2>innerHeight-edge)window.scrollBy(0,10);move(drag.lastY);drag.raf=requestAnimationFrame(loop);};
      drag.raf=requestAnimationFrame(loop);
    };
    const move=y=>{
      if(!drag)return;drag.lastY=y;
      const dy=y-drag.startY;drag.mine.forEach(b=>b.style.transform=`translateY(${dy}px)`);
      // where it would land: among the other blocks, before the first whose middle is below the finger
      const others=drag.units.filter((_,k)=>k!==drag.u).map(un=>un.map(i=>m.querySelector(`.exblock[data-ei="${i}"]`)).filter(Boolean));
      let idx=others.findIndex(bs=>{const a=bs[0].getBoundingClientRect(),z=bs[bs.length-1].getBoundingClientRect();return y<(a.top+z.bottom)/2;});
      if(idx<0)idx=others.length;drag.target=idx;
      m.querySelectorAll('.drop-before,.drop-after').forEach(b=>b.classList.remove('drop-before','drop-after'));
      if(idx!==drag.u){if(idx<others.length)others[idx][0].classList.add('drop-before');else{const l=others[others.length-1];l[l.length-1].classList.add('drop-after');}}
    };
    const end=commit=>{
      cancelHold();if(!drag)return;
      const {u,target,mine,raf}=drag;drag=null;cancelAnimationFrame(raf);
      mine.forEach(b=>{b.classList.remove('ex-dragging');b.style.transform='';});document.body.classList.remove('ex-reordering');
      m.querySelectorAll('.drop-before,.drop-after').forEach(b=>b.classList.remove('drop-before','drop-after'));
      suppressClick=true;setTimeout(()=>{suppressClick=false;},400);
      if(!commit||target===u)return;
      // step the unit there with the same move as the old Move up / Move down, so supersets stay together
      const en=draft.entries[ei],dir=target>u?1:-1;let steps=Math.abs(target-u);
      while(steps-->0&&moveExerciseUnit(draft.entries,draft.entries.indexOf(en),dir)){}
      markStrengthActivity();render({keepScroll:true});
      const moved=document.querySelector(`.exblock[data-ei="${draft.entries.indexOf(en)}"]`);if(moved){moved.classList.add('ex-dropped');setTimeout(()=>moved.classList.remove('ex-dropped'),600);}
    };
    const skip=t=>t.closest('details,summary,button,input,select,textarea,a');
    // touch: scrolling stays normal until the hold starts; then the page is held still while dragging
    head.addEventListener('touchstart',e=>{if(e.touches.length!==1||skip(e.target))return;const t=e.touches[0];start={x:t.clientX,y:t.clientY};cancelHold();timer=setTimeout(()=>begin(start.x,start.y),HOLD_MS);},{passive:true});
    head.addEventListener('touchmove',e=>{const t=e.touches[0];if(drag){e.preventDefault();move(t.clientY);return;}if(timer&&start&&(Math.abs(t.clientX-start.x)>HOLD_SLOP||Math.abs(t.clientY-start.y)>HOLD_SLOP))cancelHold();},{passive:false});
    head.addEventListener('touchend',()=>end(true));head.addEventListener('touchcancel',()=>end(false));
    // mouse (computers): the same press and hold

      const mm=ev=>{if(drag){ev.preventDefault();move(ev.clientY);}else if(timer&&(Math.abs(ev.clientX-start.x)>HOLD_SLOP||Math.abs(ev.clientY-start.y)>HOLD_SLOP))cancelHold();};
      const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);end(true);};
      document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});

    head.addEventListener('click',e=>{if(suppressClick){e.stopImmediatePropagation();e.preventDefault();suppressClick=false;}},true);
  });
}

/* The day under the calendar is for what happens to a booked session: mark a client No-show or Cancelled, or reschedule it
   when the client asks (the button sits on the same row). Sessions are logged with the "+" button or from a client's
   profile; attended marks come from logging them. */
function dayPanel(iso){

  const extras = Object.entries(S.clients).map(([id,c]) => ({id,...c}))
    .filter(c => c.status !== 'archived' && marked.has(c.id) && !scheduledIds.has(c.id)).sort(byName);

  /* moveRef: which booking the Reschedule button on this row moves ('group|id|date', 'client|id|date' or 'oneoff|id|date'). */
  const roster = (c, gid, moveRef, note) => {
    const a = attFor(iso, c.id), st = a ? a.status : '';
    const logged = logsOnDate(c.id, iso);
    return `<div class="att-row">
      <div><strong>${esc(c.name)}</strong>${note ? ` <span class="small muted">${esc(note)}</span>` : ''}

      <div class="row tight">
        <button class="btn sm ${st==='no-show'?'danger':'ghost'}" data-att="${esc(c.id)}|no-show|${esc(gid)}|${esc(iso)}" aria-pressed="${st==='no-show'}">No-show</button>
        <button class="btn sm ${st==='cancelled'?'danger':'ghost'}" data-att="${esc(c.id)}|cancelled|${esc(gid)}|${esc(iso)}" aria-pressed="${st==='cancelled'}">Cancelled</button>
        ${moveRef ? `<button class="btn sm ghost" data-move="${esc(moveRef)}">Reschedule</button>` : ''}
        ${st === 'no-show' || st === 'cancelled' ? `<button class="btn sm ghost" data-att="${esc(c.id)}||${esc(gid)}|${esc(iso)}" title="Clear" aria-label="Clear the mark for ${esc(c.name)}">×</button>` : ''}
      </div>
    </div>`;
  };

  return `<div class="panel">
    <div class="spread"><h3>${esc(nice)}</h3>
      <span class="muted small num">${attendedOn(iso)} attended</span></div>

    ${slots.length ? slots.map(s => {
      const mem = groupMembers(s.id);
      return `<div class="slot">
        <div class="slot-head"><strong class="cond" style="font-size:1.15rem">${esc(s.name)}</strong>
          <span class="muted small">${esc(fmtTime(s.time))} · ${mem.length===1?'1:1':mem.length===2?'Paired':mem.length+' — check pairing'}</span></div>
        ${mem.map(c => roster(c, s.id, 'group|' + s.id + '|' + iso)).join('') || '<p class="muted small" style="padding:.5rem .7rem">Nobody assigned to this pairing yet.</p>'}
      </div>`;
    }).join('') : ''}

    ${individuals.length ? `<div class="slot"><div class="slot-head"><strong class="cond" style="font-size:1.15rem">Individual sessions</strong>
        <span class="muted small">Recurring, not part of a pairing</span></div>
      ${individuals.map(c => roster(c, '', 'client|' + c.id + '|' + iso, fmtTime(c.recurTime))).join('')}</div>` : ''}

    ${oneOffs.map(s => `<div class="slot"><div class="slot-head"><strong class="cond" style="font-size:1.15rem">${esc(s.label || 'One-off session')}</strong>
        <span class="muted small">${esc(fmtTime(s.time))}${s.note ? ' · ' + esc(s.note) : ''}</span></div>
      ${(s.clientIds||[]).filter(i => S.clients[i]).map(i => roster({id:i, ...S.clients[i]}, '', 'oneoff|' + s.id + '|' + iso)).join('')}</div>`).join('')}

    ${skipped.length ? `<div class="small muted" style="margin:.5rem 0">Rescheduled from this date: ${skipped.map(e => {
      const n = e.kind === 'group' ? (S.groups[e.key]||{}).name : (S.clients[e.key]||{}).name;
      const to = Object.values(S.schedule).find(x => x.movedFrom === e.date && x.movedKey === e.key);
      return `${esc(n || '(deleted)')}${to ? ' → ' + esc(to.date) : ''} <button class="btn sm ghost" data-restore-skip="${esc(e.date)}|${esc(e.key)}">Undo</button>`;
    }).join(' ')}</div>` : ''}

    ${!slots.length && !individuals.length && !oneOffs.length ? '<p class="muted small">Nothing scheduled.</p>' : ''}

    ${extras.length ? `<div class="slot"><div class="slot-head"><strong class="cond" style="font-size:1.15rem">Other marks</strong></div>
      ${extras.map(c => roster(c, '', '')).join('')}</div>` : ''}
  </div>`;
}

    <div class="dash-row"><span class="dash-label">Last session</span><span class="dash-value">${lastSession ? esc(lastSession.date) : 'No sessions yet'}</span></div>

  ${String(c.notes||'').trim() ? `<div class="panel client-notes-panel"><h3>Notes — injuries, preferences</h3><p>${esc(c.notes).replace(/\n/g,'<br>')}</p></div>` : ''}

    </div>

}

const CONDITIONING_MODES=[['intervals','Intervals'],['emom','EMOM'],['amrap','AMRAP'],['forTime','For Time'],['tabata','Tabata'],['custom','Custom']];
function conditioningModeName(mode){return (CONDITIONING_MODES.find(x=>x[0]===mode)||['','Custom'])[1];}
function newConditioningBlock(mode='intervals'){
  const b={name:'Main Block',mode,rounds:mode==='tabata'?8:10,workSeconds:mode==='tabata'?20:30,restSeconds:mode==='tabata'?10:30,durationMinutes:mode==='emom'?10:12,exercises:[]};
  // Timed-interval blocks start with one station, ready to add more.
  if(['intervals','tabata','custom'].includes(mode)){b.steps=[{name:'Work',workSeconds:b.workSeconds,restSeconds:b.restSeconds}];b.restBetweenRounds=0;}
  return b;
}
/* Station list for intervals / tabata / custom blocks. Older blocks (no stations) keep their timing until switched. */
function conditioningStepsHTML(b,i){
  if(!['intervals','tabata','custom'].includes(b.mode))return '';

  return `<div class="conditioning-steps"><div class="spread"><strong>Stations</strong><button type="button" class="btn ghost sm" data-add-step="${i}">+ Add station</button></div>
    ${b.steps.map((s,si)=>`<div class="cond-step" data-step-row="${si}">
      <span class="cond-step-num" aria-hidden="true">${si+1}</span>
      <input type="text" class="cond-step-name" data-sf="name" list="exerciseNamesList" value="${esc(s.name||'')}" placeholder="Exercise (type or pick)" aria-label="Station ${si+1} name">
      <label class="cond-step-time"><span>Work (s)</span><input type="number" inputmode="numeric" min="1" data-sf="workSeconds" value="${esc(s.workSeconds??30)}"></label>
      <label class="cond-step-time"><span>Rest (s)</span><input type="number" inputmode="numeric" min="0" data-sf="restSeconds" value="${esc(s.restSeconds??0)}"></label>
      <div class="cond-step-actions"><button type="button" class="btn sm ghost" data-move-step="${i}.${si}.-1" aria-label="Move station ${si+1} up" ${si===0?'disabled':''}>↑</button><button type="button" class="btn sm ghost" data-move-step="${i}.${si}.1" aria-label="Move station ${si+1} down" ${si===b.steps.length-1?'disabled':''}>↓</button><button type="button" class="btn sm danger" data-remove-step="${i}.${si}" aria-label="Remove station ${si+1}" ${b.steps.length<2?'disabled':''}>✕</button></div>

/* Only the fields a mode actually uses. Values of hidden fields stay stored, so switching mode back restores them. */
function conditioningModeFieldsHTML(b){
  const num=(label,key,value,min,step=1)=>`<label class="field"><span>${label}</span><input type="number" min="${min}" step="${step}" data-cf="${key}" value="${esc(value??'')}"></label>`;
  switch(b.mode){
    case 'emom': return num('Duration (minutes)','durationMinutes',b.durationMinutes??10,1)+num('Interval (seconds)','intervalSeconds',b.intervalSeconds??60,5);
    case 'amrap': return num('Duration (minutes)','durationMinutes',b.durationMinutes??10,1);
    case 'forTime': return num('Target rounds (optional)','targetRounds',b.targetRounds||'',1)+num('Time cap, minutes (optional)','capMinutes',b.capMinutes||'',1);
    default:   // intervals, tabata, custom
      if(isSteppedBlock(b))return num('Rounds','rounds',b.rounds??8,1)+num('Break between rounds (s)','restBetweenRounds',b.restBetweenRounds||0,0);
      return num('Rounds','rounds',b.rounds??8,1)+num('Work (seconds)','workSeconds',b.workSeconds??30,1)+num('Rest (seconds)','restSeconds',b.restSeconds??30,0);

}

function readConditioningEditor(){
  const id=S.sel.conditioningId, w=S.sel.conditioningDraft; if(!id||!w)return null;
  w.name=document.getElementById('conditioningName')?.value.trim()||w.name;
  w.warmup=document.getElementById('conditioningWarmup')?.value||'';
  w.finisher=document.getElementById('conditioningFinisher')?.value||'';
  const flowNum=id=>{const el=document.getElementById(id);return el?Math.max(0,Number(el.value)||0):null;};
  const gr=flowNum('conditioningGetReady'),tr=flowNum('conditioningTransition');
  if(gr!=null)w.getReadySeconds=gr;if(tr!=null)w.transitionSeconds=tr;
  const aa=document.getElementById('conditioningAutoAdvance');if(aa)w.autoAdvance=aa.checked;
  document.querySelectorAll('[data-conditioning-block]').forEach(row=>{
    const i=Number(row.dataset.conditioningBlock), b=w.blocks[i]; if(!b)return;
    row.querySelectorAll('[data-cf]').forEach(el=>{
      const k=el.dataset.cf;
      if(k==='exercises') b.exercises=el.value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split('|');return {name:parts[0].trim(),reps:(parts[1]||'').trim()};});
      else if(['rounds','durationMinutes','workSeconds','restSeconds','intervalSeconds','restBetweenRounds'].includes(k)) b[k]=Math.max(0,Number(el.value)||0);
      else if(['targetRounds','capMinutes'].includes(k)){const n=Math.max(0,Number(el.value)||0);if(n)b[k]=n;else delete b[k];}   // empty = not set
      else b[k]=el.value;
    });
    // Stations: read each row, link names that match the exercise library, keep the plain exercise list in step.
    const stepRows=row.querySelectorAll('.cond-step');
    if(stepRows.length){
      b.steps=[...stepRows].map((r,si)=>{
        const prev=(Array.isArray(b.steps)&&b.steps[si])||{},name=r.querySelector('[data-sf="name"]').value.trim();
        const step={...prev,name,workSeconds:Math.max(1,Number(r.querySelector('[data-sf="workSeconds"]').value)||30),restSeconds:Math.max(0,Number(r.querySelector('[data-sf="restSeconds"]').value)||0)};
        const lib=name&&activeExercises().find(e=>e.name.toLocaleLowerCase()===name.toLocaleLowerCase());
        if(lib)step.exId=lib.id;else delete step.exId;
        return step;
      });
      b.exercises=b.steps.filter(s=>s.name).map(s=>({name:s.name,reps:s.reps||''}));
    }
  });
  return w;
}
async function saveConditioningDraft(){

function activeConditioningTimer(){return S.sel?.conditioningSession?ConditioningTimer:EditorTimer;}

function conditioningTimerBusy(){const s=activeConditioningTimer().state();return !!s&&!s.complete&&(s.running||s.paused);}
function updateConditioningTimerUI(event,state){
  state=state||activeConditioningTimer().state(); if(!state)return;
  const blockPicker=document.getElementById('conditioningTimerBlock');
  if(blockPicker&&blockPicker.dataset.locked!=='1')blockPicker.disabled=!state.complete&&(state.running||state.paused);
  const modeEl=document.getElementById('conditioningTimerMode'),phaseEl=document.getElementById('conditioningTimerPhase'),clockEl=document.getElementById('conditioningTimerClock'),roundEl=document.getElementById('conditioningTimerRound'),exerciseEl=document.getElementById('conditioningTimerExercise');
  const start=document.getElementById('conditioningTimerStart'),pause=document.getElementById('conditioningTimerPause'),roundBtn=document.getElementById('conditioningTimerRoundDone'),finishBtn=document.getElementById('conditioningTimerFinish');
  if(!phaseEl)return;
  if(modeEl)modeEl.textContent=conditioningModeName(state.mode);
  phaseEl.textContent=state.complete?'Complete':state.paused?'Paused':state.phase==='getReady'?state.leadLabel:state.phase==='rest'?'Rest':'Work';
  const isForTime=state.mode==='forTime';if(clockEl)clockEl.textContent=formatClock(state.remaining);
  if(roundEl)roundEl.textContent=state.phase==='getReady'&&!state.complete?'The block starts when this reaches zero'
    :state.stepped?(state.phase==='rest'?`Round ${state.round} of ${state.rounds} · Rest`:`Round ${state.round} of ${state.rounds} · Station ${state.stepIndex+1}: ${state.stepName||'Work'}${state.stepReps?' · '+state.stepReps:''}`)
    :state.mode==='amrap'?`${state.roundsCompleted} round${state.roundsCompleted===1?'':'s'} completed`
    :state.mode==='forTime'?`${state.roundsCompleted}${state.rounds?' of '+state.rounds:''} round${!state.rounds&&state.roundsCompleted===1?'':'s'} · elapsed${state.capSeconds?' · cap '+formatClock(state.capSeconds):''}${state.capped?' · time cap reached':''}`
    :state.mode==='emom'?(state.intervalSeconds===60?`Minute ${state.round}`:`Interval ${state.round}`)
    :`Round ${state.round} of ${state.rounds||'—'}`;
  if(exerciseEl)exerciseEl.textContent=state.stepped?(state.complete?'':state.nextName?'Next: '+state.nextName:'Last station'):(state.exercise||'');
  if(start)start.disabled=!state.complete&&(state.running||state.paused);
  if(pause){pause.disabled=!state.running&&!state.paused;pause.textContent=state.paused?'Resume':'Pause';}
  if(roundBtn)roundBtn.hidden=!(state.mode==='amrap'||isForTime)||state.complete;
  if(finishBtn)finishBtn.disabled=!state.running&&!state.paused;
  if(state.complete&&event==='complete')toast('Conditioning block complete');
}
/* Sound + vibration at each phase change, EMOM interval and block end. */
let lastLeadCue='';
function conditioningCueFor(event,state){
  if(event==='work'||event==='minute')cue('work');
  else if(event==='rest')cue('rest');
  else if(event==='complete')cue('done');
  else if(event==='tick'&&state&&state.phase==='getReady'&&state.remaining>0&&state.remaining<=3){   // 3-2-1 before the block starts
    const key=state.startedAt+':'+state.remaining;if(key!==lastLeadCue){lastLeadCue=key;cue('tick');}
  }
}
/* Timer settings for one block of a live session (or the editor preview): the block itself plus the
   template's "get ready" countdown and, for an automatic next block, the rest before it. */
function sessionBlockConfig(flow,b,{auto=false}={}){
  const cfg=conditioningTimerConfig(b),f=flow||{},transition=auto?(Number(f.transitionSeconds)||0):0,lead=transition+(Number(f.getReadySeconds)||0);
  if(lead>0){cfg.getReadySeconds=lead;cfg.getReadyLabel=transition>0?'Rest — next block soon':'Get ready';}
  return cfg;
}
// Template editor preview: draws itself (only while the editor is what's showing) and makes the same sounds.
EditorTimer.setListener((event,state)=>{
  if(!S.sel?.conditioningSession)updateConditioningTimerUI(event,state);
  conditioningCueFor(event,state);
});
// Live session. Its state is copied into the session on every event, so it survives leaving the screen or a reload.
ConditioningTimer.setListener((event,state)=>{
  const ss=ConditioningTimer.owner||(S.sel&&S.sel.conditioningSession)||(S.parkedWorkout&&S.parkedWorkout.conditioningSession)||(S.parkedWorkout&&S.parkedWorkout.draft&&S.parkedWorkout.draft.conditioningInProgress);
  if(S.sel?.conditioningSession&&S.sel.conditioningSession===ss)updateConditioningTimerUI(event,state);   // don't draw over another screen
  conditioningCueFor(event,state);
  if(!ss)return;
  const saved=ConditioningTimer.serialize();if(saved)ss.timer=saved;else delete ss.timer;
  if(event!=='tick')scheduleWorkoutAutosave();
  if(event==='complete'&&Number.isInteger(ss.currentBlockIndex)){
    ss.blocksCompleted=ss.blocksCompleted||[];
    if(!ss.blocksCompleted.includes(ss.currentBlockIndex))ss.blocksCompleted.push(ss.currentBlockIndex);
    // Keep the timer's numbers without stopping to ask: the whole workout runs, and results can be adjusted
    // from the Results list (or later in History). Then the next block is lined up, or starts by itself.
    const next=ss.currentBlockIndex+1,flow=ss.flow||{},advance=!!flow.autoAdvance&&!ss.completed&&next<(ss.blocks||[]).length;
    captureConditioningResult(ss,state,{ask:false});
    if(!advance&&!ss.completed&&next<(ss.blocks||[]).length){ss.blockIndex=next;if(S.sel?.conditioningSession===ss)setTimeout(()=>{if(S.sel?.conditioningSession===ss&&!conditioningTimerBusy())render();},0);}
    else if(!advance&&S.sel?.conditioningSession===ss)setTimeout(()=>{if(S.sel?.conditioningSession===ss)render();},0);   // (shows the last result in the list)
    if(advance)setTimeout(()=>{
      if(ConditioningTimer.owner!==ss||ss.completed||ss.currentBlockIndex+1!==next)return;
      ss.blockIndex=next;ss.currentBlockIndex=next;
      ConditioningTimer.start(sessionBlockConfig(flow,ss.blocks[next],{auto:true}));
      if(S.sel?.conditioningSession===ss)render();
    },500);
  }
});
