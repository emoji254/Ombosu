<body>
<div class="shell">
  <header class="top">
    <span class="mark" aria-hidden="true"></span>
    <h1>Nyaega</h1>
    <span class="status" id="status">Starting…</span>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="workoutDock" class="workout-dock" hidden></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="dlg"><form method="dialog"><div class="dlg-body" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div><button type="submit" class="dlg-enter" tabindex="-1" aria-hidden="true">Submit</button></form></dialog>

<script>
/* ---------------------------------------------------------------
   Storage: IndexedDB in this browser (local mode), or one JSON file the
   coach connects (file mode). If IndexedDB can't be opened the app falls
   back to localStorage. The Store facade below is the same either way.
----------------------------------------------------------------*/
const COLLS = ['clients','groups','programs','logs','attendance','conditioning','schedule','scheduleExceptions'];
let MODE = 'local';   // 'local' (IndexedDB, or localStorage as a fallback) or 'file'
let FILE_HANDLE = null, FileData = null;

/* A read that fails must never look like "no data" — callers would then write
   over the real data. StorageLoadError stops boot and every write path. */
class StorageLoadError extends Error {
  constructor(what, cause){ super('Could not read ' + what + (cause && cause.message ? ' — ' + cause.message : '')); this.name = 'StorageLoadError'; this.what = what; this.cause = cause; }
}
const LS = {
  key: c => 'nyaega:' + c,
  all(c){
    const raw = localStorage.getItem(LS.key(c));
    if (raw == null) return {};
    let parsed;
    try { parsed = JSON.parse(raw); } catch(e){ throw new StorageLoadError('stored ' + c, e); }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new StorageLoadError('stored ' + c, new Error('unexpected data shape'));
    return parsed;
  },
  // LS.all throws on damaged data, so these never overwrite a collection they couldn't read.
  put(c,id,data){ const m = LS.all(c); m[id] = data; LS.write(LS.key(c), JSON.stringify(m), c); },
  del(c,id){ const m = LS.all(c); delete m[id]; LS.write(LS.key(c), JSON.stringify(m), c); },
  write(key, text, what){ try { localStorage.setItem(key, text); } catch(e){ throw new StorageWriteError(what, e); } }
};
const isQuotaError = e => !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message || '')));
/* Every failed write becomes a StorageWriteError, so the UI can tell the coach
   plainly that something was NOT saved (and whether storage is full). */
const STORAGE_LABELS = { logs:'the session', clients:'the client', attendance:'the attendance mark', programs:'the program', groups:'the pairing', conditioning:'the conditioning program', exercises:'the exercise library', activeWorkoutDraft:'the workout backup copy', activeSessions:'the workout backup copy', workoutDraftArchive:'the saved-workouts list' };
const storageLabel = what => STORAGE_LABELS[what] || what;
class StorageWriteError extends Error {
  constructor(what, cause){
    const full = isQuotaError(cause);
    what = String(what || 'your changes').replace(/^\w+/, w => storageLabel(w));
    super(full ? 'This device\'s storage is full, so ' + what + ' could not be saved' : 'Could not save ' + what + (cause && cause.message ? ' — ' + cause.message : ''));
    this.name = 'StorageWriteError'; this.what = what; this.cause = cause; this.quota = full;
  }
}



/* ---------------------------------------------------------------
   Local back end: IndexedDB — one object store per collection, plus "meta" and "snapshots".
   (logs are indexed by clientId and date; attendance by date and clientId.) It replaces the old
   localStorage copy, which is migrated once and kept as a read-only backup for 30 days.
   If IndexedDB can't be opened at all, the app keeps using localStorage as before.
----------------------------------------------------------------*/
let LOCAL = 'ls';   // 'idb' once IndexedDB is open and the one-time copy is verified
const IDB = {
  name:'nyaega-data', db:null, opening:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    if (this.opening) return this.opening;
    return this.opening = new Promise((resolve, reject) => {
      const r = indexedDB.open(this.name, 3);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox');   // v2: changes waiting to sync
        if (!db.objectStoreNames.contains('versions')) db.createObjectStore('versions');   // v3: the server version last seen per document
        if (!db.objectStoreNames.contains('conflicts')) db.createObjectStore('conflicts');   // v3: edits that clashed with another device
        if (db.objectStoreNames.contains('logs')) return;   // upgrading from v1: the data stores already exist
        COLLS.forEach(c => {
          const s = db.createObjectStore(c);
          if (c === 'logs'){ s.createIndex('clientId', 'clientId'); s.createIndex('date', 'date'); }
          if (c === 'attendance'){ s.createIndex('date', 'date'); s.createIndex('clientId', 'clientId'); }
        });
        db.createObjectStore('meta'); db.createObjectStore('snapshots');
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); this.db = null; this.opening = null; }; resolve(this.db); };
      r.onerror = () => { this.opening = null; reject(r.error); };
      r.onblocked = () => { this.opening = null; reject(new Error('IndexedDB is blocked by another open tab')); };
    });
  },
  async run(stores, mode, fn){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(stores, mode); let out;
      try { out = fn(tx); } catch(e){ try { tx.abort(); } catch {} reject(e); return; }
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => reject(tx.error || new Error('transaction failed'));
    });
  },
  async all(store){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const out = {}, tx = db.transaction(store, 'readonly'), cur = tx.objectStore(store).openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c){ out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => reject(tx.error || new Error('read failed'));
    });
  },
  async get(store, key){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).get(key); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  async keys(store){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).getAllKeys(); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  async count(store){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).count(); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  put(store, key, value){ return this.run(store, 'readwrite', tx => { tx.objectStore(store).put(value, key); }); },
  del(store, key){ return this.run(store, 'readwrite', tx => { tx.objectStore(store).delete(key); }); },
  /* pairs: [[id, doc], ...] — one transaction, all or nothing */
  putMany(store, pairs){ return this.run(store, 'readwrite', tx => { const s = tx.objectStore(store); pairs.forEach(([id, doc]) => s.put(doc, id)); }); }
};
const IDB_FLAG = 'nyaega:idbMigrated';   // once set, never fall back to the old localStorage copy
function lsDataKeys(){
  const keys = [];
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (!k || !k.startsWith('nyaega:')) continue; const rest = k.slice(7); if (COLLS.includes(rest) || rest.startsWith('meta:')) keys.push(k); } } catch {}
  return keys;
}
/* Copy the old localStorage data into IndexedDB in one transaction, verify the counts, and only then mark it done.
   The old keys are NOT touched; they stay as a read-only backup (see expireLocalStorageBackup). */
async function migrateFromLocalStorage(){
  if (await IDB.get('meta', 'migration')) return;
  const keys = lsDataKeys(), now = new Date();
  if (!keys.length){ await IDB.put('meta', 'migration', { at:now.toISOString(), source:'none', counts:{} }); return; }
  const data = {}, counts = {};
  for (const c of COLLS){ data[c] = LS.all(c); counts[c] = Object.keys(data[c]).length; }   // throws on damaged data, before anything is written
  const meta = {};
  for (const k of keys){
    if (!k.startsWith('nyaega:meta:')) continue;
    const raw = localStorage.getItem(k); if (raw == null) continue;
    let v; try { v = JSON.parse(raw); } catch(e){ throw new StorageLoadError('stored ' + k.slice(12), e); }
    if (v != null) meta[k.slice(12)] = v;
  }
  counts.meta = Object.keys(meta).length;
  await IDB.run([...COLLS, 'meta'], 'readwrite', tx => {
    COLLS.forEach(c => { const s = tx.objectStore(c); Object.entries(data[c]).forEach(([id, doc]) => s.put(doc, id)); });
    const m = tx.objectStore('meta'); Object.entries(meta).forEach(([id, v]) => m.put(v, id));
  });
  const bad = [];
  for (const c of COLLS){ const n = await IDB.count(c); if (n !== counts[c]) bad.push(c + ' ' + n + '/' + counts[c]); }
  const nm = await IDB.count('meta'); if (nm !== counts.meta) bad.push('meta ' + nm + '/' + counts.meta);
  if (bad.length){
    await IDB.run([...COLLS, 'meta'], 'readwrite', tx => { [...COLLS, 'meta'].forEach(s => tx.objectStore(s).clear()); });
    throw new Error('the copy to IndexedDB did not match (' + bad.join(', ') + ')');
  }
  await IDB.put('meta', 'migration', { at:now.toISOString(), source:'localStorage', counts, keys, backupUntil:new Date(now.getTime() + 30 * 86400000).toISOString() });
}
/* After 30 days the old localStorage copy is removed (the verified IndexedDB copy is the only one from then on). */
async function expireLocalStorageBackup(){
  const m = await IDB.get('meta', 'migration');
  if (!m || !m.backupUntil || m.cleaned || Date.now() < Date.parse(m.backupUntil)) return;
  (m.keys || []).forEach(k => { try { localStorage.removeItem(k); } catch {} });
  await IDB.put('meta', 'migration', { ...m, cleaned:new Date().toISOString() });
}
async function initLocalBackend(){
  LOCAL = 'ls';
  const migratedBefore = (() => { try { return localStorage.getItem(IDB_FLAG) === '1'; } catch { return false; } })();
  if (!window.indexedDB){ if (migratedBefore) throw new StorageLoadError('browser storage', new Error('IndexedDB is not available')); return; }
  try {
    await IDB.open(); await migrateFromLocalStorage(); LOCAL = 'idb';
    try { localStorage.setItem(IDB_FLAG, '1'); } catch {}
    expireLocalStorageBackup().catch(e => console.warn('Old-backup cleanup failed', e));
  } catch(e){
    if (e instanceof StorageLoadError) throw e;
    // Never slip back to a stale localStorage copy once IndexedDB has been the real store.
    if (migratedBefore) throw new StorageLoadError('browser storage', e);
    console.warn('IndexedDB unavailable — staying on localStorage', e); LOCAL = 'ls';
  }
}
/* Every stored document carries its own id and timestamps. */
function stampDoc(coll, id, data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return;
  data.id = id;
  const now = new Date().toISOString();
  if (!data.createdAt) data.createdAt = coll === 'clients' ? todayISO() : now;
  data.updatedAt = now;
}

const Store = {
  async init(){
    Store.initError = null;
    if (MODE === 'local'){ try { await initLocalBackend(); } catch(e){ Store.initError = e; } }
    return MODE;
  },
  async loadAll(coll){
    if (MODE === 'file') return FileData[coll] || {};
    if (LOCAL === 'idb'){
      try { return await IDB.all(coll); } catch(e){ throw new StorageLoadError(coll, e); }
    }
    return LS.all(coll);
  },
  /* put/del/putMeta resolve only once the data is really stored, and reject
     with StorageWriteError otherwise — in every mode. */
  async put(coll, id, data){
    stampDoc(coll, id, data);
    if (MODE === 'file'){
      const had = Object.prototype.hasOwnProperty.call(FileData[coll], id), prev = FileData[coll][id];
      FileData[coll][id] = data;
      if (fileBatchDepth) return;   // Store.batch writes once at the end
      try { await queueFileWrite(coll); }
      catch(e){ if (had) FileData[coll][id] = prev; else delete FileData[coll][id]; throw e; }
      return;
    }
    if (LOCAL === 'idb'){
      try { await IDB.put(coll, id, data); } catch(e){ throw new StorageWriteError(coll, e); }
      await Sync.enqueue('put', coll, id, data);
    } else LS.put(coll, id, data);

  async del(coll, id){

      try { await queueFileWrite(coll); }
      catch(e){ if (had) FileData[coll][id] = prev; throw e; }
      return;
    }

  async getMeta(id, fallback){
    if (MODE === 'file') return FileData?.meta?.[id] ?? fallback;
    if (LOCAL === 'idb'){
      let v; try { v = await IDB.get('meta', id); } catch(e){ throw new StorageLoadError('stored ' + id, e); }
      return v == null ? fallback : v;
    }

    try { return JSON.parse(raw) ?? fallback; } catch(e){ throw new StorageLoadError('stored ' + id, e); }
  },
  async putMeta(id, data){
    if (MODE === 'file'){

      const had = Object.prototype.hasOwnProperty.call(FileData.meta, id), prev = FileData.meta[id];
      FileData.meta[id] = data;
      if (fileBatchDepth) return;   // Store.batch writes once at the end
      try { await queueFileWrite(id); }
      catch(e){ if (had) FileData.meta[id] = prev; else delete FileData.meta[id]; throw e; }
      return;
    }
    if (LOCAL === 'idb'){
      try { if (data == null) await IDB.del('meta', id); else await IDB.put('meta', id, data); }
      catch(e){ throw new StorageWriteError(id, e); }

  },
  /* Many documents of one collection in a single transaction (IndexedDB) — used by migrations. `live` is updated too. */
  async bulkPut(coll, pairs, live){
    pairs.forEach(([id, doc]) => stampDoc(coll, id, doc));
    if (MODE === 'local' && LOCAL === 'idb'){
      try { await IDB.putMany(coll, pairs); } catch(e){ throw new StorageWriteError(coll, e); }
      for (const [id, doc] of pairs) await Sync.enqueue('put', coll, id, doc);
    } else { for (const [id, doc] of pairs) await this.put(coll, id, doc); }
    if (live) pairs.forEach(([id, doc]) => { live[id] = doc; });

  /* Many changes, one save. In file mode the file is written once when fn finishes;
     if that write fails, every change made inside fn is undone in memory and the error is
     rethrown. Other modes just run fn (their writes are per-record already). */
  async batch(fn){
    if (MODE !== 'file') return fn();
    const snapshot = JSON.stringify(FileData);
    fileBatchDepth++;
    let result;
    try { result = await fn(); }
    finally { fileBatchDepth--; }
    if (fileBatchDepth) return result;
    try { await queueFileWrite('your changes'); }
    catch(e){
      // Restore in place: S's collections are the same objects as FileData's.
      const before = JSON.parse(snapshot);
      for (const key of [...COLLS, 'meta']){ const live = FileData[key] || (FileData[key] = {}); for (const k of Object.keys(live)) delete live[k]; Object.assign(live, before[key] || {}); }
      throw e;
    }
    return result;
  }
};

/* ---------------------------------------------------------------
   File mode: everything lives in one JSON file the person picks
   with the browser's native file dialog (File System Access API,
   Chrome/Edge/Opera). The file handle is remembered in IndexedDB,
   so after a refresh the app asks to reconnect instead of quietly
   switching to browser storage.
----------------------------------------------------------------*/
/* Writes never overlap. Every change made while a write is running shares ONE
   follow-up write, so a burst of saves becomes one or two writes, not one each.
   Each caller's promise rejects if the write carrying its change fails. */
let fileWriteRunning = null, fileWritePending = null, fileBatchDepth = 0;
function queueFileWrite(what){
  if (!fileWritePending){
    const pending = (fileWriteRunning || Promise.resolve()).catch(() => {}).then(() => {
      fileWritePending = null; fileWriteRunning = pending;   // later changes queue behind this write
      return writeFileNow();
    });
    pending.finally(() => { if (fileWriteRunning === pending) fileWriteRunning = null; }).catch(() => {});
    fileWritePending = pending;
  }
  return fileWritePending.catch(e => { console.warn('file write failed', e); throw new StorageWriteError((what || 'your changes') + ' to ' + (FILE_HANDLE ? FILE_HANDLE.name : 'the data file'), e); });
}

  async run(mode, fn){ const db = await this.open(); return new Promise((resolve, reject) => { const tx = db.transaction('kv', mode), req = fn(tx.objectStore('kv')); tx.oncomplete = () => { db.close(); resolve(req && req.result); }; tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); }; }); },
  get(key){ return this.run('readonly', s => s.get(key)); },

    logs:FileData.logs, attendance:FileData.attendance, conditioning:FileData.conditioning,

    `<p>From now on, changes are saved in this browser — <strong>not</strong> in ${esc(name)}.</p><p class="small muted">The file stays exactly as it is, but the two copies will then differ. You can connect a data file again later from the Data tab.</p>`,

}

     {label:'Keep this device\'s', kind:'primary', onClick:() => { resolveConflict(key, 'mine'); }},
     {label:'Keep the other', onClick:() => { resolveConflict(key, 'theirs'); }},
     ...(c.coll === 'logs' ? [{label:'Keep both', onClick:() => { resolveConflict(key, 'both'); }}] : [])]);
}
async function resolveConflict(key, choice){
  const c = await IDB.get('conflicts', key); if (!c) return;
  const { coll, id } = c;
  try {
    if (choice === 'theirs'){
      await IDB.put(coll, id, c.remote.data); S[coll][id] = c.remote.data;
    } else {
      const mine = S[coll][id] || c.local;
      await IDB.put('versions', key, c.remote.version);
      if (choice === 'both' && coll === 'logs'){
        const nid = id + '-b' + uid().slice(0, 4), copy = { ...c.remote.data, id:nid };
        await Store.put('logs', nid, copy); S.logs[nid] = copy;
      }
      await Store.put(coll, id, mine); S[coll][id] = mine;   // queued: goes up on top of the server's version
    }
    await IDB.put('versions', key, c.remote.version);
    await IDB.del('conflicts', key);
  } catch(e){ showSaveError(e); return; }
  invalidateLogIndex(); invalidateAttIndex();
  await loadConflicts(); toast('Conflict resolved'); render({ keepScroll:true }); Sync.schedule(300);
}

/* ---- right to erasure: remove the client from this device, every local copy, and (via sync) the account ---- */
async function scrubErasedClient(cid, erased){
  const mine = r => r && r.logClient === cid;
  S.sessions = S.sessions.filter(r => !mine(r));
  S.recoveryArchive = (S.recoveryArchive || []).filter(r => !mine(r));
  S.recoveryList = (S.recoveryList || []).filter(r => !mine(r));
  try { await Store.putMeta('workoutDraftArchive', S.recoveryArchive); await clearWorkoutAutosave(); } catch(e){ console.warn('Could not clear saved sessions', e); }
  // daily snapshots
  if (MODE === 'local' && LOCAL === 'idb'){
    try {
      const index = ((await Store.getMeta('snapshotIndex', null)) || { list:[] }).list;
      for (const k of await IDB.keys('snapshots')){
        const snap = await IDB.get('snapshots', k); if (!snap) continue;
        let changed = false;
        if (snap.clients && snap.clients[cid]){ delete snap.clients[cid]; changed = true; }
        for (const coll of ['logs', 'attendance']) for (const [id, d] of Object.entries(snap[coll] || {})) if (d && d.clientId === cid){ delete snap[coll][id]; changed = true; }
        for (const [id, s] of Object.entries(snap.schedule || {})) if (s && (s.clientIds || []).includes(cid)){ const rest = s.clientIds.filter(x => x !== cid); if (rest.length) s.clientIds = rest; else delete snap.schedule[id]; changed = true; }
        for (const [id, x] of Object.entries(snap.scheduleExceptions || {})) if (x && x.key === cid){ delete snap.scheduleExceptions[id]; changed = true; }
        if (changed){
          snap.counts = {}; COLLS.forEach(c2 => snap.counts[c2] = Object.keys(snap[c2] || {}).length);
          await IDB.put('snapshots', k, snap);
          const row = index.find(x => x.key === k); if (row) row.counts = snap.counts;
        }
      }
      await Store.putMeta('snapshotIndex', { list:index });
    } catch(e){ console.warn('Could not clean the daily snapshots', e); }
  }
  // the read-only localStorage copy kept for 30 days after the IndexedDB upgrade
  try {
    for (const coll of COLLS){
      const raw = localStorage.getItem('nyaega:' + coll); if (!raw) continue;
      const m = safeParse(raw); let changed = false;
      for (const [id, d] of Object.entries(m)){
        if (coll === 'clients' && id === cid || (d && d.clientId === cid) || (coll === 'scheduleExceptions' && d && d.key === cid)){ delete m[id]; changed = true; }
        else if (coll === 'schedule' && d && (d.clientIds || []).includes(cid)){ const rest = d.clientIds.filter(x => x !== cid); if (rest.length) d.clientIds = rest; else delete m[id]; changed = true; }
      }
      if (changed) localStorage.setItem('nyaega:' + coll, JSON.stringify(m));
    }
  } catch(e){ console.warn('Could not clean the old browser copy', e); }
  // account copy: when signed in the deletions are already queued; otherwise remember them for the next sign-in
  try {
    const linked = await Store.getMeta('syncUser', null);
    await Sync.markErased(cid);
    // queued even while signed out, so the online copy is erased at the next sign-in; the client row becomes a tombstone that always wins
    if (Sync.enabled() && (Sync.signedIn() || Sync.linkedId)) await IDB.put('outbox', 'clients/' + cid, { coll:'clients', id:cid, op:'erase', doc:null, queuedAt:Date.now() });
    const log = ((await Store.getMeta('deletionLog', null)) || { list:[] }).list;
    log.push({ at:new Date().toISOString(), records:erased.length, account:!!linked });   // no names or ids are kept
    await Store.putMeta('deletionLog', { list:log.slice(-200) });
    S.deletionCount = log.length;
  } catch(e){ console.warn('Could not record the deletion', e); }
  Audit.log('delete-client', { records:erased.length });
  if (Sync.signedIn()) Sync.schedule(300);
}

/* ---- retention ---- */
function lastActivityOf(cid){
  const c = S.clients[cid] || {};
  const dates = [...(attIndex().byClient[cid] || []).map(a => a.date), ...(logIndex().byClient[cid] || []).map(l => l.date), c.createdAt && String(c.createdAt).slice(0, 10)].filter(Boolean);
  return dates.sort().pop() || todayISO();
}
const monthsAgoISO = n => { const d = new Date(); d.setMonth(d.getMonth() - n); return isoOf(d); };
function retentionReport(){
  const archiveCut = monthsAgoISO(Number(S.retention.archiveMonths) || 12), deleteCut = monthsAgoISO(Number(S.retention.deleteMonths) || 36);
  const toArchive = [], toDelete = [];
  for (const [id, c] of Object.entries(S.clients)){
    const last = lastActivityOf(id);
    if (c.status === 'archived'){ if (last < deleteCut) toDelete.push({ id, name:c.name, last }); }
    else if (last < archiveCut) toArchive.push({ id, name:c.name, last });
  }
  return { toArchive, toDelete };
}
function retentionReminderHTML(){
  const r = retentionReport(); if (!r.toArchive.length && !r.toDelete.length) return '';
  const lines = [];
  if (r.toArchive.length) lines.push(`${r.toArchive.length} client${r.toArchive.length === 1 ? ' has' : 's have'} had no activity for ${esc(S.retention.archiveMonths)}+ months: ${r.toArchive.slice(0, 4).map(x => esc(x.name)).join(', ')}${r.toArchive.length > 4 ? '…' : ''}. Consider archiving.`);
  if (r.toDelete.length) lines.push(`${r.toDelete.length} archived client${r.toDelete.length === 1 ? ' is' : 's are'} past ${esc(S.retention.deleteMonths)} months: ${r.toDelete.slice(0, 4).map(x => esc(x.name)).join(', ')}${r.toDelete.length > 4 ? '…' : ''}. Consider deleting their data.`);
  return `<div class="panel" role="status" style="margin-top:.8rem;border-left:4px solid var(--warn)"><div class="spread"><div><strong>Data retention</strong><div class="small muted">${lines.join('<br>')}</div></div><button type="button" class="btn ghost sm" data-go="clients">Review clients</button></div></div>`;
}

/* ---------------------------------------------------------------
   Devices and audit log. Each browser that signs in registers itself as a device. The first device is approved
   automatically; every later one must be approved from an approved device, and any device can be revoked. The
   server (row-level security) refuses data requests from devices that are pending or revoked, so revoking works
   immediately even if the lost device still holds a valid sign-in. The audit log is append-only on the server.
----------------------------------------------------------------*/
function deviceLabel(){
  const ua = navigator.userAgent || '';
  const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
  return browser + (os ? ' on ' + os : '');
}
/* Each device has an id and a secret. The id is how it is named; the secret (random, made here, never shown) is what proves
   it is that device: the server keeps only its hash. Both live only in this browser's storage and are not part of any export. */
async function ensureDeviceId(fresh){
  let m = fresh ? null : await Store.getMeta('deviceId', null), changed = false;
  if (!m || !m.id){ m = { id:(crypto.randomUUID ? crypto.randomUUID() : uid() + uid() + uid()) }; changed = true; }

/* ---- assistant: accepting an invitation ---- */
const INVITE_KEY = 'nyaega:invite';
function captureInviteFromUrl(){
  try {
    const u = new URL(location.href), t = u.searchParams.get('invite');
    if (!t) return;
    sessionStorage.setItem(INVITE_KEY, t.slice(0, 200));
    u.searchParams.delete('invite'); history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);   // the token never stays in the address bar
  } catch {}
}
function pendingInvite(){ try { return sessionStorage.getItem(INVITE_KEY) || ''; } catch { return ''; } }
function maybeOfferInvite(){
  const token = pendingInvite(); if (!token) return;
  setTimeout(() => {
    if (!Sync.signedIn()){
      dialog('You have been invited', '<p>Someone has invited you to help coach their clients. Create an account or sign in (Data tab > Account and sync), and you will be asked to accept.</p>', [{label:'Later'}, {label:'Go to sign-in', kind:'primary', onClick:() => { S.view = 'dashboard'; S.sub = 'data'; S.dataSection = 'online'; S.sel = {}; render(); }}]);
      return;
    }
    dialog('Accept the invitation?', `<p>You will be able to see and update <strong>only the clients the owner assigns to you</strong>. You will not be able to export, import or delete data.</p><p class="small muted">Use a browser or profile that has no coaching data of its own: this device will hold the owner's clients while you are an assistant.</p>`, [
      {label:'Not now'},
      {label:'Decline', onClick:() => { try { sessionStorage.removeItem(INVITE_KEY); } catch {} }},
      {label:'Accept', kind:'primary', onClick: async () => {
        if (Object.keys(S.clients).length){ toast('This browser already holds client data. Open the link in a clean browser profile.'); return false; }
        try { await Sync.api('/rest/v1/rpc/accept_invite', { method:'POST', body:{ p_token:token, p_label:(Sync.session.user.email || '') } }); }
        catch(e){ toast(e.message || 'Could not accept'); return false; }
        try { sessionStorage.removeItem(INVITE_KEY); } catch {}
        Audit.log('assistant-accept');
        await Sync.detectRole(); toast('You are now an assistant'); Sync.schedule(100); render({ keepScroll:true });
      }}]);
  }, 600);
}

/* ---------------------------------------------------------------
   Sign-in and app lock screen. What it is and is not:
   - The PIN and biometrics UNLOCK THE APP ON THIS DEVICE (a privacy screen for a phone left on a gym bench).
     They are not a server login: the account password (or a "keep me signed in" session) is what reaches your account.
   - The lock keeps casual onlookers out. It does not encrypt the data stored in this browser; anyone with the
     unlocked device and developer tools could still read it. Use a device passcode too.
   - Roles shown here are a hint for what to expect; the server decides what an account really is.

const LAST_ROLE_KEY = 'nyaega:lastRole', LOCK_FAILS_KEY = 'nyaega:lockfails';
async function pinDerive(text, saltB64, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(text), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256' }, key, 256)));
}

  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', bytes = crypto.getRandomValues(new Uint8Array(16));
  const chars = [...bytes].map(b => alphabet[b % alphabet.length]);
  return [0, 4, 8, 12].map(i => chars.slice(i, i + 4).join('')).join('-');

      user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:'nyaega-this-device', displayName:'Nyaega on this device' },
      pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' }, timeout:60000, attestation:'none' } });

  },
  async verify(id){
    const a = await navigator.credentials.get({ publicKey:{ challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname, allowCredentials:[{ type:'public-key', id:unb64(id) }], userVerification:'required', timeout:60000 } });

/* ---------------------------------------------------------------
   "Continue with Google" (Supabase OAuth, PKCE flow). Needs Google enabled as a provider in Supabase
   (Authentication > Providers > Google) and this page's address in the redirect URL list. The browser leaves for
   Google and comes back with a one-time code that is exchanged for a session; no password is involved.
----------------------------------------------------------------*/
Object.assign(Sync, {
  async oauth(provider){
    const back = this.redirect();
    if (!back) throw new Error('Google sign-in needs the app to be opened from a web address (not a file).');
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    sessionStorage.setItem('nyaega:pkce', verifier);
    location.href = SUPABASE_URL + '/auth/v1/authorize?provider=' + encodeURIComponent(provider) + '&redirect_to=' + encodeURIComponent(back) + '&code_challenge=' + challenge + '&code_challenge_method=s256';
  },
  async finishOAuth(code, opts = {}){
    const verifier = sessionStorage.getItem('nyaega:pkce'); sessionStorage.removeItem('nyaega:pkce');
    if (!verifier) throw new Error('The sign-in was started in a different window. Please try again.');
    this.keep = true;   // OAuth users expect to stay signed in
    const d = await this.raw('/auth/v1/token?grant_type=pkce', { method:'POST', body:{ auth_code:code, code_verifier:verifier } });
    if (opts.onlyUserId && !(d.user && d.user.id === opts.onlyUserId)){
      try { await this.raw('/auth/v1/logout', { method:'POST', token:d.access_token }); } catch {}
      throw new Error('This device is locked to another account. Use your PIN.');
    }
    await this.afterSignIn(d);
    await this.detectRole();
  }
});
/* Reads (and removes from the address bar) the result of a Google sign-in redirect. */
function takeOAuthResult(){
  try {
    const u = new URL(location.href), code = u.searchParams.get('code');
    const hash = new URLSearchParams(u.hash.replace(/^#/, ''));
    const error = u.searchParams.get('error_description') || u.searchParams.get('error') || hash.get('error_description') || hash.get('error');
    if (!code && !error) return null;
    ['code', 'error', 'error_code', 'error_description'].forEach(k => u.searchParams.delete(k));
    history.replaceState(null, '', u.pathname + (u.search || ''));
    return { code, error };
  } catch { return null; }
}
async function completeOAuth(res){
  if (!res) return;
  if (res.error || !res.code){ toast('Sign-in did not finish: ' + (res.error || 'no code returned')); return; }
  if (Lock.locked && !Sync.linkedId){ toast('This device is locked. Use your PIN.'); return; }
  try { await Sync.finishOAuth(res.code, { onlyUserId:Lock.locked ? Sync.linkedId : undefined }); if (Lock.locked) Lock.hide(); toast(Sync.role === 'assistant' ? 'Welcome, assistant' : 'Signed in'); S.view = 'dashboard'; S.sub = 'today'; S.sel = {}; render(); }
  catch(e){ toast('Sign-in failed: ' + (e.message || 'unknown error')); }
}

/* ---------------------------------------------------------------
   Sync hardening (audit follow-up): changes are queued whenever the device has ever been linked to an account (even
   while signed out); clients only sync with recorded consent for storage outside Kenya; an erasure is a tombstone
   that always wins; queue failures are visible.
----------------------------------------------------------------*/
Object.assign(Sync, {
  linkedId:null, erased:new Set(),
  consentOk(c){ return !!(c && c.consent && c.consent.given && !c.consent.withdrawnAt && c.consent.outsideKenya); },
  /* May this record be copied to the online account? (An assistant only ever works on data the owner already shares.) */
  syncAllowed(coll, doc){
    if (this.role === 'assistant') return true;
    if (coll === 'clients') return this.consentOk(doc);
    if (coll === 'logs' || coll === 'attendance') return !!doc && this.consentOk(S.clients[doc.clientId]);
    if (coll === 'schedule') return !!doc && (doc.clientIds || []).length > 0 && doc.clientIds.every(i => this.consentOk(S.clients[i]));
    if (coll === 'scheduleExceptions'){ const c = doc && S.clients[doc.key]; return c ? this.consentOk(c) : true; }
    return true;
  },
  dependentsOf(cid){
    const out = [];
    Object.entries(S.logs).forEach(([id, d]) => { if (d.clientId === cid) out.push(['logs', id, d]); });
    Object.entries(S.attendance).forEach(([id, d]) => { if (d.clientId === cid) out.push(['attendance', id, d]); });
    Object.entries(S.schedule).forEach(([id, d]) => { if ((d.clientIds || []).includes(cid)) out.push(['schedule', id, d]); });
    Object.entries(S.scheduleExceptions).forEach(([id, d]) => { if (d.key === cid) out.push(['scheduleExceptions', id, d]); });
    return out;
  },
  async put2outbox(op, coll, id, doc){
    await IDB.put('outbox', coll + '/' + id, { coll, id, op, doc: op === 'put' ? JSON.parse(JSON.stringify(doc)) : null, queuedAt:Date.now() });
  },
  /* A client's consent changed: take their records off the server, or put them on it. */
  async consentSweep(cid, doc){
    const allowed = this.consentOk(doc);
    for (const [coll, id, d] of this.dependentsOf(cid)){
      const onServer = (await this.baseVersion(coll, id)) != null;
      if (!allowed && onServer) await this.put2outbox('unshare', coll, id, null);
      else if (allowed && !onServer && (coll !== 'schedule' || (d.clientIds || []).every(i => i === cid || this.consentOk(S.clients[i])))) await this.put2outbox('put', coll, id, d);
    }
  },
  async enqueue(op, coll, id, doc){
    if (!this.enabled() || !(this.signedIn() || this.linkedId)) return;
    try {

        await this.consentSweep(id, doc);

          else await IDB.del('outbox', 'clients/' + id);

          return;
        }

        await IDB.del('outbox', coll + '/' + id); return;   // no consent for this client: stays on this device
      }

      this.pending = await IDB.count('outbox'); refreshSyncUI();
      if (this.signedIn()) this.schedule(1500);
    } catch(e){
      console.warn('Could not queue a change for sync', e);

  rowOf(it){

  async loadErased(){ this.erased = new Set(((await Store.getMeta('erasedClients', null)) || { list:[] }).list); },
  async markErased(cid){ this.erased.add(cid); await Store.putMeta('erasedClients', { list:[...this.erased].slice(-2000) }); },
  /* Another device erased this client: remove everything about them here and never bring it back. */
  async eraseLocal(cid){
    await this.markErased(cid);

    invalidateLogIndex(); invalidateAttIndex();
  }
});

Object.assign(Sync, {

/* ---------------------------------------------------------------
   N7: a rest that ends for a client who is not on screen still beeps, vibrates and names the client.
----------------------------------------------------------------*/
function openDrafts(){
  const list = [];
  if (S.sel && S.sel.draft) list.push({ draft:S.sel.draft, cid:S.sel.draft.clientId });
  if (S.parkedWorkout && S.parkedWorkout.draft) list.push({ draft:S.parkedWorkout.draft, cid:S.parkedWorkout.logClient });
  S.sessions.forEach(r => { if (r.draft && r.draft.entries) list.push({ draft:r.draft, cid:r.logClient }); });
  return list;
}
function checkOtherRests(current){
  for (const { draft, cid } of openDrafts()){
    if (draft === current || !draft.restRunning || !draft.restEndAt || draft.restEndAt > Date.now()) continue;
    draft.restRunning = false; draft.restEndAt = null; draft.restRemainingMs = 0;
    const n = (S.clients[cid] || {}).name || 'a client';
    toast('Rest done: ' + n); announce('Rest finished for ' + n); cue('restEnd'); scheduleWorkoutAutosave();
  }
}
/* The soonest-ending rest of a client who is not the one on screen (shown beside the main rest clock). */
function otherRestInfo(current){
  let best = null;
  for (const { draft, cid } of openDrafts()){
    if (draft === current || !draft.restRunning || !draft.restEndAt) continue;
    const left = draft.restEndAt - Date.now();
    if (left <= 0) continue;
    if (!best || left < best.left) best = { left, name:(S.clients[cid] || {}).name || 'Client' };
  }
  return best;
}

/* ---------------------------------------------------------------
   N6: the exercise library syncs one record at a time (table exercise_library, one row per exercise), starter
   exercises have the same id on every device, and an older all-in-one library row is merged by name.
   N16: when both sides edited, "newer" is judged on the server's clock (this device's clock is corrected by the

      for (const id of prev.keys()) if (!next.has(id)) await this.put2outbox('del', 'exercises', id, null);
      this.exSnap = this.snapOf(list);   // taken after the edit times were stamped, so the next save compares like with like

/* Schema v2: starter exercises get the same id on every device. Old random starter ids are remapped by name in the
   library, programs, logs and any open sessions. */
async function migrateSeedIds(){
  const seeds = new Map(SEED_EXERCISES.map(e => [normExName(e.name), e]));
  const have = new Set(S.exercises.map(e => e.id)), map = {}, claimed = new Set();
  const next = S.exercises.map(e => {
    const s = seeds.get(normExName(e.name));
    if (!s || e.id === s.id || have.has(s.id) || claimed.has(s.id)) return e;
    claimed.add(s.id); map[e.id] = s.id; return { ...e, id:s.id };
  });
  if (!Object.keys(map).length) return 0;
  if (!(await saveExerciseList(next))) throw new Error('Could not save the exercise library');
  const progPairs = [], logPairs = [];
  for (const [id, p] of Object.entries(S.programs)){
    let ch = false; (p.days || []).forEach(d => (d.items || []).forEach(it => { if (map[it.exId]){ it.exId = map[it.exId]; ch = true; } }));
    if (ch) progPairs.push([id, p]);
  }
  for (const [id, l] of Object.entries(S.logs)){
    let ch = false; workoutLogEntries(l).forEach(e => { for (const k of ['exId', 'exerciseId', 'movementId']) if (map[e[k]]){ e[k] = map[e[k]]; ch = true; } });
    if (ch) logPairs.push([id, l]);
  }
  await Store.batch(async () => {
    if (progPairs.length) await Store.bulkPut('programs', progPairs, S.programs);
    if (logPairs.length) await Store.bulkPut('logs', logPairs, S.logs);
  });
  const fix = dr => ((dr && dr.entries) || []).forEach(e => { if (map[e.exId]) e.exId = map[e.exId]; });
  fix(S.sel && S.sel.draft); fix(S.parkedWorkout && S.parkedWorkout.draft); S.sessions.forEach(r => fix(r.draft)); (S.recoveryArchive || []).forEach(r => fix(r.draft));
  invalidateLogIndex();
  return Object.keys(map).length;
}

/* ---------------------------------------------------------------
   Periodisation. A program has a base prescription (sets, reps, load, RPE, RIR, tempo, rest, notes per exercise) and
   optional per-week changes: item.weeks[week] holds only the fields that differ in that week. program.weekPlan[week]
   gives a week a name and can mark it as a deload. A client's currentWeek picks which week a new session starts from,
   and can advance by itself once every day of the week has been logged.
----------------------------------------------------------------*/

/* Auto-advance is on for a client when they chose it, or (if they never chose) when their program is periodised. */
const autoWeekOn = (c, p) => c && c.autoWeek !== undefined ? !!c.autoWeek : isPeriodised(p);
/* "75%" means 75% of the client's estimated one-rep max for that exercise. */
function percentLoad(load){ const m = String(load == null ? '' : load).trim().match(/^(\d+(?:\.\d+)?)\s*%$/); return m ? Number(m[1]) : null; }
function bestE1RMOf(cid, exId){
  let best = 0;
  for (const l of clientLogs(cid)){
    for (const e of workoutLogEntries(l)){
      if (String(loggedExerciseId(e) ?? '') !== String(exId)) continue;
      for (const s of loggedExerciseSets(e)){
        const w = Number(setWeight(s)), r = Number(setReps(s));
        if (w > 0 && r > 0 && r <= 12) best = Math.max(best, w * (1 + r / 30));

/* After a session is saved: if every day of the client's current week is now logged, move them to the next week. */
async function maybeAdvanceWeek(cid){
  const c = S.clients[cid], p = c && S.programs[c.programId];
  if (!c || !p || !(p.days || []).length || !autoWeekOn(c, p)) return;
  const week = c.currentWeek || 1, total = Number(p.weeks) || 0;
  if (total < 2 || week >= total) return;   // the last week of the block: what comes next is the coach's decision
  const norm = v => String(v || '').trim().toLocaleLowerCase();
  const since = c.weekFrom || isoOf(new Date(Date.now() - 14 * 86400000)), done = new Set();
  for (const l of clientLogs(cid)){
    if (l.type === 'conditioning' || l.programId !== c.programId || (l.week || 1) !== week || String(l.date) < since) continue;
    done.add(norm(l.dayLabel));
  }
  if (!p.days.every(d => done.has(norm(d.name)))) return;
  const before = { ...c }, next = { ...c, currentWeek:week + 1, weekFrom:todayISO() };
  try { await Store.put('clients', cid, next); } catch(e){ showSaveError(e); return; }
  S.clients[cid] = next;
  undoToast(c.name + ' moves to ' + weekTextFor(p, week + 1), async () => {
    const back = { ...before }; await Store.put('clients', cid, back); S.clients[cid] = back; render({ keepScroll:true });
  });
}

/* ---------------------------------------------------------------
   Group conditioning (a pairing): one conditioning session, one shared timer, results kept per client.
   ss.clientIds = [client, partner]; the first client's results are ss.results, the partner's are
   ss.partnerResults[partnerId]. Saving writes one conditioning log per client (linked by sharedSessionId).
----------------------------------------------------------------*/
const sessionClientIds = ss => (ss && Array.isArray(ss.clientIds) && ss.clientIds.length > 1) ? ss.clientIds : null;
const clientNamesOf = (cid, ss) => (sessionClientIds(ss) || [cid]).map(i => (S.clients[i] || {}).name || 'Client').join(' & ');
/* The other active member of this client's pairing, if there is one and they have no session open. */
function partnerOf(cid){
  const c = S.clients[cid]; if (!c || !c.groupId) return null;
  return groupMembers(c.groupId).find(m => m.id !== cid && !sessionFor(m.id)) || null;
}

/* Blocking screen shown when stored data can't be read. The app is never
   rendered and nothing is written, so the stored data stays exactly as it is. */
function showLoadFailure(err){
  S.bootState = 'failed';

    <p class="small muted">To protect your records, the app has stopped before showing or saving anything. Nothing has been changed or deleted.</p>
    ${local ? `<p class="small muted">If this keeps happening, stored data on this device may be damaged. Download a raw copy of everything stored first, so nothing is lost, then ask for help restoring it.</p>` : `<p class="small muted">This is usually a connection problem. Check your connection and try again.</p>`}
    <div class="row">
      <button type="button" class="btn primary" id="retryLoad">Retry</button>
      ${local ? `<button type="button" class="btn ghost" id="downloadRawData">Download raw stored data</button>` : ''}
    </div>
  </div>`;
  document.getElementById('retryLoad').onclick = () => location.reload();
  const raw = document.getElementById('downloadRawData');
  if (raw) raw.onclick = async () => {
    const dump = {};
    try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('nyaega:')) dump[k] = localStorage.getItem(k); } } catch {}
    let idb = null;
    try { if (window.indexedDB){ idb = {}; for (const s of [...COLLS, 'meta']) idb[s] = await IDB.all(s); } } catch(e){ idb = { error:String(e) }; }
    download('nyaega-raw-storage-' + todayISO() + '.json', JSON.stringify({ app:'nyaega', rawLocalStorage:true, savedAt:new Date().toISOString(), keys:dump, indexedDb:idb }, null, 2), 'application/json');
  };
}

/* ---- parallel sessions (semi-private coaching: two clients at once) ----
   The session on screen lives in S.sel (strength: logClient + draft; conditioning: conditioningClient +
   conditioningSession). Every other open session waits in S.sessions, a list of snapshots (most recent first).
   In the combined strength + conditioning flow the strength half waits in S.parkedWorkout and travels with it. */
const sessionKey = rec => (rec && ((rec.draft && rec.draft.id) || (rec.conditioningSession && rec.conditioningSession.id))) || '';
function foregroundKey(){
  if (S.sel?.conditioningClient && S.sel?.conditioningMode === 'both' && S.parkedWorkout) return sessionKey(S.parkedWorkout);
  return (S.sel && S.sel.draft && S.sel.draft.id) || (S.sel && S.sel.conditioningSession && S.sel.conditioningSession.id) || '';
}
function upsertSession(rec, atEnd){
  const k = sessionKey(rec);
  S.sessions = S.sessions.filter(x => sessionKey(x) !== k);
  if (atEnd) S.sessions.push(rec); else S.sessions.unshift(rec);
}
const sessionFor = cid => S.sessions.find(r => r.logClient === cid || ((r.conditioningSession && r.conditioningSession.clientIds) || []).includes(cid)) || null;

/* Moves the session on screen into the parked list (it keeps running by wall clock; nothing is lost). */
function parkWorkout(){
  if (S.sel && S.sel.logClient && S.sel.draft){
    upsertSession({ sessionType:'strength', activePhase:'strength', logClient:S.sel.logClient, dayIndex:S.sel.dayIndex||0, draft:S.sel.draft, backTo:S.sel.backTo||'' });
    return;
  }
  if (S.sel && S.sel.conditioningClient && S.sel.conditioningMode === 'both' && S.parkedWorkout){
    const p = S.parkedWorkout;
    p.draft.conditioningInProgress = S.sel.conditioningSession;
    p.activePhase = 'conditioning';
    p.conditioningId = S.sel.conditioningId;
    p.conditioningMode = 'both';
    p.conditioningSession = S.sel.conditioningSession;
    upsertSession(p); S.parkedWorkout = null;
    return;
  }
  if (S.sel && S.sel.conditioningClient && S.sel.conditioningMode !== 'both'){
    const ss = S.sel.conditioningSession || {};
    if (!ss.id) ss.id = uid();
    upsertSession({ sessionType:'conditioning', logClient:S.sel.conditioningClient, conditioningId:S.sel.conditioningId, conditioningMode:'conditioning', conditioningSession:ss, draft:{ clientId:S.sel.conditioningClient, date:ss.date||todayISO(), startedAt:ss.startedAt||Date.now(), entries:[] } });
  }
}

function resumeParkedWorkout(key){
  if (typeof key !== 'string') key = '';
  if (sessionOpen()){
    if (key && key === foregroundKey()) return true;   // already on screen
    if (S.sel.conditioningClient && ConditioningTimer.state()?.running) ConditioningTimer.pause();
    parkWorkout();
  }
  const i = key ? S.sessions.findIndex(r => sessionKey(r) === key) : 0;
  const parked = S.sessions[i]; if (!parked) return false;
  S.sessions.splice(i, 1);
  if (parked.sessionType === 'conditioning'){
    S.sel = { conditioningClient:parked.logClient, conditioningId:parked.conditioningId, conditioningMode:'conditioning', conditioningSession:parked.conditioningSession };
  } else if (parked.activePhase === 'conditioning' && parked.conditioningSession){
    S.parkedWorkout = parked;
    S.sel = { conditioningClient:parked.logClient, conditioningId:parked.conditioningId || parked.draft.conditioningTemplateId, conditioningMode:'both', conditioningSession:parked.conditioningSession };
  } else {
    S.sel = { logClient:parked.logClient, dayIndex:parked.dayIndex, draft:parked.draft, backTo:parked.backTo };
  }
  render(); scheduleWorkoutAutosave(); return true;
}
let activeWorkoutSaveTimer=null,activeWorkoutSaveChain=Promise.resolve(),legacyDraftCleared=false;

function setWorkoutSaveStatus(text){const el=document.getElementById('workoutSaveStatus');if(el)el.textContent=text;}

function ensureSetDefaults(set){

/* Reads a prescribed rest into seconds. Accepts "1:30", "90", "90s", "90 sec", "2m", "2 min",
   "2'", "1.5 min", "2m30s", "2 min 30", "2'30\"" and ranges such as "90-120s" or "2-3 min"
   (the lower value is used). A bare number of 10 or less ("3", "2-3") means minutes — nobody
   prescribes 3 seconds of rest; bigger bare numbers ("90") are seconds. Anything it can't read
   falls back to 90 seconds. */
const bareRestSeconds=n=>n<=10?n*60:n;
const REST_UNIT_SECONDS=[[/^(h|hr|hrs|hour|hours)$/,3600],[/^(m|min|mins|minute|minutes|')$/,60],[/^(s|sec|secs|second|seconds|"|'')$/,1]];

function prescribedRestSeconds(value){
  const text=String(value??'').trim().toLowerCase().replace(/,/g,'.').replace(/[’′]/g,"'").replace(/[”″]/g,'"').replace(/\s+/g,' ');
  if(!text)return 90;
  const valid=n=>Number.isFinite(n)&&n>0?Math.round(n):90;
  const clock=text.match(/^(\d+):(\d{1,2})$/);if(clock)return valid(Number(clock[1])*60+Number(clock[2]));
  const range=text.match(/^(\d+(?:\.\d+)?) ?(?:-|–|to) ?\d+(?:\.\d+)? ?([a-z'"]*)\.?$/);
  if(range){const unit=restUnitSeconds(range[2]);return unit===undefined?90:valid(unit?Number(range[1])*unit:bareRestSeconds(Number(range[1])));}
  if(/^\d+(?:\.\d+)?$/.test(text))return valid(bareRestSeconds(Number(text)));
  // One or more "number + optional unit" parts, e.g. "2m30s" or "2 min 30".
  const part=/(\d+(?:\.\d+)?) ?([a-z]+|''|'|")? ?/y;let total=0,pos=0,lastUnit=null,parts=0;
  while(pos<text.length){
    part.lastIndex=pos;const m=part.exec(text);if(!m||m[0]==='')return 90;
    let unit=restUnitSeconds(m[2]);if(unit===undefined)return 90;
    if(unit===null)unit=lastUnit===60?1:lastUnit===3600?60:1;   // bare number: seconds, or the next unit down ("2 min 30")
    total+=Number(m[1])*unit;lastUnit=unit;parts++;pos=part.lastIndex;

  return parts?valid(total):90;
}
/* Each superset / tri-set gets the next letter in the order they appear (A, B, C…) and its

  const entries=S.sel.draft.entries,order=[];
  entries.forEach(item=>{if(item.groupId&&!order.includes(item.groupId))order.push(item.groupId);});
  const letter=String.fromCharCode(65+(order.indexOf(entry.groupId)%26)),

  return `${entry.groupType==='triset'?'Tri-set':'Superset'} · ${letter}${position+1}`;

function buildDraft(cid, dayIndex){

  const c = S.clients[cid] || {}, prog = S.programs[c.programId];
  const day = prog ? prog.days[dayIndex] : null;
  const week = c.currentWeek || 1;
  const entries = (day ? day.items : []).map(base => {
    const it = weekItem(base, week);   // this week's prescription
    const { last, best } = exerciseHistory(cid, it.exId);
    const pct = percentLoad(it.load), e1 = pct != null ? bestE1RMOf(cid, it.exId) : null;
    const wkLoad = base.weeks && base.weeks[week] && 'load' in base.weeks[week] && /^\d+(\.\d+)?$/.test(String(it.load)) ? Number(it.load) : null;
    const targetKg = pct != null ? (e1 ? roundLoad(e1 * pct / 100) : null) : wkLoad;   // shown as the grey hint in the weight box
    return {
      ...(targetKg ? { targetKg } : {}),
      exId: it.exId, name: exName(it.exId), groupId:it.groupId||null, groupType:it.groupType||null,
      target: [it.sets && it.reps ? it.sets + '×' + it.reps : '', it.load || '', it.rpe ? 'RPE ' + it.rpe : ''].filter(Boolean).join(' · '),
      targetSets:it.sets||'',targetReps:it.reps||'',targetLoad:it.load||'',targetRPE:it.rpe||'',targetRIR:it.rir||'',targetTempo:it.tempo||'',targetNotes:it.notes||'',targetRest:it.rest||'90s',
      lastDate: last ? last.date : null, best,
      sets: Array.from({length: Number(it.sets) || 3}, (_,i) => ({
        weight:null, reps:null, done:false,actualRPE:null,actualRIR:null,setType:'working',note:'',
        lastWeight: last && last.sets[i] ? last.sets[i].weight : null,
        lastReps: last && last.sets[i] ? last.sets[i].reps : null
      }))

  });
  // id is fixed when the workout starts and becomes the saved log's id, so a repeated save can't duplicate it.
  return { id: uid(), clientId: cid, date: todayISO(), dayLabel: day ? day.name : 'Open session',
           programId: c.programId || null, week, entries, notes:'', ...(day&&day.notes?{dayNotes:day.notes}:{}), ...(day&&day.conditioningId?{dayConditioningId:day.conditioningId}:{}), usePack: true, startedAt:Date.now(), restRemainingMs:90000, restDurationSeconds:90,restRunning:false, restEndAt:null,autoRestAfterSet:true,focusedExerciseIndex:0 };
}

    const sets=loggedExerciseSets(item),lastLoggedSet=Math.max(0,...sets.map((set,index)=>Number(set?.setNumber)||index+1)),count=Math.max(1,sets.length,lastLoggedSet,Number(item.targetSets??item.sets)||0);
    return {exId,name,groupId:item.groupId||null,groupType:item.groupType||null,target:item.target||'',targetSets:item.targetSets||item.sets||'',targetReps:item.targetReps||item.reps||'',targetLoad:item.targetLoad||item.load||'',targetRPE:item.targetRPE||item.rpe||'',targetRIR:item.targetRIR||item.rir||'',targetTempo:item.targetTempo||item.tempo||'',targetNotes:item.targetNotes||item.notes||'',targetRest:item.targetRest||item.rest||'90s',lastDate:last?.date||null,best,sets:Array.from({length:count},(_,i)=>({weight:null,reps:null,done:false,actualRPE:null,actualRIR:null,setType:'working',note:'',lastWeight:last?.sets?.[i]?.weight??null,lastReps:last?.sets?.[i]?.reps??null}))};

  if(workoutLogEntries(log).length)return true;
  const client=S.clients[cid],programId=log?.programId&&S.programs[log.programId]?log.programId:client?.programId,program=programId?S.programs[programId]:null;
  return !!program?.days?.some(day=>Array.isArray(day.items)&&day.items.length&&(!log?.dayLabel||String(day.name||'').trim().toLowerCase()===String(log.dayLabel).trim().toLowerCase()));
}

/* Starting a new session for a client moves THEIR unfinished one to the saved list. Other clients' open sessions stay open. */
function archiveParkedWorkoutBeforeStartingAnother(cid){
  const mine=S.sessions.filter(r=>r.logClient===cid);if(!mine.length)return;
  S.sessions=S.sessions.filter(r=>r.logClient!==cid);
  mine.forEach(r=>{S.recoveryArchive=[JSON.parse(JSON.stringify(r)),...(S.recoveryArchive||[])].slice(0,8);});
  Store.putMeta('workoutDraftArchive',S.recoveryArchive).catch(error=>{console.warn('Could not archive parked workout',error);showSaveError(error);});
}

/* The program day after the client's most recent strength session on their current program
   (wrapping to the first day); the first day when there's no history. */
function nextDayIndex(cid){
  const c=S.clients[cid],p=c&&S.programs[c.programId],days=p?.days||[];if(!days.length)return 0;
  const norm=v=>String(v||'').trim().toLocaleLowerCase(),names=days.map(d=>norm(d.name));
  for(const l of clientLogs(cid)){   // newest first
    if(l.type==='conditioning')continue;
    if(l.programId&&l.programId!==c.programId)continue;   // a session from a different program
    const i=names.indexOf(norm(l.dayLabel));if(i>=0)return (i+1)%days.length;
  }
  return 0;
}
function beginClientWorkout(cid,mode,templateId='',partnerId=''){
  const c=S.clients[cid];if(!c){toast('That client no longer exists');return;}
  if(consentState(c)==='withdrawn')toast('Consent was withdrawn for '+c.name+'. Consider archiving them instead of logging new data.');
  archiveParkedWorkoutBeforeStartingAnother(cid);
  if(mode==='conditioning'){
    if(!templateId||!S.conditioning[templateId]){toast('Choose a conditioning program first');return;}
    let partner='';
    if(partnerId){
      if(partnerId===cid||!S.clients[partnerId]||sessionFor(partnerId)){toast('That client already has a session open. Finish or save it first.');return;}
      partner=partnerId;
      if(consentState(S.clients[partner])==='withdrawn')toast('Consent was withdrawn for '+S.clients[partner].name+'. Consider archiving them instead of logging new data.');
    }
    S.sel={conditioningClient:cid,conditioningId:templateId,conditioningMode:'conditioning',conditioningSession:{id:uid(),date:todayISO(),startedAt:Date.now(),blocksCompleted:[],blocks:JSON.parse(JSON.stringify(S.conditioning[templateId].blocks||[])),flow:conditioningFlowOf(S.conditioning[templateId]),...(partner?{clientIds:[cid,partner],partnerResults:{}}:{})}};render();return;
  }
  const dayIndex=nextDayIndex(cid),draft=buildDraft(cid,dayIndex);
  S.sel={logClient:cid,dayIndex,draft};render();
  packLowWarning(cid);
}
function packLowWarning(cid){
  const c=S.clients[cid];if(!c||!c.packTotal)return;
  const left=sessionsLeft(c,cid);
  if(left===0)toast(c.name+'s pack is used up — renew it in their profile');
  else if(left===1)toast(c.name+' has 1 session left in the pack');
}
/* Pick a conditioning template, then start it for this client. */
function openConditioningChooser(cid){
  if(!Object.keys(S.conditioning).length){toast('Create a conditioning program first');return;}
  const partner=partnerOf(cid);
  const templates=Object.entries(S.conditioning).map(([id,w])=>`<button type="button" class="card program-kind-card" data-start-conditioning-template="${esc(id)}"><span class="program-kind-icon">◷</span><strong>${esc(w.name||'Conditioning template')}</strong><span class="small muted">${(w.blocks||[]).length} timed block${(w.blocks||[]).length===1?'':'s'}</span><span class="small muted">Start this conditioning program →</span></button>`).join('');
  const templateDialog=dialog('Choose conditioning program',`<p class="small muted">Select a program to start its conditioning session.</p>${partner?`<label class="row tight small" style="gap:.4rem;margin-bottom:.6rem"><input type="checkbox" id="condWithPartner" style="width:auto"> Also run it for ${esc(partner.name)} — one shared timer, a separate result for each</label>`:''}<div class="grid start-workout-choices">${templates}</div>`,[{label:'Cancel'}]);
  templateDialog.querySelectorAll('[data-start-conditioning-template]').forEach(button=>button.onclick=()=>{
    const templateId=button.dataset.startConditioningTemplate;
    if(!S.conditioning[templateId]){toast('This conditioning program is no longer available');return;}
    const withPartner=!!(partner&&document.getElementById('condWithPartner')?.checked);

}
/* Today card → quick actions for that client, so the usual "who's next → start" is two taps. */
function openTodayActions(cid){
  const c=S.clients[cid];if(!c)return;
  const p=S.programs[c.programId],di=nextDayIndex(cid),dayName=p?.days?.[di]?.name;
  const iso=todayISO(),status=attFor(iso,cid)?.status||'',parked=!!sessionFor(cid);
  const statusText=status==='attended'?'Marked attended today':status==='no-show'?'Marked no-show today':status==='cancelled'?'Marked cancelled today':'Not marked yet today';
  const dlg=dialog(c.name,`<p class="small muted">${esc(statusText)}${p?` · ${esc(p.name)}`:''}</p>
    <div class="today-actions">
      ${parked?`<button type="button" class="btn primary" data-today-action="resume">Resume workout in progress</button>`:''}
      <button type="button" class="btn ${parked?'ghost':'primary'}" data-today-action="start">${dayName?'Log session · '+esc(dayName):'Log session'}</button>
      <button type="button" class="btn ghost" data-today-action="conditioning">Conditioning…</button>
      <div class="today-actions-pair">
        <button type="button" class="btn ${status==='attended'?'primary':'ghost'}" data-today-action="attended" aria-pressed="${status==='attended'}">${status==='attended'?'✓ Attended':'Attended'}</button>
        <button type="button" class="btn ${status==='no-show'?'danger':'ghost'}" data-today-action="no-show" aria-pressed="${status==='no-show'}">No-show</button>
      </div>
      <button type="button" class="btn ghost" data-today-action="profile">Open profile</button>
    </div>`,[{label:'Close'}]);
  const act=async kind=>{
    if(kind==='resume'){dlg.close();resumeParkedWorkout(sessionKey(sessionFor(cid)));return;}
    if(kind==='start'){dlg.close();beginClientWorkout(cid,'strength');return;}
    if(kind==='conditioning'){openConditioningChooser(cid);return;}
    if(kind==='profile'){dlg.close();S.view='dashboard';S.sub='clients';S.sel={client:cid};render();return;}
    const next=status===kind?'':kind;   // tapping the current status clears it
    try{await setAttendance(iso,cid,next,c.groupId||'');}catch(e){showSaveError(e);return;}
    dlg.close();
    const fresh=S.clients[cid];
    toast(next==='attended'?(fresh.packTotal&&sessionsLeft(fresh)===0?fresh.name+' has now used the last session in the pack':fresh.name+' marked attended'):next==='no-show'?fresh.name+' marked no-show':'Attendance cleared');
    render();
  };
  dlg.querySelectorAll('[data-today-action]').forEach(b=>b.onclick=()=>act(b.dataset.todayAction));
}
function markStrengthActivity(){
  const d=S.sel&&S.sel.draft;
  // (Editing a saved session must not move its strength/conditioning order.)
  if(d&&!d.editing&&(d.conditioningTemplateId||d.conditioningInProgress||d.conditioningSession))d.strengthCompletedAt=Date.now();
  if(d)scheduleWorkoutAutosave();
}
/* Opens the timed conditioning part of a strength workout (the workout stays parked and is resumed after). */
function startSessionConditioning(templateId){
  const d=S.sel?.draft,cid=S.sel?.logClient;if(!d||!S.conditioning[templateId]){toast('That conditioning program is no longer available');return false;}
  d.conditioningTemplateId=templateId;d.strengthCompletedAt=Date.now();
  const progress=d.conditioningInProgress||{id:uid(),date:d.date||todayISO(),startedAt:d.startedAt||Date.now(),blocksCompleted:[],flow:conditioningFlowOf(S.conditioning[templateId])};
  S.parkedWorkout={sessionType:'strength',activePhase:'strength',logClient:cid,dayIndex:S.sel.dayIndex||0,draft:d,backTo:S.sel.backTo||''};   // the strength half waits while conditioning runs
  S.sel={conditioningClient:cid,conditioningId:templateId,conditioningMode:'both',conditioningSession:progress};render();
}
/* Delete / copy a set — used by the buttons in the set's Effort panel and by the swipe gestures. */
function deleteSetAt(ei,si){
  const entry=S.sel.draft?.entries?.[ei],removed=entry?.sets?.[si];if(!removed)return;
  if(entry.sets.length<2){toast('Keep at least one set for this exercise');return;}
  entry.sets.splice(si,1);markStrengthActivity();render();
  undoToast(`Set ${si+1} of ${entry.name} deleted`,()=>{
    if(!S.sel.draft||!S.sel.draft.entries.includes(entry))return;   // the exercise itself is gone
    entry.sets.splice(Math.min(si,entry.sets.length),0,removed);markStrengthActivity();render();
  });
}
function copyPreviousSet(ei,si){
  const entry=S.sel.draft?.entries?.[ei],set=entry?.sets?.[si];
  const previous=entry&&exerciseHistory(S.sel.draft.clientId,entry.exId).last?.sets?.[si];
  if(!previous||!set){toast('No previous set to copy');return;}
  set.weight=previous.weight??null;set.reps=previous.reps??null;set.done=false;
  if(set.weight!=null&&set.reps!=null)completeWorkoutSet(ei,si);else{markStrengthActivity();render();}
}
/* The kg × reps shown as grey hints in this set's boxes: the progression suggestion when
   there is one, otherwise the "Previous" numbers (same sources as exBlock). ✓ on an empty set uses these. */
function previousSetValues(ei,si){
  const draft=S.sel?.draft,entry=draft?.entries?.[ei],set=entry?.sets?.[si];if(!entry)return {weight:null,reps:null};
  const previous=exerciseHistory(draft.clientId,entry.exId).last,prev=previous?.sets?.[si];
  const num=v=>v==null||v===''||!Number.isFinite(Number(v))?null:Number(v);   // older logs may hold "60" as text
  const last=previous?{weight:num(prev?.weight),reps:num(prev?.reps)}:{weight:num(set?.lastWeight),reps:num(set?.lastReps)};
  const sug=entrySuggestion(entry)?.sets?.[si];
  return {weight:num(sug?.weight)??last.weight,reps:num(sug?.reps)??last.reps};
}
/* opts.advance: after a superset set, move the cursor to the same set of the next exercise
   (used for Enter and the ✓ tap; not when the set completes because a box lost focus). */
function completeWorkoutSet(ei,si,opts={}){
  const draft=S.sel?.draft,set=draft?.entries?.[ei]?.sets?.[si];if(!draft||!set||set.done)return false;
  set.done=true;
  const nextMember=nextGroupMemberAt(ei,si);
  if(nextMember==null){   // not mid-superset: start the rest
    if(!draft.restDurationManuallySet)draft.restDurationSeconds=prescribedRestSeconds(draft.entries[ei].targetRest);
    const seconds=Number(draft.restDurationSeconds)||90;draft.restRemainingMs=seconds*1000;draft.restEndAt=Date.now()+draft.restRemainingMs;draft.restRunning=true;
  }
  const row=document.querySelector(`.exblock[data-ei="${ei}"] .setrow[data-si="${si}"]`),tick=row?.querySelector('[data-done]');
  if(row)row.classList.add('done');if(tick){tick.textContent='✓';tick.setAttribute('aria-label',`Reopen set ${si+1}`);tick.setAttribute('aria-pressed','true');}
  updateWorkoutTimerUI();markStrengthActivity();
  if(nextMember!=null&&opts.advance){
    const box=document.querySelector(`.exblock[data-ei="${nextMember}"] .setrow[data-si="${si}"] [data-set-input="weight"]`);
    if(box){box.scrollIntoView({block:'center'});try{box.focus({preventScroll:true});box.select();}catch{}}
  }
  return true;
}

/* ============================ CALENDAR ============================ */
function viewCalendar(){
  const cur = S.sel.month || todayISO().slice(0,7);
  const [Y,M] = cur.split('-').map(Number);
  const first = new Date(Y, M-1, 1);
  const startPad = first.getDay();
  const daysIn = new Date(Y, M, 0).getDate();
  const day = S.sel.day || (cur === todayISO().slice(0,7) ? todayISO() : cur + '-01');

  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push('<div class="cal-cell pad"></div>');
  for (let d = 1; d <= daysIn; d++){
    const iso = `${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const slots = scheduledOn(iso);
    const solos = individualsOn(iso).filter(c => !(c.groupId && slots.some(s => s.id === c.groupId)));
    const oneOffs = oneOffsOn(iso);
    const att = attendedOn(iso);
    const missed = attendanceOn(iso).filter(a => a.status === 'no-show').length;
    const niceDay = new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
    const nPlanned = slots.length + solos.length + oneOffs.length;
    const dayLabel = niceDay + (nPlanned ? ', ' + nPlanned + ' scheduled' : '') + (att ? ', ' + att + ' attended' : '') + (missed ? ', ' + missed + ' no-show' : '');
    cells.push(`<button class="cal-cell${iso===day?' on':''}${iso===todayISO()?' today':''}" data-day="${esc(iso)}" aria-label="${esc(dayLabel)}" aria-pressed="${iso===day}">
      <span class="d num">${d}</span>
      ${slots.length || solos.length || oneOffs.length ? `<span class="slots">${[
        ...slots.map(s => `<i title="${esc(s.name)}"></i>`),
        ...solos.map(c => `<i class="solo" title="${esc(c.name)}"></i>`),
        ...oneOffs.map(s => `<i class="oneoff" title="${esc(s.label || 'One-off')}"></i>`)].slice(0,6).join('')}</span>` : ''}
      ${att ? `<span class="att num">${att}</span>` : ''}
      ${missed ? `<span class="miss num">${missed}</span>` : ''}
    </button>`);
  }

  const monthAtt = Object.values(S.attendance).filter(a => a.date.startsWith(cur) && a.status === 'attended').length;

  return `
  <div class="panel spread">
    <div class="row tight">
      <button class="btn ghost sm" data-mon="-1" aria-label="Previous month">‹</button>
      <h2 style="min-width:9rem;text-align:center">${MONTHS[M-1]} ${Y}</h2>
      <button class="btn ghost sm" data-mon="1" aria-label="Next month">›</button>
    </div>
    <div class="row tight small muted">
      <span class="num"><strong>${monthAtt}</strong> sessions delivered this month</span>
      <button class="btn ghost sm" data-mon="0">Today</button>
    </div>
  </div>

  <div class="panel">
    <div class="cal-head">${DOW.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="row tight small muted" style="margin-top:.6rem">
      <span class="key"><i class="k-slot"></i> scheduled pairing</span>
      <span class="key"><i class="k-slot" style="background:var(--plate-green)"></i> solo client</span>
      <span class="key"><i class="k-slot" style="background:var(--ink-2)"></i> one-off / moved</span>
      <span class="key"><i class="k-att"></i> attended</span>
      <span class="key"><i class="k-miss"></i> no-show</span>
    </div>
  </div>

  ${dayPanel(day)}`;
}

function dayPanel(iso){
  const slots = scheduledOn(iso);
  const nice = new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  const marked = new Set(attendanceOn(iso).map(a => a.clientId));
  const pairingIds = new Set(slots.flatMap(s => groupMembers(s.id).map(c => c.id)));
  const individuals = individualsOn(iso).filter(c => !pairingIds.has(c.id));
  const oneOffs = oneOffsOn(iso);
  const skipped = skippedOn(iso);
  const scheduledIds = new Set([...pairingIds, ...individuals.map(c => c.id), ...oneOffs.flatMap(s => s.clientIds||[])]);
  const extras = Object.entries(S.clients).map(([id,c]) => ({id,...c}))
    .filter(c => c.status !== 'archived' && marked.has(c.id) && !scheduledIds.has(c.id)).sort(byName);
  const unlisted = Object.entries(S.clients).map(([id,c]) => ({id,...c}))
    .filter(c => c.status !== 'archived' && !marked.has(c.id) && !scheduledIds.has(c.id) && clientMatches(c, S.search.adhoc)).sort(byName);

  const roster = (c, gid) => {
    const a = attFor(iso, c.id), st = a ? a.status : '';

    return `<div class="att-row">

        <button class="btn sm ${st==='no-show'?'danger':'ghost'}" data-att="${esc(c.id)}|no-show|${esc(gid)}|${esc(iso)}">No-show</button>
        <button class="btn sm ${st==='cancelled'?'danger':'ghost'}" data-att="${esc(c.id)}|cancelled|${esc(gid)}|${esc(iso)}">Cancelled</button>

      </div>
    </div>`;
  };

  return `<div class="panel">
    <div class="spread"><h3>${esc(nice)}</h3>
      <span class="muted small num">${attendedOn(iso)} attended</span></div>

    ${slots.length ? slots.map(s => {

      </div>`;

    ${individuals.length ? `<div class="slot"><div class="slot-head"><strong class="cond" style="font-size:1.15rem">Individual sessions</strong>

      ${individuals.map(c => roster(c, '') + `<div class="sched-actions"><span class="small muted">${esc(fmtTime(c.recurTime))}</span><button class="btn sm ghost" data-skip="client|${esc(c.id)}|${esc(iso)}">Skip this date</button><button class="btn sm ghost" data-move="client|${esc(c.id)}|${esc(iso)}">Move to…</button></div>`).join('')}</div>` : ''}

/* ============================ CONDITIONING ============================ */
const CONDITIONING_MODES=[['intervals','Intervals'],['emom','EMOM'],['amrap','AMRAP'],['forTime','For Time'],['tabata','Tabata'],['custom','Custom']];
function conditioningModeName(mode){return (CONDITIONING_MODES.find(x=>x[0]===mode)||['','Custom'])[1];}
function newConditioningBlock(mode='intervals'){
  const b={name:'Main Block',mode,rounds:mode==='tabata'?8:10,workSeconds:mode==='tabata'?20:30,restSeconds:mode==='tabata'?10:30,durationMinutes:mode==='emom'?10:12,exercises:[]};
  // Timed-interval blocks start with one station, ready to add more.
  if(['intervals','tabata','custom'].includes(mode)){b.steps=[{name:'Work',workSeconds:b.workSeconds,restSeconds:b.restSeconds}];b.restBetweenRounds=0;}
  return b;
}
/* Station list for intervals / tabata / custom blocks. Older blocks (no stations) keep their timing until switched. */
function conditioningStepsHTML(b,i){
  if(!['intervals','tabata','custom'].includes(b.mode))return '';
  if(!isSteppedBlock(b))return `<div class="conditioning-convert"><button type="button" class="btn ghost sm" data-convert-steps="${i}">Switch to stations</button><small class="muted">Give each exercise its own work and rest time. Each exercise becomes a station, and the rounds repeat the whole list.</small></div>`;
  return `<div class="conditioning-steps"><div class="spread"><strong>Stations <span class="muted small">— each round runs them in order</span></strong><button type="button" class="btn ghost sm" data-add-step="${i}">+ Add station</button></div>
    ${b.steps.map((s,si)=>`<div class="cond-step" data-step-row="${si}">
      <span class="cond-step-num" aria-hidden="true">${si+1}</span>

function readConditioningEditor(){

/* Sound + vibration at each phase change, EMOM interval and block end. */
let lastLeadCue='';
function conditioningCueFor(event,state){
  if(event==='work'||event==='minute')cue('work');
  else if(event==='rest')cue('rest');
  else if(event==='complete')cue('done');
  else if(event==='tick'&&state&&state.phase==='getReady'&&state.remaining>0&&state.remaining<=3){   // 3-2-1 before the block starts
    const key=state.startedAt+':'+state.remaining;if(key!==lastLeadCue){lastLeadCue=key;cue('tick');}
  }
}
/* Timer settings for one block of a live session (or the editor preview): the block itself plus the
   template's "get ready" countdown and, for an automatic next block, the rest before it. */
function sessionBlockConfig(flow,b,{auto=false}={}){
  const cfg=conditioningTimerConfig(b),f=flow||{},transition=auto?(Number(f.transitionSeconds)||0):0,lead=transition+(Number(f.getReadySeconds)||0);
  if(lead>0){cfg.getReadySeconds=lead;cfg.getReadyLabel=transition>0?'Rest — next block soon':'Get ready';}

}

// Live session. Its state is copied into the session on every event, so it survives leaving the screen or a reload.

  if(S.sel?.conditioningSession&&S.sel.conditioningSession===ss)updateConditioningTimerUI(event,state);   // don't draw over another screen

    if(!ss.blocksCompleted.includes(ss.currentBlockIndex))ss.blocksCompleted.push(ss.currentBlockIndex);

    const next=ss.currentBlockIndex+1,flow=ss.flow||{},advance=!!flow.autoAdvance&&!ss.completed&&next<(ss.blocks||[]).length;

  }
});

/* ---- conditioning results: what the client actually achieved in each timed block ---- */
function parseClockInput(text){
  const t=String(text??'').trim();if(!t)return null;
  const m=t.match(/^(\d+):(\d{1,2})$/);if(m)return Number(m[1])*60+Number(m[2]);

}
/* "7 rounds + 5 reps · RPE 8 · note" — one readable line for a block's result. */
function conditioningResultText(r,mode){
  if(!r)return '';
  const parts=[],m=mode||r.mode;
  if(m==='amrap'){if(r.roundsCompleted!=null||r.extraReps)parts.push(`${r.roundsCompleted??0} round${(r.roundsCompleted??0)===1?'':'s'}${r.extraReps?` + ${r.extraReps} rep${r.extraReps===1?'':'s'}`:''}`);}
  else if(m==='forTime'){
    if(r.timeSeconds!=null)parts.push(formatClock(r.timeSeconds)+(r.capped?' (time cap)':''));
    if(r.roundsCompleted)parts.push(`${r.roundsCompleted} round${r.roundsCompleted===1?'':'s'}`);
  }else if(r.roundsCompleted)parts.push(`${r.roundsCompleted} ${m==='emom'?'interval':'round'}${r.roundsCompleted===1?'':'s'}`);
  if(r.calories!=null)parts.push(`${r.calories} cal`);
  if(r.distance!=null)parts.push(`${r.distance} m`);
  if(r.rpe!=null)parts.push(`RPE ${r.rpe}`);
  if(r.note)parts.push(r.note);
  return parts.join(' · ');
}

        const c=ids[k],lid=k===0?(ss.id||(ss.id=uid())):(ss.logIds[c]||(ss.logIds[c]=uid()));
        const snap=k===0?{...snapshotConditioningSession(template,S.sel.conditioningId,ss),completedAt:base.completedAt}:{...snapshotConditioningSession(template,S.sel.conditioningId,{...ss,results:(ss.partnerResults||{})[c]||{}}),completedAt:base.completedAt};
        logs.push([lid,{clientId:c,date:ss.date||todayISO(),completedAt:base.completedAt,dayLabel:template.name+' · Conditioning',type:'conditioning',conditioningId:S.sel.conditioningId,conditioningSession:snap,entries:[],notes:'',...(group?{sharedSessionId:ss.id}:{})}]);

   const addNormal=document.getElementById('addNormalProgram');if(addNormal)addNormal.onclick=()=>{
