/* ---------------------------------------------------------------
   Phone back button / back gesture.
   The app draws every screen in one page, so without this the browser had no history and "back" closed the app.
   Each screen the coach moves to becomes a browser history entry (pushState); back (popstate) brings the previous
   screen back, with its scroll position. Home is the bottom entry, so back from Home leaves the app (as phone apps do).
   - Back with a dialog or a menu open closes just that, and the screen underneath is left exactly as it was.
   - Back under the lock screen does nothing (it can't be used to get past the PIN).
   - Back from a workout parks it (nothing is lost; the "Workout in progress" bar resumes it).
   - An in-app Back button that leads to the previous screen steps back through history too, so both stay in step.
----------------------------------------------------------------*/
const NAV_SEL_KEYS = ['client', 'clientPanel', 'program', 'programsKind', 'conditioningId', 'historyClient', 'historyDay', 'logClient', 'conditioningClient'];
const NAV_HOME = { view:'dashboard', sub:'today', ds:'', sel:{} };
const Nav = { started:false, idx:0, keys:[], restoring:false, expectBackTo:null, ignorePop:false };

function navRouteNow(){
  const view = S.view || 'dashboard', sub = view === 'dashboard' ? (S.sub || 'today') : '';
  const sel = {};
  NAV_SEL_KEYS.forEach(k => { const v = S.sel && S.sel[k]; if (v !== undefined && v !== null && v !== '') sel[k] = v; });
  return { view, sub, ds: sub === 'data' ? (S.dataSection || '') : '', sel };
}
const navKey = r => JSON.stringify([r.view, r.sub, r.ds, NAV_SEL_KEYS.map(k => r.sel[k] ?? '')]);
const navState = (route, idx, scrollY) => ({ nyaega:'route', route, key:navKey(route), idx, scrollY:scrollY || 0 });

/* Called at the end of every render(). `prevScrollY` is where the screen being left was scrolled to. */
function navHistorySync(prevScrollY){
  if (S.bootState !== 'ready') return;
  const route = navRouteNow(), key = navKey(route);
  try {
    if (!Nav.started){
      Nav.started = true;
      const prev = history.state, idx = prev && prev.nyaega === 'route' ? prev.idx : 0;   // after a reload, keep the place in history
      if (idx === 0 && key !== navKey(NAV_HOME)){   // Home is always underneath
        history.replaceState(navState(NAV_HOME, 0, 0), ''); history.pushState(navState(route, 1, 0), '');
        Nav.idx = 1; Nav.keys = [navKey(NAV_HOME), key]; return;
      }
      history.replaceState(navState(route, idx, 0), ''); Nav.idx = idx; Nav.keys = []; Nav.keys[idx] = key; return;
    }
    if (Nav.restoring || key === Nav.keys[Nav.idx] || key === Nav.expectBackTo) return;   // same screen redrawn, or a back step under way
    if (Nav.idx >= 1 && key === Nav.keys[Nav.idx - 1]){ Nav.expectBackTo = key; history.back(); return; }   // in-app Back
    const cur = history.state;
    if (cur && cur.nyaega === 'route') history.replaceState({ ...cur, scrollY:prevScrollY || 0 }, '');   // remember where we were
    history.pushState(navState(route, Nav.idx + 1, 0), '');
    Nav.keys = Nav.keys.slice(0, Nav.idx + 1).concat(key); Nav.idx++;
  } catch (e) { console.warn('Back-button history unavailable', e); }
}

/* Show a remembered screen. A workout screen comes back only if that workout is still open (parked). */
function navApplyRoute(route, scrollY){
  let r = route || NAV_HOME;
  Nav.restoring = true;
  try {
    // Back from the conditioning part of a strength workout: the strength workout comes back (as "Return to strength" does).
    if (r.view === 'session' && S.sel?.conditioningMode === 'both' && S.parkedWorkout && r.sel.logClient && r.sel.logClient === S.parkedWorkout.logClient){
      const p = S.parkedWorkout; p.draft.conditioningInProgress = S.sel.conditioningSession;
      if (ConditioningTimer.state()?.running) ConditioningTimer.pause();
      S.sel = { logClient:p.logClient, dayIndex:p.dayIndex, draft:p.draft, backTo:p.backTo }; S.parkedWorkout = null; render(); return;
    }
    if (r.view === 'session'){
      const cid = r.sel.logClient || r.sel.conditioningClient, parked = cid && sessionFor(cid);
      if (parked){ flushProgramEditor(); resumeParkedWorkout(sessionKey(parked)); return; }
      r = NAV_HOME;
    }
    flushProgramEditor(); if (sessionOpen()) parkWorkout();
    S.view = r.view; if (r.view === 'dashboard') S.sub = r.sub;
    if (r.view === 'dashboard' && r.sub === 'data') S.dataSection = r.ds || undefined;
    S.sel = { ...r.sel }; if (S.sel.conditioningId) S.sel.conditioningDraft = null;
    if (r.view === 'programs' && !S.sel.programsKind && !S.sel.program) S.sel.programSection = 'programs';
    render();
  } finally { Nav.restoring = false; }
  Nav.keys[Nav.idx] = navKey(navRouteNow());
  window.scrollTo(0, scrollY || 0);
}

window.addEventListener('popstate', e => {
  if (!Nav.started || S.bootState !== 'ready') return;
  const st = e.state && e.state.nyaega === 'route' ? e.state : null;
  if (Nav.ignorePop){ Nav.ignorePop = false; if (st) Nav.idx = st.idx; return; }   // our own step forward, below
  // An in-app Back button already drew this screen: record where history is and restore the scroll.
  if (Nav.expectBackTo && st && st.key === Nav.expectBackTo){ Nav.expectBackTo = null; Nav.idx = st.idx; window.scrollTo(0, st.scrollY || 0); return; }
  Nav.expectBackTo = null;
  // Something is on top of the screen: close it (if it may be closed), then step forward again so the screen stays.
  const keepScreen = () => { if (st && st.idx < Nav.idx){ Nav.ignorePop = true; history.go(1); } };
  const lock = document.getElementById('lockScreen');
  if (lock && !lock.hidden){ keepScreen(); return; }
  const dlg = document.getElementById('dlg');
  if (dlg && dlg.open){ if (!dlg.oncancel) dlg.close(); keepScreen(); return; }   // a dialog that must be answered stays open
  if (typeof navMenuIsOpen === 'function' && navMenuIsOpen()){ closeNavMenu(); keepScreen(); return; }
  Nav.idx = st ? st.idx : 0;
  navApplyRoute(st ? st.route : NAV_HOME, st ? st.scrollY : 0);
});

/* Phones go back with their own gesture, so the in-app Back buttons are hidden there (styles: .has-system-back):
   Android has its back button / gesture, Safari on iPhone has its edge swipe, and the iPhone home-screen app, which has
   neither, gets the edge swipe below. Computers keep the buttons. */
const EDGE_BACK_PX = 24;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_STANDALONE = navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
if (IS_ANDROID || IS_IOS) document.documentElement.classList.add('has-system-back');
if (IS_IOS && IS_STANDALONE) installEdgeSwipeBack();
if (IS_IOS) lockIOSZoom();

/* iPhone / iPad Safari ignores user-scalable=no in the viewport (Android honours it), so pinch-zoom is stopped here:
   Safari's own gesture events, and any move with two fingers on the screen. Double-tap zoom is off through
   touch-action in the styles. One-finger scrolling, swipes and the edge-back are not affected. */
function lockIOSZoom(){
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive:false }));
  document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
}

/* Swipe in from the left edge to go back, with an arrow that follows the thumb (lime once far enough to count). */
function installEdgeSwipeBack(){
  document.documentElement.classList.add('edge-back');
  const GO = 72;
  const arrow = document.createElement('div'); arrow.id = 'edgeBack'; arrow.setAttribute('aria-hidden', 'true');
  arrow.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  document.body.appendChild(arrow);
  let g = null;
  const reset = () => { g = null; arrow.classList.remove('show', 'ready'); arrow.style.transform = ''; };
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0], lock = document.getElementById('lockScreen');
    if (t.clientX > EDGE_BACK_PX || Nav.idx < 1 || (lock && !lock.hidden)) return;   // (nothing to go back to on Home; never past the lock)
    g = { x:t.clientX, y:t.clientY, active:false, ready:false };
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (!g.active){
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ reset(); return; }   // a scroll, not a swipe
      if (dx < 10) return;
      g.active = true; arrow.classList.add('show');
    }
    g.ready = dx >= GO;
    arrow.classList.toggle('ready', g.ready);
    arrow.style.transform = `translate(${Math.round(Math.min(dx, GO * 1.3) * 0.7 - 30)}px, ${Math.round(t.clientY - 22)}px)`;
  }, { passive:true });
  document.addEventListener('touchend', () => { const go = g && g.active && g.ready; reset(); if (go) history.back(); }, { passive:true });
  document.addEventListener('touchcancel', reset, { passive:true });
}
/* ---------------------------------------------------------------
   Barbell & plate calculator.
   Data:  BAR_PROFILES (bar weights in kg and lb), PLATE_SETS (standard plates per unit).
   Logic: calcPlates(target, bar, plates) — pure, no screen; the greedy breakdown per side and the error states.
   UI:    openPlateCalculator({ weight, barId, onBar }) — a pop-up with bar, unit, target and plates; redraws as you type.
   Workouts: bar exercises get a "Plates" button (platesWeightFor picks the starting weight), and when a session is saved
   each bar exercise records its bar ({ id, name, kg }), so History shows bar weight + plate weight for every set.
   Per-device settings (unit, bar, gym's own bar weights, plates you don't have) are remembered in localStorage.
----------------------------------------------------------------*/

/** @typedef {'kg'|'lb'} Unit */
/** @typedef {{ id:string, name:string, group:string, weight:{ kg:number, lb:number } | null, match?:RegExp }} BarProfile
    (null weight = custom; `match` finds the bar from an exercise name in a workout) */
/** @typedef {number | { weight:number, count?:number }} PlateSpec   (count = how many per side; unlimited if left out) */
/** @typedef {{ weight:number, count:number }} PlateLoad */
/** @typedef {{ id:string, name:string, kg:number }} LoggedBar   (saved with a logged exercise) */
/**
 * @typedef {Object} PlateResult
 * @property {boolean} ok
 * @property {'below-bar'|'not-exact'|'invalid'} [error]
 * @property {number} perSide       weight to load on each side: (target − bar) / 2
 * @property {PlateLoad[]} plates   per side, heaviest first
 * @property {number} remainder     per side, what the plates couldn't make up (0 when ok)
 * @property {number} loaded        the total the bar actually holds with these plates
 * @property {number} [nearestBelow] closest loadable totals around an inexact target
 * @property {number} [nearestAbove]
 */

/* Standard weights; real bars vary by brand, so each can be set to the gym's own (remembered per device). */
/** @type {BarProfile[]} */
const BAR_PROFILES = [
  { id:'olympic',   group:'Olympic',        name:"Olympic bar (men's)",        weight:{ kg:20, lb:45 } },
  { id:'womens',    group:'Olympic',        name:"Women's Olympic bar",        weight:{ kg:15, lb:33 }, match:/\bwomen'?s\b/i },
  { id:'power',     group:'Olympic',        name:'Powerlifting / deadlift bar', weight:{ kg:20, lb:45 } },
  { id:'junior',    group:'Olympic',        name:'Junior bar',                 weight:{ kg:10, lb:22 }, match:/\bjunior\b|\byouth\b/i },
  { id:'technique', group:'Olympic',        name:'Technique bar',              weight:{ kg:5,  lb:15 }, match:/\btechnique\b/i },
  { id:'trap',      group:'Specialty',      name:'Trap / hex bar',             weight:{ kg:25, lb:55 }, match:/\btrap ?bar\b|\bhex ?bar\b/i },
  { id:'ssb',       group:'Specialty',      name:'Safety squat bar',           weight:{ kg:30, lb:65 }, match:/\bsafety ?(squat )?bar\b|\bssb\b/i },
  { id:'swiss',     group:'Specialty',      name:'Swiss / multi-grip bar',     weight:{ kg:15, lb:35 }, match:/\bswiss\b|\bfootball bar\b|\bmulti-?grip\b/i },
  { id:'cambered',  group:'Specialty',      name:'Cambered squat bar',         weight:{ kg:32, lb:70 }, match:/\bcambered\b/i },
  { id:'axle',      group:'Specialty',      name:'Axle / fat bar',             weight:{ kg:15, lb:35 }, match:/\baxle\b|\bfat ?bar\b/i },
  { id:'log',       group:'Specialty',      name:'Log',                        weight:{ kg:30, lb:65 }, match:/\blog\b/i },
  { id:'ez',        group:'Curl and small', name:'EZ-curl bar',                weight:{ kg:10, lb:25 }, match:/\bez\b|\bez-?curl\b/i },
  { id:'standard',  group:'Curl and small', name:'Standard 1" bar',            weight:{ kg:7,  lb:15 } },
  { id:'smith',     group:'Machine',        name:'Smith machine bar',          weight:{ kg:10, lb:25 }, match:/\bsmith\b/i },
  { id:'custom',    group:'Custom',         name:'Custom bar',                 weight:null }
];
/** The bar an exercise is done with, from its name or equipment (e.g. "Trap bar deadlift" → trap); null if no bar. */
function barIdForExercise(ex){
  if (!ex) return null;
  const text = (ex.name || '') + ' ' + (ex.equipment || ''), hit = BAR_PROFILES.find(b => b.match && b.match.test(text));
  return hit ? hit.id : (exNorm(ex.equipment) === 'barbell' ? 'olympic' : null);
}
/** @type {Record<Unit, number[]>} */
const PLATE_SETS = { kg:[25, 20, 15, 10, 5, 2.5, 1.25], lb:[45, 35, 25, 10, 5, 2.5] };
/* Competition colours (kg), and the usual bumper colours for lb. Anything else is steel grey. */
const PLATE_COLORS = { kg:{ 25:'#d8463b', 20:'#3d7bd9', 15:'#f2c94c', 10:'#4caf6e', 5:'#f4f4f4', 2.5:'#d8463b', 1.25:'#c9cdd2' },
                       lb:{ 45:'#3d7bd9', 35:'#f2c94c', 25:'#4caf6e', 10:'#f4f4f4', 5:'#d8463b', 2.5:'#c9cdd2' } };
const LB_PER_KG = 2.20462;

/**
 * Plates per side for a target total, heaviest first (greedy). Works in hundredths so 1.25 kg and 2.5 lb stay exact.
 * @param {number} targetWeight  total weight wanted on the bar
 * @param {number} barWeight     the empty bar
 * @param {PlateSpec[]} availablePlates
 * @returns {PlateResult}
 */
function calcPlates(targetWeight, barWeight, availablePlates){
  const h = v => Math.round(Number(v) * 100), t = h(targetWeight), b = h(barWeight);
  const plates = (availablePlates || [])
    .map(p => typeof p === 'number' ? { weight:p, count:Infinity } : { weight:Number(p.weight), count:p.count == null ? Infinity : Number(p.count) })
    .filter(p => p.weight > 0 && p.count > 0).sort((a, c) => c.weight - a.weight);
  if (!Number.isFinite(t) || !Number.isFinite(b) || t <= 0 || b < 0) return { ok:false, error:'invalid', perSide:0, plates:[], remainder:0, loaded:0 };
  if (t < b) return { ok:false, error:'below-bar', perSide:0, plates:[], remainder:0, loaded:b / 100 };
  const greedy = per => {
    let left = per; const out = [];
    for (const p of plates){ const w = h(p.weight), n = Math.min(p.count, Math.floor(left / w + 1e-9)); if (n > 0){ out.push({ weight:p.weight, count:n }); left -= n * w; } }
    return { out, left };
  };
  const per = (t - b) / 2, { out, left } = greedy(per);
  const result = { ok:left < 1e-6, perSide:per / 100, plates:out, remainder:Math.round(left) / 100, loaded:(b + 2 * (per - left)) / 100 };
  if (result.ok) return result;
  // Not exact: offer the nearest totals that are (below: what the greedy plates make; above: the next exact one).
  const step = plates.length ? h(plates[plates.length - 1].weight) : 0;
  let above;
  for (let k = 1; step && k <= 400 && above == null; k++){ const p2 = Math.ceil(per / step) * step + (k - 1) * step; if (greedy(p2).left < 1e-6) above = (b + 2 * p2) / 100; }
  return { ...result, error:'not-exact', nearestBelow:result.loaded, nearestAbove:above };
}

/* ---- settings (per device) ---- */
const PC_KEY = 'nyaega:plateCalc';
function pcLoad(){
  let s = {}; try { s = JSON.parse(localStorage.getItem(PC_KEY) || '{}') || {}; } catch {}
  return { unit:s.unit === 'lb' ? 'lb' : 'kg', bar:BAR_PROFILES.some(b => b.id === s.bar) ? s.bar : 'olympic',
    custom:{ kg:Number(s.custom?.kg) || 20, lb:Number(s.custom?.lb) || 45 }, off:{ kg:s.off?.kg || [], lb:s.off?.lb || [] },
    own:(s.own && typeof s.own === 'object') ? s.own : {} };   // own: the gym's weight for a bar, { barId:{ kg, lb } }
}
function pcSave(st){ try { localStorage.setItem(PC_KEY, JSON.stringify({ unit:st.unit, bar:st.bar, custom:st.custom, off:st.off, own:st.own })); } catch {} }
const pcStandard = st => { const p = BAR_PROFILES.find(b => b.id === st.bar); return p && p.weight ? p.weight[st.unit] : null; };
const pcBarWeight = st => { if (st.bar === 'custom') return st.custom[st.unit]; const own = st.own[st.bar] && Number(st.own[st.bar][st.unit]); return own >= 0 && st.own[st.bar][st.unit] != null ? own : pcStandard(st); };
const pcPlates = st => PLATE_SETS[st.unit].filter(w => !st.off[st.unit].includes(w));
const pcFmt = v => (Math.round(v * 100) / 100).toLocaleString(undefined, { maximumFractionDigits:2 });

/* The bar drawing and the plate list for one result. */
function plateBarHTML(res, unit){
  const all = PLATE_SETS[unit], max = Math.max(...all);
  const one = (w, k) => { const hgt = Math.round(42 + 58 * (w / max)), wid = w >= max * 0.4 ? 15 : 10; return `<span class="pc-plate" style="height:${hgt}px;width:${wid}px;background:${(PLATE_COLORS[unit] || {})[w] || '#9aa0a6'}" data-k="${k}">${pcFmt(w)}</span>`; };
  const stack = res.plates.flatMap(p => Array.from({ length:p.count }, () => p.weight)).map(one).join('');
  const said = res.plates.length ? res.plates.map(p => `${p.count} × ${pcFmt(p.weight)} ${unit}`).join(', ') : 'nothing, just the bar';
  return `<div class="pc-bar" role="img" aria-label="Each side: ${esc(said)}"><span class="pc-stub"></span><span class="pc-sleeve l">${stack}</span><span class="pc-collar"></span><span class="pc-shaft"></span><span class="pc-collar"></span><span class="pc-sleeve">${stack}</span><span class="pc-stub"></span></div>
    ${res.plates.length ? `<ul class="pc-list" aria-label="Plates on each side">${res.plates.map(p => `<li>${p.count} × ${pcFmt(p.weight)} ${unit}</li>`).join('')}</ul>` : ''}`;
}
function plateResultHTML(st, target){
  const bar = pcBarWeight(st), u = st.unit, res = calcPlates(target, bar, pcPlates(st));
  if (res.error === 'invalid') return `<p class="pc-msg">Type the total weight you want on the bar.</p>`;
  if (res.error === 'below-bar') return `<p class="pc-msg err">That's less than the bar itself (${pcFmt(bar)} ${u}).</p>`;
  const head = `<div class="pc-head"><strong>${res.plates.length ? pcFmt(res.ok ? res.perSide : (res.loaded - bar) / 2) + ' ' + u + ' each side' : 'Just the bar'}</strong><span>Bar ${pcFmt(bar)} ${u}</span></div>`;
  if (res.ok) return head + plateBarHTML(res, u);
  const opts = [res.nearestBelow, res.nearestAbove].filter((v, i, a) => v != null && v >= bar && a.indexOf(v) === i);
  return head + plateBarHTML(res, u) + `<p class="pc-msg err">${pcFmt(target)} ${u} can't be loaded exactly with these plates: ${pcFmt(res.remainder)} ${u} short on each side, so this loads ${pcFmt(res.loaded)} ${u}.</p>`
    + (opts.length ? `<p class="pc-msg">Nearest: ${opts.map(v => `<button type="button" class="btn sm ghost" data-pc-use="${v}">${pcFmt(v)} ${u}</button>`).join('')}</p>` : '');
}

/** Opens the calculator. opts.weight is a total in kg (as the app logs it), shown in the unit last used.
    opts.onBar(barId) is told which bar is chosen (a workout records it with the exercise). */
function openPlateCalculator(opts = {}){
  const st = pcLoad(); if (opts.barId && BAR_PROFILES.some(b => b.id === opts.barId)) st.bar = opts.barId;
  let target = opts.weight != null && Number(opts.weight) > 0 ? Number(opts.weight) * (st.unit === 'lb' ? LB_PER_KG : 1) : pcBarWeight(st) + 2 * PLATE_SETS[st.unit][1];
  if (st.unit === 'lb' && opts.weight != null) target = Math.round(target / 5) * 5;
  const stepOf = () => 2 * Math.min(...(pcPlates(st).length ? pcPlates(st) : PLATE_SETS[st.unit]));
  const body = `<div class="pc">
      <div class="pc-row"><label class="field" style="margin:0"><span>Bar</span><select id="pcBar">${[...new Set(BAR_PROFILES.map(b => b.group))].map(g => `<optgroup label="${esc(g)}">${BAR_PROFILES.filter(b => b.group === g).map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
        <div class="pc-unit" role="radiogroup" aria-label="Unit">${['kg', 'lb'].map(u => `<button type="button" role="radio" data-pc-unit="${u}">${u === 'lb' ? 'lbs' : 'kg'}</button>`).join('')}</div></div>
      <div id="pcCustomWrap"><label class="field" style="margin:0"><span id="pcCustomLabel">Bar weight</span><input type="number" id="pcCustom" inputmode="decimal" min="0" step="0.5"></label>
        <p class="pc-msg" id="pcBarNote" style="margin-top:.3rem;color:var(--text-muted)"></p></div>
      <div><label for="pcTarget" class="field" style="margin:0 0 .35rem"><span id="pcTargetLabel">Total on the bar</span></label>
        <div class="pc-target"><button type="button" id="pcMinus" aria-label="Less weight">−</button><input type="number" id="pcTarget" inputmode="decimal" min="0" step="0.5"><button type="button" id="pcPlus" aria-label="More weight">+</button></div></div>
      <div class="pc-result" id="pcResult" aria-live="polite"></div>
      <fieldset class="pc-plates" id="pcPlates"><legend>Plates you have (tap to leave one out)</legend></fieldset>
    </div>`;
  const dlg = dialog('Plate calculator', body, [{ label:'Close' }]);
  const $ = id => dlg.querySelector('#' + id);
  const tellBar = () => { if (typeof opts.onBar === 'function') opts.onBar(st.bar); };
  const draw = () => {
    const u = st.unit, custom = st.bar === 'custom';
    $('pcBar').value = st.bar;
    dlg.querySelectorAll('[data-pc-unit]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.pcUnit === u)));
    // Every bar's weight can be set to the gym's own; the standard is shown with a reset when it differs.
    $('pcCustomLabel').textContent = `Bar weight (${u})`;
    if (document.activeElement !== $('pcCustom')) $('pcCustom').value = pcFmt(pcBarWeight(st)).replace(/,/g, '');
    const std = pcStandard(st), own = !custom && std != null && pcBarWeight(st) !== std;
    $('pcBarNote').innerHTML = custom ? 'Your own bar.' : own ? `Standard ${pcFmt(std)} ${u} · <button type="button" class="btn sm ghost" id="pcBarReset">Use standard</button>` : 'Standard weight. Change it if your gym\'s bar differs.';
    if (own) $('pcBarReset').onclick = () => { if (st.own[st.bar]) delete st.own[st.bar][u]; pcSave(st); tellBar(); draw(); };
    $('pcTargetLabel').textContent = `Total on the bar (${u})`; if (document.activeElement !== $('pcTarget')) $('pcTarget').value = pcFmt(target).replace(/,/g, '');
    $('pcPlates').innerHTML = `<legend>Plates you have (tap to leave one out)</legend>` + PLATE_SETS[u].map(w => `<label class="pc-chip"><input type="checkbox" data-pc-plate="${w}" ${st.off[u].includes(w) ? '' : 'checked'}>${pcFmt(w)}</label>`).join('');
    $('pcPlates').querySelectorAll('[data-pc-plate]').forEach(c => c.onchange = () => { const w = Number(c.dataset.pcPlate), off = st.off[u]; st.off[u] = c.checked ? off.filter(x => x !== w) : [...off, w]; pcSave(st); draw(); });
    $('pcResult').innerHTML = plateResultHTML(st, target);
    $('pcResult').querySelectorAll('[data-pc-use]').forEach(b => b.onclick = () => { target = Number(b.dataset.pcUse); draw(); });
  };
  $('pcBar').onchange = () => { st.bar = $('pcBar').value; pcSave(st); tellBar(); draw(); };
  dlg.querySelectorAll('[data-pc-unit]').forEach(b => b.onclick = () => {
    const u = b.dataset.pcUnit; if (u === st.unit) return;
    // Keep the same load in the other unit, rounded to what that unit's plates can make.
    const conv = u === 'lb' ? target * LB_PER_KG : target / LB_PER_KG; st.unit = u;
    const s = stepOf(); target = Math.max(pcBarWeight(st), Math.round((conv - pcBarWeight(st)) / s) * s + pcBarWeight(st));
    pcSave(st); draw();
  });
  $('pcCustom').oninput = () => {
    const raw = $('pcCustom').value, v = Number(raw); if (raw === '' || !(v >= 0)) return;
    if (st.bar === 'custom') st.custom[st.unit] = v; else (st.own[st.bar] = st.own[st.bar] || {})[st.unit] = v;
    pcSave(st); tellBar(); $('pcResult').innerHTML = plateResultHTML(st, target);
  };
  $('pcCustom').onchange = () => draw();   // (shows the standard / reset line once typing is done)
  $('pcTarget').oninput = () => { target = Number($('pcTarget').value); $('pcResult').innerHTML = plateResultHTML(st, target); $('pcResult').querySelectorAll('[data-pc-use]').forEach(b => b.onclick = () => { target = Number(b.dataset.pcUse); draw(); }); };
  $('pcMinus').onclick = () => { target = Math.max(pcBarWeight(st), Math.round((target - stepOf()) * 100) / 100); draw(); };
  $('pcPlus').onclick = () => { target = Math.round((target + stepOf()) * 100) / 100; draw(); };
  draw();
  return dlg;
}

/* ---- workouts and history ---- */
/** A bar's weight in kg on this device: the gym's own if set in the calculator, else the standard. */
function barKgOf(barId){ const st = pcLoad(); st.bar = barId; st.unit = 'kg'; return pcBarWeight(st); }
/** The bar this client last used for this exercise (from their saved sessions), or null. Remembered until the
    sessions change. @returns {LoggedBar|null} */
function lastLoggedBar(cid, exId){
  if (!cid || exId == null) return null;
  const ix = logIndex();   // a rebuilt log index (sessions changed) starts this memo afresh
  if (Idx.lastBarFor !== ix){ Idx.lastBar = new Map(); Idx.lastBarFor = ix; }
  const key = cid + '|' + exId;
  if (!Idx.lastBar.has(key)){
    let found = null;
    for (const l of clientLogs(cid)){   // newest first
      const e = workoutLogEntries(l).find(x => entryExerciseKey(x) === 'id:' + exId);
      if (e && e.bar && Number(e.bar.kg) >= 0){ found = e.bar; break; }
    }
    Idx.lastBar.set(key, found);
  }
  return Idx.lastBar.get(key);
}
/** The bar a workout exercise is done with: chosen in the calculator, kept from a saved or repeated session, the one
    this client used for it last time, or found from the exercise. null for exercises without a bar. @returns {LoggedBar|null} */
function entryBar(en){
  if (!en) return null;
  if (en.barId){ const p = BAR_PROFILES.find(b => b.id === en.barId); if (p) return { id:p.id, name:p.name, kg:barKgOf(p.id) }; }
  if (en.bar && Number(en.bar.kg) >= 0) return en.bar;
  const d = S.sel && S.sel.draft, last = d && d.entries && d.entries.includes(en) ? lastLoggedBar(d.clientId, en.exId) : null;
  if (last) return last;
  const id = barIdForExercise(S.exercises.find(x => x.id === en.exId)), p = id && BAR_PROFILES.find(b => b.id === id);
  return p ? { id:p.id, name:p.name, kg:barKgOf(p.id) } : null;
}
/* Schema v4 (also after a sync pull and an import): sessions saved before the bar was recorded have the plates only
   in the Kg box (the bar not included). On every bar movement saved without a bar, the bar's weight is added to each
   set (an empty "0" with reps becomes the bar) and the bar is recorded: the same total and bar a session saved today
   has. The bar is the one the client last logged on that exercise, else the exercise's own (the gym's weight where
   set in the calculator). The plates-only numbers stay under barBackfill, to undo. An entry that has a bar is never
   touched, so it runs once per entry and gives the same result on every device (synced copies agree).
   Assistants get the coach's corrected sessions by sync instead. */
async function backfillBarWeights(){
  try { if (localStorage.getItem(LAST_ROLE_KEY) === 'assistant') return 0; } catch {}
  const pairs = [];
  for (const [id, l] of Object.entries(S.logs)){
    if (!l || l.type === 'conditioning' || !Array.isArray(l.entries)) continue;
    let next = null;
    l.entries.forEach((e, k) => {
      if (!e || typeof e !== 'object' || e.bar) return;
      // (a movement no longer in the library: judged by its logged name, "Barbell …" counting as a barbell)
      const nm = loggedExerciseName(e), ex = S.exercises.find(x => String(x.id) === String(e.exId)) || { name:nm, equipment:/\bbarbell\b/i.test(nm) ? 'Barbell' : '' };
      const p = BAR_PROFILES.find(b => b.id === barIdForExercise(ex)); if (!p) return;
      const last = e.exId != null ? lastLoggedBar(l.clientId, e.exId) : null;
      const bar = last ? { id:last.id, name:last.name, kg:Number(last.kg) } : { id:p.id, name:p.name, kg:barKgOf(p.id) };
      const kg = Number(bar.kg) > 0 ? Number(bar.kg) : 0, sets = loggedExerciseSets(e);
      const platesKg = sets.map(s => s && s.weight != null && s.weight !== '' ? s.weight : null);
      const fixed = sets.map(s => {
        if (!s || s.weight == null || s.weight === '') return s;
        const w = Number(s.weight); if (!Number.isFinite(w) || (w === 0 && !(Number(s.reps) > 0))) return s;
        return { ...s, weight:round2(w + kg) };
      });
      next = next || { ...l, entries:l.entries.slice() };
      next.entries[k] = { ...e, sets:fixed, bar, barBackfill:{ addedKg:kg, platesKg } };
    });
    if (next) pairs.push([id, next]);
  }
  if (!pairs.length) return 0;
  await Store.batch(async () => { await Store.bulkPut('logs', pairs, S.logs); });
  invalidateLogIndex();
  return pairs.length;
}
/* The weight the Plates button starts from, for the set being logged (the first one not ticked):
   1 its typed weight · 2 in a repeated workout, that set's weight in the session being repeated · 3 the last weight
   used on this exercise in today's log · 4 the hint in the box (suggestion / previous) · 5 the program's load. */
function platesWeightFor(en){
  const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return n > 0 ? n : null; };
  const sets = en.sets || [], open = sets.findIndex(x => !x.done), at = open < 0 ? sets.length - 1 : open, s = sets[at] || {};
  if (isWarmupSet(s)) return num(s.weight);   // a warm-up has its own weight
  const wi = workingIndexOf(sets, at);
  const today = sets.slice(0, at).filter(x => !isWarmupSet(x)).reverse().map(x => num(x.weight)).find(Boolean);   // (not from warm-ups)
  const sug = entrySuggestion(en)?.sets?.[wi]?.weight;
  return num(s.weight) ?? num(s.repeatWeight) ?? today ?? num(sug) ?? num(en.targetKg) ?? num(s.lastWeight) ?? num(en.targetLoad) ?? null;
}
/* Bar exercises in the logger: the Kg box takes the weight per side, the set keeps the total (per side × 2 + bar),
   which is what History, PRs, "previous", suggestions and volume use. A muted line under the box shows the total. */
const round2 = v => Math.round(v * 100) / 100;
/** What the Kg box shows for a set total (or a hint): per side for a bar exercise, as is otherwise. */
function kgBoxValue(en, total){
  if (total == null || total === '') return '';
  const b = entryBar(en), t = Number(total);
  if (!b) return total;
  return Number.isFinite(t) && t >= Number(b.kg) ? round2((t - Number(b.kg)) / 2) : '';
}
/** The set total for what was typed in the Kg box (null when empty). */
function kgFromBox(en, value){
  if (value === '' || value == null) return null;
  const v = Number(value), b = entryBar(en);
  return b && Number.isFinite(v) ? round2(v * 2 + Number(b.kg)) : v;
}
/** "Total: 70 kg" under the Kg box of a bar exercise ('' when there's nothing to add up). */
function kgTotalLabel(en, total){
  return entryBar(en) && total != null && total !== '' && Number.isFinite(Number(total)) ? `Total: ${pcFmt(Number(total))} kg` : '';
}
/** Switch a workout exercise to another bar. The plates per side stay the same, so each logged total moves by the
    difference in bar weight. `prevKg` is the bar weight before (when it was already changed elsewhere). */
function setEntryBar(en, barId, prevKg){

  en.barId = barId;
  const after = Number(entryBar(en)?.kg) || 0;
  if (after !== before) (en.sets || []).forEach(s => { if (s.weight != null && s.weight !== '') s.weight = round2(Number(s.weight) - before + after); });
}

/** A bottom sheet to pick the bar for one workout exercise (weights in kg, the gym's own where set in the calculator). */

/** History's "Plate/side" column: the plates on each side of a recorded bar for a logged set ("45", "Bar" for the
    empty bar, "—" when it doesn't apply). */
function platesPerSideText(weight, bar){
  const w = Number(weight), b = bar && Number(bar.kg);
  if (!bar || !(w > 0) || !(b >= 0) || w < b) return '—';
  return w === b ? 'Bar' : pcFmt((w - b) / 2);

/* ---------------------------------------------------------------
   Warm-up sets: from the exercise's ⋯ menu ("Add warm-up sets") in a workout.
   Logic (pure, no screen):
     planWarmups(workingWeight, { barWeight, increment, unit }) — the adaptive default rows: the empty bar first
       (bar exercises), then more ramp sets the bigger the jump from the bar to the work set (none for a small jump,
       up to a full 45 / 60 / 75 / 90 % pyramid for a big one).
     calcWarmupSets(workingWeight, rows, opts) — the weights: rounded to the increment (2.5 kg / 5 lb), never below
       the bar, and any set within one increment of the work set (the 90 % feeder on a light lift) left out.
   UI: openWarmupDialog(ei) — a recommendation from the last session, all editable: the work set (its top working
       set, plus the program's step when every rep was reached) and the rows (the warm-ups done last time, scaled to
       today's work set, to the nearest 5 %; the adaptive plan when there are none). Rows: W, % × reps or Bar × reps,
       weight, delete; + Add warm-up set (+ 10 % up to 80, then + 5), Restore (back to the recommendation) / Cancel /
       Insert. Text kept to the key things: the "Recommended" tag and where the work set came from. Insert puts the warm-ups at the top
       of the exercise, filled in, tagged as warm-ups (setType "warmup", isWarmup: true).
----------------------------------------------------------------*/

/** @typedef {{ bar:true, reps:number } | { pct:number, reps:number }} WarmupRow   (bar: the empty bar, no %) */
/** @typedef {{ bar:boolean, pct:number|null, reps:number, weight:number, skipped:boolean }} WarmupSet */

/* Ramp sets after the empty bar, by how many the jump calls for (0 = none … 4 = full pyramid): even steps in
   5 % units, fewer reps as the load climbs. */
const WARMUP_RAMPS = [
  [],
  [{ pct:70, reps:5 }],
  [{ pct:60, reps:5 }, { pct:80, reps:3 }],
  [{ pct:55, reps:5 }, { pct:70, reps:3 }, { pct:85, reps:2 }],
  [{ pct:45, reps:5 }, { pct:60, reps:5 }, { pct:75, reps:3 }, { pct:90, reps:1 }]
];
const wuRound5 = p => Math.min(100, Math.max(5, Math.round(p / 5) * 5));
/** Reps for a warm-up at this % of the work set. */
const wuRepsFor = pct => pct <= 60 ? 5 : pct <= 75 ? 3 : pct <= 85 ? 2 : 1;
/** The next % for an added warm-up: + 10 up to 80, then + 5 (at most 95). */
const wuNextPct = last => last == null ? 50 : Math.min(95, wuRound5(last + (last < 80 ? 10 : 5)));
/* Gap from the bar to the work set (kg) up to which each ramp size is enough; lb uses the same in pounds. */
const WARMUP_GAPS_KG = [15, 35, 60, 90];
const WARMUP_BAR_REPS = 10;

/** The default warm-up rows for a work set. @returns {WarmupRow[]} */
function planWarmups(workingWeight, opts = {}){
  const unit = opts.unit === 'lb' ? 'lb' : 'kg', w = Number(workingWeight);
  const bar = Math.max(0, Number(opts.barWeight ?? (unit === 'lb' ? 45 : 20))), inc = Number(opts.increment) > 0 ? Number(opts.increment) : (unit === 'lb' ? 5 : 2.5);
  if (!(w > 0) || w - bar <= inc + 1e-9) return [];   // the work set is the empty bar (or about): nothing to warm up with
  const gap = (w - bar) * (unit === 'lb' ? 1 / LB_PER_KG : 1);
  let n = WARMUP_GAPS_KG.findIndex(g => gap <= g); if (n < 0) n = 4;
  return [...(bar > 0 ? [{ bar:true, reps:WARMUP_BAR_REPS }] : []), ...WARMUP_RAMPS[n].map(r => ({ ...r }))];
}

/**
 * The warm-up weights for a work set.
 * @param {number} workingWeight
 * @param {WarmupRow[]} rows
 * @param {{ barWeight?:number, increment?:number, unit?:'kg'|'lb' }} [opts]  barWeight 0 = no bar (dumbbells…)
 * @returns {WarmupSet[]}
 */
function calcWarmupSets(workingWeight, rows, opts = {}){
  const unit = opts.unit === 'lb' ? 'lb' : 'kg', w = Number(workingWeight);
  const bar = Math.max(0, Number(opts.barWeight ?? (unit === 'lb' ? 45 : 20))), inc = Number(opts.increment) > 0 ? Number(opts.increment) : (unit === 'lb' ? 5 : 2.5);
  const round = v => Math.round(Math.round(v / inc) * inc * 100) / 100;
  return (rows || []).map(r => {
    const reps = Math.max(0, Math.round(Number(r.reps) || 0));
    if (r.bar) return { bar:true, pct:null, reps, weight:bar, skipped:!(w > 0) || w - bar <= inc + 1e-9 };
    const pct = Math.max(0, Number(r.pct) || 0);
    if (!(w > 0)) return { bar:false, pct, reps, weight:0, skipped:true };
    const weight = Math.max(bar, round(w * pct / 100));
    // Within one increment of the work set (the 90 % feeder on a light lift, say): not worth the fatigue, left out.
    return { bar:false, pct, reps, weight, skipped:w - weight <= inc + 1e-9 };
  });
}

const wuNum = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : null; };

/** The recommended work set, from the client's last session on this exercise: its top working set, plus the
    program's step when every rep was reached (the same advice as the logger's suggestion). Else what's planned or
    typed for it today. @returns {{ work:number|null, note:string }} */
function warmupWorkRecommendation(ei){
  const d = S.sel?.draft, en = d?.entries?.[ei]; if (!en) return { work:null, note:'' };
  const last = exerciseHistory(d.clientId, en.exId).last, fromLast = (last?.sets || []).map(s => wuNum(s.weight)).filter(Boolean);   // (working sets only)
  if (fromLast.length){
    const top = Math.max(...fromLast), next = Math.max(0, ...((entrySuggestion(en)?.sets || []).map(s => wuNum(s.weight)).filter(Boolean)));
    const when = shortDate(last.date);
    return { work:next > top ? next : top, note:`Last session, ${when}: ${pcFmt(top)} kg${next > top ? ` + ${pcFmt(round2(next - top))} kg` : ''}` };
  }
  const today = en.sets.map((s, si) => isWarmupSet(s) ? null : wuNum(s.weight) ?? wuNum(previousSetValues(ei, si).weight)).filter(Boolean);
  return { work:today.length ? Math.max(...today) : (wuNum(en.targetKg) ?? wuNum(en.targetLoad)), note:'' };
}

/** The client's warm-ups on this exercise in the latest session that had any, as rows relative to that session's
    top working set (so they scale to today's). @returns {{ date:string, rows:WarmupRow[] }|null} */
function lastSessionWarmups(cid, exId, barWeight){
  const editing = S.sel?.draft?.editing && S.sel.draft.clientId === cid ? S.sel.draft.id : null, editedLog = editing && S.logs[editing];
  for (const l of clientLogs(cid)){   // newest first
    if (editedLog && (l.id === editing || !isLogBefore(l, editedLog))) continue;
    const e = workoutLogEntries(l).find(x => entryExerciseKey(x) === 'id:' + String(exId)); if (!e) continue;
    const sets = loggedExerciseSets(e), weightOf = s => wuNum(s.weight ?? s.kg ?? s.load ?? s.actualWeight);
    const top = Math.max(0, ...sets.filter(s => !isWarmupSet(s)).map(weightOf).filter(Boolean));
    const wu = sets.filter(isWarmupSet).map(s => ({ weight:weightOf(s), reps:Math.round(Number(s.reps ?? s.actualReps)) || 0 })).filter(s => s.weight);
    if (!wu.length || !(top > 0)) continue;
    let hasBar = false;
    const rows = wu.sort((a, b) => a.weight - b.weight).map(s => {
      if (barWeight > 0 && !hasBar && Math.abs(s.weight - barWeight) < 0.01){ hasBar = true; return { bar:true, reps:s.reps || WARMUP_BAR_REPS }; }
      return { pct:wuRound5(s.weight / top * 100), reps:s.reps || 1 };   // (to the nearest 5 %)
    });
    return { date:l.date, rows };
  }
  return null;
}

const WU_TRASH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

function openWarmupDialog(ei){
  const d = S.sel && S.sel.draft, en = d && d.entries[ei]; if (!en) return;
  const bar = entryBar(en), opts = { barWeight:bar ? Number(bar.kg) : 0, increment:2.5, unit:'kg' };
  // Recommended from the last session (work set, and the warm-ups done then); everything stays editable.
  const rec = warmupWorkRecommendation(ei), prev = lastSessionWarmups(d.clientId, en.exId, opts.barWeight);
  const recRows = w => prev ? prev.rows.map(r => ({ ...r })) : planWarmups(w, opts);
  let work = rec.work, rows = recRows(work), edited = false;   // until rows are edited, an adaptive plan follows the work set
  const body = `<p class="small muted" style="margin-top:-.3rem">${esc(en.name || exName(en.exId))}${bar ? ` · ${esc(bar.name)} ${esc(pcFmt(Number(bar.kg)))} kg` : ''}</p>
    <label class="field wu-work"><span>Work set (kg) <span class="wu-rec" id="wuWorkRec" hidden>Recommended</span></span><input type="number" id="wuWork" inputmode="decimal" min="0" step="2.5" placeholder="e.g. 100"></label>
    <p class="small muted wu-from" id="wuFrom"></p>
    <div class="wu-head" aria-hidden="true"><span></span><span>% × reps</span><span>Weight</span><span></span></div>
    <div class="wu-list" id="wuList"></div>
    <button type="button" class="btn ghost wu-add" id="wuAdd">+ Add warm-up set</button>`;
  const dlg = dialog('Add warm-up sets', body, [
    { label:'Restore', onClick:() => { work = rec.work; $('wuWork').value = work ?? ''; edited = false; rows = recRows(work); draw(); return false; } },
    { label:'Cancel' },
    { label:'Insert', kind:'primary', onClick:() => {
      if (!(work > 0)){ toast('Enter the work set weight'); $('wuWork').focus(); return false; }
      const sets = calcWarmupSets(work, rows, opts).filter(s => !s.skipped && s.weight > 0);
      if (!sets.length){ toast('No warm-up sets needed for this weight'); return false; }
      // Replace warm-ups not ticked yet; keep any already done; put the new ones on top.
      const kept = en.sets.filter(s => !(isWarmupSet(s) && !s.done));
      en.sets = [...sets.map(s => ({ weight:s.weight, reps:s.reps, done:false, actualRPE:null, actualRIR:null, setType:'warmup', isWarmup:true, note:'' })), ...kept];
      en.warmupWork = work;   // the working sets are recommended from this work set (see warmupShiftedHint)
      markStrengthActivity(); render({ keepScroll:true });
      toast(sets.length + ' warm-up set' + (sets.length === 1 ? '' : 's') + ' added');
    } }
  ], { className:'wu-dialog' });   // phone-sized on every screen
  const $ = id => dlg.querySelector('#' + id);
  const fromText = () => {
    const isRec = rec.work > 0 && work === rec.work;
    $('wuWorkRec').hidden = !isRec;
    $('wuFrom').textContent = isRec ? rec.note : '';
  };
  // Weights update in place as you type (the rows are only rebuilt when the plan changes or one is added / removed).
  const update = () => {
    const out = calcWarmupSets(work, rows, opts);
    dlg.querySelectorAll('.wu-row').forEach((row, i) => {
      const r = out[i], kg = row.querySelector('.wu-kg');
      row.classList.toggle('is-skipped', !!r.skipped && work > 0);
      kg.innerHTML = !(work > 0) ? '<span class="muted">—</span>'
        : r.skipped ? '<span class="wu-skip">Left out</span>'
        : `<strong class="num">${esc(pcFmt(r.weight))} kg</strong>${bar && r.weight > Number(bar.kg) ? `<small>${esc(pcFmt((r.weight - Number(bar.kg)) / 2))} a side</small>` : ''}`;
    });
    fromText();
  };
  const draw = () => {
    $('wuList').innerHTML = rows.length ? rows.map((r, i) => `<div class="wu-row${r.bar ? ' is-bar' : ''}" data-wu="${i}">
        <span class="wu-badge" aria-label="Warm-up set ${i + 1}">W</span>
        <span class="wu-pill">${r.bar ? '<span class="wu-bar-label">Bar</span>' : `<input type="number" inputmode="numeric" min="0" max="100" step="5" data-wu-pct value="${esc(r.pct)}" aria-label="Warm-up ${i + 1}: percent of the work set"><span>%</span>`}<span class="wu-x">×</span><input type="number" inputmode="numeric" min="1" step="1" data-wu-reps value="${esc(r.reps)}" aria-label="Warm-up ${i + 1}: reps"></span>
        <span class="wu-kg" aria-live="polite"></span>
        ${r.bar ? '<span class="wu-del-spacer" aria-hidden="true"></span>' : `<button type="button" class="wu-del" data-wu-del="${i}" aria-label="Remove warm-up ${i + 1}">${WU_TRASH}</button>`}</div>`).join('')
      : work > 0 ? '<p class="small muted wu-empty">No warm-up needed.</p>' : '';
    $('wuList').querySelectorAll('.wu-row').forEach(row => {
      const i = Number(row.dataset.wu);
      const pct = row.querySelector('[data-wu-pct]'); if (pct) pct.oninput = e => { rows[i].pct = Number(e.target.value) || 0; edited = true; update(); };
      row.querySelector('[data-wu-reps]').oninput = e => { rows[i].reps = Number(e.target.value) || 0; edited = true; };
      const del = row.querySelector('[data-wu-del]'); if (del) del.onclick = () => { rows.splice(i, 1); edited = true; draw(); };
    });
    update();
  };
  $('wuWork').value = work ?? '';
  $('wuWork').oninput = () => {
    work = Number($('wuWork').value) || 0;
    if (!edited && !prev){ rows = planWarmups(work, opts); draw(); } else update();   // untouched adaptive plan: the number of sets follows the jump
  };
  $('wuAdd').onclick = () => {
    // A new row goes above the heaviest one (+ 10 % up to 80, then + 5, at most 95), with fewer reps as it climbs.
    const pcts = rows.filter(r => !r.bar).map(r => Number(r.pct) || 0), top = pcts.length ? Math.max(...pcts) : null;
    if (top >= 95){ toast('Already at 95 %'); return; }
    const pct = wuNextPct(top);
    rows.push({ pct, reps:wuRepsFor(pct) }); edited = true; draw();
    const inputs = $('wuList').querySelectorAll('[data-wu-pct]'); inputs[inputs.length - 1]?.focus();
  };
  draw();
}
</script>
</body>
