.history-stat.has-pr{padding:.1rem .5rem .1rem .4rem;border-radius:999px;background:var(--lime);color:var(--on-lime)}
.history-stat.has-pr svg{opacity:1}
.history-day-stats .history-stats{margin-top:0;padding-top:0;border-top:0}
/* ---- Plate calculator (40-plate-calculator.js) ---- */
.pc{display:grid;gap:.9rem}
.pc-row{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:end}
.pc-unit{display:inline-flex;padding:3px;border-radius:999px;background:var(--tint)}
.pc-unit button{min-width:52px;min-height:40px;padding:0 .8rem;border:0;border-radius:999px;background:transparent;color:var(--text-muted);font:inherit;font-weight:650;cursor:pointer}
.pc-unit button[aria-checked="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0002}
.pc-target{display:grid;grid-template-columns:48px 1fr 48px;gap:.4rem;align-items:center}
.pc-target button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:1.3rem;font-weight:600;cursor:pointer}
.pc-target input{min-height:48px;text-align:center;font-size:1.35rem;font-weight:700}
.pc-plates{display:flex;flex-wrap:wrap;gap:.35rem;margin:0;padding:0;border:0}
.pc-plates legend{margin-bottom:.35rem;font-size:.82rem;color:var(--text-muted)}
.pc-chip{display:inline-flex;align-items:center;gap:.3rem;min-height:36px;padding:0 .7rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.85rem;font-weight:600;cursor:pointer}
.pc-chip input{width:auto;min-height:0;margin:0;accent-color:var(--accent)}
.pc-chip:has(input:not(:checked)){opacity:.5;text-decoration:line-through}
.pc-result{padding:.85rem;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-soft)}
.pc-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.pc-head strong{font-size:1.05rem}
.pc-head span{color:var(--text-muted);font-size:.85rem}
.pc-msg{margin:.5rem 0 0;font-size:.88rem}
.pc-msg.err{color:var(--bad-text)}
.pc-msg button{margin:.35rem .35rem 0 0}
/* The bar: plates on both sleeves, biggest next to the collar. Heights follow the plate weight. */
.pc-bar{display:flex;align-items:center;justify-content:center;height:120px;margin:.7rem 0 .4rem;overflow:hidden}
.pc-sleeve{display:flex;align-items:center;gap:2px;min-width:0}
.pc-sleeve.l{flex-direction:row-reverse}
.pc-collar{width:7px;height:34px;border-radius:2px;background:var(--text-muted)}
.pc-shaft{flex:0 1 110px;min-width:46px;height:9px;border-radius:3px;background:linear-gradient(var(--text-muted),color-mix(in srgb,var(--text-muted) 60%,transparent))}
.pc-stub{width:14px;height:12px;background:var(--text-muted);opacity:.7}
.pc-plate{display:grid;place-items:center;border-radius:4px;color:#111;font-size:.6rem;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);box-shadow:inset 0 0 0 1px #0003}
.pc-list{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 0;padding:0;list-style:none}
.pc-list li{padding:.25rem .6rem;border-radius:999px;background:var(--tint);font-size:.85rem;font-weight:650}
.exblock-foot{display:flex;gap:.4rem;padding:.4rem .7rem}
/* Reordering a workout: press and hold the exercise title, then drag. */
.exblock>header{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.exblock.ex-dragging{position:relative;z-index:30;transition:none;box-shadow:0 14px 34px #0004;opacity:.97;cursor:grabbing}
.exblock.drop-before{box-shadow:0 -4px 0 var(--accent)}
.exblock.drop-after{box-shadow:0 4px 0 var(--accent)}
.exblock.ex-dropped{animation:exDropped .6s ease}
@keyframes exDropped{from{background:color-mix(in srgb,var(--lime) 35%,var(--surface))}to{background:var(--surface)}}
body.ex-reordering{-webkit-user-select:none;user-select:none;cursor:grabbing}
/* Bar chip by the "Kg" header: icon, the bar's weight, arrow; an invisible 44 × 44 px touch area. */
.kg-head{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;white-space:nowrap}
/* Bar chip: a small bordered tag — barbell (green), the bar's weight, caret. */
.bar-chip{position:relative;flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);box-shadow:0 1px 1px rgba(0,0,0,.04);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s}
.bar-chip-icon{flex:none;color:var(--accent-text)}
.bar-chip-kg{font-size:.68rem;font-weight:750;line-height:1.25;letter-spacing:0;text-transform:none;white-space:nowrap}
.bar-chip-unit{margin-left:1px;color:var(--text-muted);font-size:.56rem;font-weight:650}
.bar-chip-caret{flex:none;color:var(--text-muted)}
@media(max-width:370px){.bar-chip-caret{display:none}}   /* narrow phones: the border alone says it's a button */
@media(max-width:340px){.bar-chip-unit{display:none}}   /* the smallest phones: barbell and number (the column says Kg) */
.bar-chip::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.bar-chip:hover{border-color:var(--accent-mid)}
.bar-chip:active{background:var(--tint)}
.bar-chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Bottom sheet (the bar picker) */
dialog.as-sheet{margin:auto auto 0;width:100%;max-width:560px;border-bottom:0;border-radius:20px 20px 0 0;animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.bar-sheet-list{display:grid;gap:2px}
.bar-group{margin:.55rem 0 .15rem;color:var(--text-muted);font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bar-opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;min-height:46px;padding:.5rem .75rem;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:.95rem;text-align:left;cursor:pointer}
.bar-opt:hover{background:var(--surface-2)}
.bar-opt[aria-checked="true"]{border-color:var(--accent-mid);background:var(--tint);font-weight:650}
.bar-opt-kg{color:var(--text-muted);font-size:.85rem;font-weight:600}
.bar-opt-custom{display:flex;align-items:center;gap:.5rem}
.bar-opt-custom .bar-opt{flex:1}
.bar-custom-kg{display:flex;align-items:center;gap:.3rem;color:var(--text-muted);font-size:.85rem}
.bar-custom-kg input{width:4.5rem;min-height:40px;text-align:center}
/* Warm-up sets: the W badge (workout rows and History) and the "Add warm-up sets" pop-up (41-warmup-sets.js). */
.set-w{display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:7px;background:color-mix(in srgb,var(--lime) 55%,var(--surface));color:var(--on-lime);font-size:.7rem;font-weight:800;letter-spacing:0}
.setrow .idx.set-w{justify-self:center;align-self:center}
/* History: warm-ups as one line that opens to show their rows. */
table:not(.wu-open) tr.hist-wu-set{display:none}
tr.hist-wu-sum td{padding:0}
.hist-wu-toggle{display:flex;align-items:center;gap:.5rem;width:100%;min-height:44px;margin:0;padding:.35rem .6rem;border:0;border-radius:0;background:color-mix(in srgb,var(--lime) 10%,transparent);color:var(--text);font:inherit;font-size:.88rem;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hist-wu-toggle .muted{font-size:.8rem}
.hist-wu-caret{margin-left:auto;flex:none;color:var(--text-muted);transition:transform .15s}
.wu-open .hist-wu-caret{transform:rotate(180deg)}
.hist-wu-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* Done warm-ups leave the screen; the first working set after them is filled in and marked as next. */
.setrow.is-next{box-shadow:inset 3px 0 0 var(--accent-text)}
/* The warm-up pop-up keeps a phone width on bigger screens; Restore / Cancel / Insert share one row. */
dialog.wu-dialog{width:min(440px,calc(100vw - 1rem))}
dialog.wu-dialog .dlg-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
dialog.wu-dialog .dlg-foot .btn{width:100%;min-width:0;padding-left:.5rem;padding-right:.5rem}
.wu-work{max-width:220px}
.wu-work input{font-size:1.15rem;font-weight:700}
.wu-head,.wu-row{display:grid;grid-template-columns:2rem 7.7rem minmax(0,1fr) 40px;gap:.45rem;align-items:center}
.wu-head{padding:0 .1rem .3rem;color:var(--text-muted);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wu-list{display:grid;gap:.4rem}
.wu-row{min-height:52px;padding:.35rem .45rem;border:1px solid var(--line-soft);border-radius:14px;background:var(--surface-2)}
.wu-row.is-skipped{opacity:.55}
.wu-badge{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:8px;background:color-mix(in srgb,var(--lime) 55%,var(--surface));color:var(--on-lime);font-size:.8rem;font-weight:800}
.wu-pill{display:inline-flex;align-items:center;gap:.2rem;width:max-content;padding:.25rem .3rem;border-radius:12px;background:var(--tint);color:var(--text-muted);font-size:.85rem;font-weight:650}
/* Small rounded boxes that sit inside the pill (not the app's 44 px input). */
dialog .wu-pill input{width:2.4rem;height:36px;min-height:36px;padding:0;border:1px solid var(--line-soft);border-radius:8px;background:var(--surface);color:var(--text);font-size:.9rem;font-weight:700;text-align:center;box-shadow:none;-moz-appearance:textfield;appearance:textfield}
dialog .wu-pill input::-webkit-inner-spin-button,dialog .wu-pill input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
dialog .wu-pill input:focus{outline:2px solid var(--focus);outline-offset:0;box-shadow:none}
.wu-x{margin:0 .1rem}
.wu-kg{display:grid;line-height:1.15}
.wu-kg strong{font-size:1rem;white-space:nowrap}
@media (max-width:340px){
  dialog.wu-dialog .dlg-body{padding-left:1rem;padding-right:1rem}
  .wu-head,.wu-row{grid-template-columns:1.6rem 7.1rem minmax(0,1fr) 32px;gap:.3rem}
  .wu-row{padding:.3rem}
  .wu-badge{width:1.5rem;height:1.5rem}
  .wu-del,.wu-del-spacer{width:32px}
  .wu-pill{padding:.25rem}
  dialog .wu-pill input{width:2.15rem}
}
.wu-kg small{color:var(--text-muted);font-size:.7rem;font-weight:600}
.wu-skip{color:var(--text-muted);font-size:.8rem;font-style:italic}
.wu-del{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--bad-text);cursor:pointer}
.wu-del:hover{background:var(--bad-bg)}
.wu-del-spacer{width:40px;height:40px}
.wu-bar-label{padding:0 .25rem;color:var(--text);font-weight:700}
.wu-row.is-bar{border-style:dashed}
.wu-from{min-height:1em;margin:-.35rem 0 .5rem}
.wu-rec{display:inline-block;margin-left:.3rem;padding:.05rem .45rem;border-radius:999px;background:color-mix(in srgb,var(--lime) 30%,transparent);color:var(--text);font-size:.65rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.wu-rec[hidden]{display:none}
.wu-from:empty{display:none}
.wu-add{width:100%;margin-top:.55rem;border-style:dashed}
.wu-empty{padding:.6rem 0}
.exercise-actions-hint{margin:0;padding:.45rem .8rem .35rem;color:var(--text-muted);font-size:.74rem;font-weight:600}
/* Bar exercises: one box that looks like the others, the weight per side on top and the total in small text
   inside it, at the bottom. Same height as the Reps box, so the row stays even. */
.kg-cell{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:46px;padding:.2rem .7rem;border:1px solid var(--line-strong);border-radius:10px;background:var(--floor);cursor:text;transition:border-color .15s,box-shadow .15s}
.setrow .kg-cell input{width:100%;min-width:0;min-height:0;height:auto;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;line-height:1.2}
.setrow .kg-cell input:focus{border:0;box-shadow:none}
@media(max-width:430px){.kg-cell{min-height:44px;padding:.15rem .32rem}.setrow .kg-cell input{font-size:.92rem}}
.kg-cell:focus-within{border-color:var(--accent-mid);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-mid) 10%,transparent)}
.kg-total{margin-top:1px;color:var(--text-muted);font-size:.62rem;font-weight:600;line-height:1.1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-total:empty{display:none}
/* History: the recorded bar under the exercise name (the Plate/side column is in the set table). */
.history-bar{margin:-.15rem 0 .45rem;color:var(--text-muted);font-size:.8rem;font-weight:600}
/* Phones go back with their own gesture (see 39-back-button.js): the in-app Back buttons are hidden there. */
.has-system-back :is([data-back],[data-back-conditioning],[data-program-kind="chooser"],#leaveConditioningWorkout,.nav-back){display:none!important}
.has-system-back .conditioning-toolbar{justify-content:flex-end}
#edgeBack{position:fixed;left:0;top:0;z-index:200;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--text);box-shadow:0 4px 16px #0003;opacity:0;pointer-events:none;transform:translate(-44px,-100px);transition:opacity .12s,background .12s,color .12s}
#edgeBack.show{opacity:1}
#edgeBack.ready{background:var(--lime);color:var(--on-lime)}
/* Conditioning screen: the session clock alone (the block timer handles work and rest). */
.session-timer.session-only{grid-template-columns:1fr}
.history-pr-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.15rem 0 .45rem}
.history-pr-tag{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .55rem .12rem .4rem;border-radius:999px;background:var(--lime);color:var(--on-lime);font-size:.72rem;font-weight:700}
.history-pr-tag svg{width:13px;height:13px}
tr.pr-set td{background:color-mix(in srgb,var(--lime) 30%,transparent)}
:root[data-theme="dark"] tr.pr-set td{background:color-mix(in srgb,var(--lime) 10%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tr.pr-set td{background:color-mix(in srgb,var(--lime) 10%,transparent)}}
.pr-mark{display:inline-flex;vertical-align:-2px;margin-left:.25rem;color:var(--accent-text)}
.pr-mark svg{width:13px;height:13px}
.group-choice-list{display:grid;gap:.4rem;max-height:45vh;overflow:auto}
.group-choice{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--floor);color:var(--ink)}
.group-choice input{width:1.1rem;height:1.1rem;min-height:0;accent-color:var(--plate-blue)}
.exercise-picker-list{display:grid;gap:.45rem;max-height:min(55vh,520px);overflow:auto;margin-top:.7rem}
.exercise-picker-option{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;min-height:48px;padding:.65rem .8rem;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);text-align:left;cursor:pointer}
.exercise-picker-option:hover{border-color:var(--plate-blue);background:var(--floor)}
.exercise-picker-option small{color:var(--ink-2);text-align:right}
.exercise-picker-create{border-style:dashed;color:var(--plate-blue);font-weight:700}
.exblock:has(.exercise-actions-menu[open]){overflow:visible;position:relative;z-index:15}
button.btn{min-height:44px}
button.btn.sm{min-height:40px}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{min-height:44px}

@supports(height:100dvh){dialog form{max-height:calc(100dvh - 1rem)}}
dialog .dlg-body{min-height:0;overflow-y:auto;overscroll-behavior:contain}
dialog .dlg-foot{position:sticky;bottom:0;flex-wrap:wrap;background:var(--panel);padding-bottom:max(.8rem,env(safe-area-inset-bottom,0px))}

<body>
<div class="shell">
  <header class="top">
    <h1><button type="button" class="brand" id="brandHome" aria-label="Nyaega, go to Home"><span class="mark" aria-hidden="true"></span><span class="brand-text"><span class="brand-name">Nyaega</span><span class="brand-sub">Training Hub</span></span></button></h1>
    <span class="status" id="status" hidden>Starting…</span>
    <div class="top-actions" id="topActions" hidden>
      <button type="button" id="hdrCalendar" aria-label="Schedule" title="Schedule"></button>
      <button type="button" id="hdrSearch" aria-label="Search" title="Search"></button>
      <button type="button" id="hdrProfile" aria-label="Profile and settings" title="Profile" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="workoutDock" class="workout-dock" hidden></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="dlg"><form method="dialog"><div class="dlg-body" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div><button type="submit" class="dlg-enter" tabindex="-1" aria-hidden="true">Submit</button></form></dialog>

<script>
/* ---------------------------------------------------------------
   Storage: IndexedDB in this browser (local mode), or one JSON file the
   coach connects (file mode). If IndexedDB can't be opened the app falls
   back to localStorage. The Store facade below is the same either way.
----------------------------------------------------------------*/
const COLLS = ['clients','groups','programs','logs','attendance','conditioning','schedule','scheduleExceptions'];
let MODE = 'local';   // 'local' (IndexedDB, or localStorage as a fallback) or 'file'
let FILE_HANDLE = null, FileData = null;

/* A read that fails must never look like "no data" — callers would then write
   over the real data. StorageLoadError stops boot and every write path. */
class StorageLoadError extends Error {
  constructor(what, cause){ super('Could not read ' + what + (cause && cause.message ? ' — ' + cause.message : '')); this.name = 'StorageLoadError'; this.what = what; this.cause = cause; }
}
const LS = {
  key: c => 'nyaega:' + c,
  all(c){
    const raw = localStorage.getItem(LS.key(c));
    if (raw == null) return {};
    let parsed;
    try { parsed = JSON.parse(raw); } catch(e){ throw new StorageLoadError('stored ' + c, e); }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new StorageLoadError('stored ' + c, new Error('unexpected data shape'));
    return parsed;
  },
  // LS.all throws on damaged data, so these never overwrite a collection they couldn't read.
  put(c,id,data){ const m = LS.all(c); m[id] = data; LS.write(LS.key(c), JSON.stringify(m), c); },
  del(c,id){ const m = LS.all(c); delete m[id]; LS.write(LS.key(c), JSON.stringify(m), c); },
  write(key, text, what){ try { localStorage.setItem(key, text); } catch(e){ throw new StorageWriteError(what, e); } }
};
const isQuotaError = e => !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message || '')));
/* Every failed write becomes a StorageWriteError, so the UI can tell the coach
   plainly that something was NOT saved (and whether storage is full). */
const STORAGE_LABELS = { logs:'the session', clients:'the client', attendance:'the attendance mark', programs:'the program', groups:'the pairing', conditioning:'the conditioning program', exercises:'the exercise library', activeWorkoutDraft:'the workout backup copy', activeSessions:'the workout backup copy', workoutDraftArchive:'the saved-workouts list' };
const storageLabel = what => STORAGE_LABELS[what] || what;
class StorageWriteError extends Error {
  constructor(what, cause){
    const full = isQuotaError(cause);
    what = String(what || 'your changes').replace(/^\w+/, w => storageLabel(w));
    super(full ? 'This device\'s storage is full, so ' + what + ' could not be saved' : 'Could not save ' + what + (cause && cause.message ? ' — ' + cause.message : ''));
    this.name = 'StorageWriteError'; this.what = what; this.cause = cause; this.quota = full;
  }
}



/* ---------------------------------------------------------------
   Local back end: IndexedDB — one object store per collection, plus "meta" and "snapshots".
   (logs are indexed by clientId and date; attendance by date and clientId.) It replaces the old
   localStorage copy, which is migrated once and kept as a read-only backup for 30 days.
   If IndexedDB can't be opened at all, the app keeps using localStorage as before.
----------------------------------------------------------------*/
let LOCAL = 'ls';   // 'idb' once IndexedDB is open and the one-time copy is verified
const IDB = {
  name:'nyaega-data', db:null, opening:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    if (this.opening) return this.opening;
    return this.opening = new Promise((resolve, reject) => {
      const r = indexedDB.open(this.name, 3);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox');   // v2: changes waiting to sync
        if (!db.objectStoreNames.contains('versions')) db.createObjectStore('versions');   // v3: the server version last seen per document
        if (!db.objectStoreNames.contains('conflicts')) db.createObjectStore('conflicts');   // v3: edits that clashed with another device
        if (db.objectStoreNames.contains('logs')) return;   // upgrading from v1: the data stores already exist
        COLLS.forEach(c => {
          const s = db.createObjectStore(c);
          if (c === 'logs'){ s.createIndex('clientId', 'clientId'); s.createIndex('date', 'date'); }
          if (c === 'attendance'){ s.createIndex('date', 'date'); s.createIndex('clientId', 'clientId'); }
        });
        db.createObjectStore('meta'); db.createObjectStore('snapshots');
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { this.db.close(); this.db = null; this.opening = null; }; resolve(this.db); };
      r.onerror = () => { this.opening = null; reject(r.error); };
      r.onblocked = () => { this.opening = null; reject(new Error('IndexedDB is blocked by another open tab')); };
    });
  },
  async run(stores, mode, fn){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(stores, mode); let out;
      try { out = fn(tx); } catch(e){ try { tx.abort(); } catch {} reject(e); return; }
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => reject(tx.error || new Error('transaction failed'));
    });
  },
  async all(store){
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const out = {}, tx = db.transaction(store, 'readonly'), cur = tx.objectStore(store).openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c){ out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => reject(tx.error || new Error('read failed'));
    });
  },
  async get(store, key){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).get(key); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  async keys(store){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).getAllKeys(); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  async count(store){
    const db = await this.open();
    return new Promise((resolve, reject) => { const r = db.transaction(store, 'readonly').objectStore(store).count(); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  },
  put(store, key, value){ return this.run(store, 'readwrite', tx => { tx.objectStore(store).put(value, key); }); },
  del(store, key){ return this.run(store, 'readwrite', tx => { tx.objectStore(store).delete(key); }); },
  /* pairs: [[id, doc], ...] — one transaction, all or nothing */
  putMany(store, pairs){ return this.run(store, 'readwrite', tx => { const s = tx.objectStore(store); pairs.forEach(([id, doc]) => s.put(doc, id)); }); }
};
const IDB_FLAG = 'nyaega:idbMigrated';   // once set, never fall back to the old localStorage copy
function lsDataKeys(){
  const keys = [];
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (!k || !k.startsWith('nyaega:')) continue; const rest = k.slice(7); if (COLLS.includes(rest) || rest.startsWith('meta:')) keys.push(k); } } catch {}
  return keys;
}
/* Copy the old localStorage data into IndexedDB in one transaction, verify the counts, and only then mark it done.
   The old keys are NOT touched; they stay as a read-only backup (see expireLocalStorageBackup). */
async function migrateFromLocalStorage(){
  if (await IDB.get('meta', 'migration')) return;
  const keys = lsDataKeys(), now = new Date();
  if (!keys.length){ await IDB.put('meta', 'migration', { at:now.toISOString(), source:'none', counts:{} }); return; }
  const data = {}, counts = {};
  for (const c of COLLS){ data[c] = LS.all(c); counts[c] = Object.keys(data[c]).length; }   // throws on damaged data, before anything is written
  const meta = {};
  for (const k of keys){
    if (!k.startsWith('nyaega:meta:')) continue;
    const raw = localStorage.getItem(k); if (raw == null) continue;
    let v; try { v = JSON.parse(raw); } catch(e){ throw new StorageLoadError('stored ' + k.slice(12), e); }
    if (v != null) meta[k.slice(12)] = v;
  }
  counts.meta = Object.keys(meta).length;
  await IDB.run([...COLLS, 'meta'], 'readwrite', tx => {
    COLLS.forEach(c => { const s = tx.objectStore(c); Object.entries(data[c]).forEach(([id, doc]) => s.put(doc, id)); });
    const m = tx.objectStore('meta'); Object.entries(meta).forEach(([id, v]) => m.put(v, id));
  });
  const bad = [];
  for (const c of COLLS){ const n = await IDB.count(c); if (n !== counts[c]) bad.push(c + ' ' + n + '/' + counts[c]); }
  const nm = await IDB.count('meta'); if (nm !== counts.meta) bad.push('meta ' + nm + '/' + counts.meta);
  if (bad.length){
    await IDB.run([...COLLS, 'meta'], 'readwrite', tx => { [...COLLS, 'meta'].forEach(s => tx.objectStore(s).clear()); });
    throw new Error('the copy to IndexedDB did not match (' + bad.join(', ') + ')');
  }
  await IDB.put('meta', 'migration', { at:now.toISOString(), source:'localStorage', counts, keys, backupUntil:new Date(now.getTime() + 30 * 86400000).toISOString() });
}
/* After 30 days the old localStorage copy is removed (the verified IndexedDB copy is the only one from then on). */
async function expireLocalStorageBackup(){
  const m = await IDB.get('meta', 'migration');
  if (!m || !m.backupUntil || m.cleaned || Date.now() < Date.parse(m.backupUntil)) return;
  (m.keys || []).forEach(k => { try { localStorage.removeItem(k); } catch {} });
  await IDB.put('meta', 'migration', { ...m, cleaned:new Date().toISOString() });
}
async function initLocalBackend(){
  LOCAL = 'ls';
  const migratedBefore = (() => { try { return localStorage.getItem(IDB_FLAG) === '1'; } catch { return false; } })();
  if (!window.indexedDB){ if (migratedBefore) throw new StorageLoadError('browser storage', new Error('IndexedDB is not available')); return; }
  try {
    await IDB.open(); await migrateFromLocalStorage(); LOCAL = 'idb';
    try { localStorage.setItem(IDB_FLAG, '1'); } catch {}
    expireLocalStorageBackup().catch(e => console.warn('Old-backup cleanup failed', e));
  } catch(e){
    if (e instanceof StorageLoadError) throw e;
    // Never slip back to a stale localStorage copy once IndexedDB has been the real store.
    if (migratedBefore) throw new StorageLoadError('browser storage', e);
    console.warn('IndexedDB unavailable — staying on localStorage', e); LOCAL = 'ls';
  }
}
/* Every stored document carries its own id and timestamps. */
function stampDoc(coll, id, data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return;
  data.id = id;
  const now = new Date().toISOString();
  if (!data.createdAt) data.createdAt = coll === 'clients' ? todayISO() : now;
  data.updatedAt = now;
}

const Store = {
  async init(){
    Store.initError = null;
    if (MODE === 'local'){ try { await initLocalBackend(); } catch(e){ Store.initError = e; } }
    return MODE;
  },
  async loadAll(coll){
    if (MODE === 'file') return FileData[coll] || {};
    if (LOCAL === 'idb'){
      try { return await IDB.all(coll); } catch(e){ throw new StorageLoadError(coll, e); }
    }
    return LS.all(coll);
  },
  /* put/del/putMeta resolve only once the data is really stored, and reject
     with StorageWriteError otherwise — in every mode. */
  async put(coll, id, data){
    stampDoc(coll, id, data);
    if (MODE === 'file'){
      const had = Object.prototype.hasOwnProperty.call(FileData[coll], id), prev = FileData[coll][id];
      FileData[coll][id] = data;
      if (fileBatchDepth) return;   // Store.batch writes once at the end
      try { await queueFileWrite(coll); }
      catch(e){ if (had) FileData[coll][id] = prev; else delete FileData[coll][id]; throw e; }
      return;
    }
    if (LOCAL === 'idb'){
      try { await IDB.put(coll, id, data); } catch(e){ throw new StorageWriteError(coll, e); }
      await Sync.enqueue('put', coll, id, data);
    } else LS.put(coll, id, data);
  },
  async del(coll, id){
    if (MODE === 'file'){
      const had = Object.prototype.hasOwnProperty.call(FileData[coll], id), prev = FileData[coll][id];
      delete FileData[coll][id];
      if (fileBatchDepth) return;   // Store.batch writes once at the end
      try { await queueFileWrite(coll); }
      catch(e){ if (had) FileData[coll][id] = prev; throw e; }
      return;
    }
    if (LOCAL === 'idb'){
      try { await IDB.del(coll, id); } catch(e){ throw new StorageWriteError('the deletion of ' + storageLabel(coll), e); }
      await Sync.enqueue('del', coll, id, null);
    }
    else LS.del(coll, id);
  },
  /* Returns `fallback` only when the document genuinely doesn't exist.
     A failed or damaged read throws StorageLoadError instead. */
  async getMeta(id, fallback){
    if (MODE === 'file') return FileData?.meta?.[id] ?? fallback;
    if (LOCAL === 'idb'){
      let v; try { v = await IDB.get('meta', id); } catch(e){ throw new StorageLoadError('stored ' + id, e); }
      return v == null ? fallback : v;
    }
    const raw = localStorage.getItem('nyaega:meta:' + id);
    if (raw == null) return fallback;
    try { return JSON.parse(raw) ?? fallback; } catch(e){ throw new StorageLoadError('stored ' + id, e); }
  },
  async putMeta(id, data){
    if (MODE === 'file'){
      FileData.meta = FileData.meta || {};
      const had = Object.prototype.hasOwnProperty.call(FileData.meta, id), prev = FileData.meta[id];
      FileData.meta[id] = data;
      if (fileBatchDepth) return;   // Store.batch writes once at the end
      try { await queueFileWrite(id); }
      catch(e){ if (had) FileData.meta[id] = prev; else delete FileData.meta[id]; throw e; }
      return;
    }
    if (LOCAL === 'idb'){
      try { if (data == null) await IDB.del('meta', id); else await IDB.put('meta', id, data); }
      catch(e){ throw new StorageWriteError(id, e); }
      if (id === 'exercises' && data) await Sync.enqueueExercises(data.list);
    }
    else LS.write('nyaega:meta:' + id, JSON.stringify(data), id);
  },
  /* Many documents of one collection in a single transaction (IndexedDB) — used by migrations. `live` is updated too. */
  async bulkPut(coll, pairs, live){
    pairs.forEach(([id, doc]) => stampDoc(coll, id, doc));
    if (MODE === 'local' && LOCAL === 'idb'){
      try { await IDB.putMany(coll, pairs); } catch(e){ throw new StorageWriteError(coll, e); }
      for (const [id, doc] of pairs) await Sync.enqueue('put', coll, id, doc);
    } else { for (const [id, doc] of pairs) await this.put(coll, id, doc); }
    if (live) pairs.forEach(([id, doc]) => { live[id] = doc; });
  },
  /* Many changes, one save. In file mode the file is written once when fn finishes;
     if that write fails, every change made inside fn is undone in memory and the error is
     rethrown. Other modes just run fn (their writes are per-record already). */
  async batch(fn){
    if (MODE !== 'file') return fn();
    const snapshot = JSON.stringify(FileData);
    fileBatchDepth++;
    let result;
    try { result = await fn(); }
    finally { fileBatchDepth--; }
    if (fileBatchDepth) return result;
    try { await queueFileWrite('your changes'); }
    catch(e){
      // Restore in place: S's collections are the same objects as FileData's.
      const before = JSON.parse(snapshot);
      for (const key of [...COLLS, 'meta']){ const live = FileData[key] || (FileData[key] = {}); for (const k of Object.keys(live)) delete live[k]; Object.assign(live, before[key] || {}); }
      throw e;
    }
    return result;
  }
};

/* ---------------------------------------------------------------
   File mode: everything lives in one JSON file the person picks
   with the browser's native file dialog (File System Access API,
   Chrome/Edge/Opera). The file handle is remembered in IndexedDB,
   so after a refresh the app asks to reconnect instead of quietly
   switching to browser storage.
----------------------------------------------------------------*/
/* Writes never overlap. Every change made while a write is running shares ONE
   follow-up write, so a burst of saves becomes one or two writes, not one each.
   Each caller's promise rejects if the write carrying its change fails. */
let fileWriteRunning = null, fileWritePending = null, fileBatchDepth = 0;
function queueFileWrite(what){
  if (!fileWritePending){
    const pending = (fileWriteRunning || Promise.resolve()).catch(() => {}).then(() => {
      fileWritePending = null; fileWriteRunning = pending;   // later changes queue behind this write
      return writeFileNow();
    });
    pending.finally(() => { if (fileWriteRunning === pending) fileWriteRunning = null; }).catch(() => {});
    fileWritePending = pending;
  }
  return fileWritePending.catch(e => { console.warn('file write failed', e); throw new StorageWriteError((what || 'your changes') + ' to ' + (FILE_HANDLE ? FILE_HANDLE.name : 'the data file'), e); });
}
/* Remembers the connected data file across visits (the handle itself can't go in localStorage). */
const HandleStore = {
  open(){ return new Promise((resolve, reject) => { const r = indexedDB.open('nyaega-handles', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }); },
  async run(mode, fn){ const db = await this.open(); return new Promise((resolve, reject) => { const tx = db.transaction('kv', mode), req = fn(tx.objectStore('kv')); tx.oncomplete = () => { db.close(); resolve(req && req.result); }; tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); }; }); },
  get(key){ return this.run('readonly', s => s.get(key)); },
  set(key, value){ return this.run('readwrite', s => s.put(value, key)); },
  del(key){ return this.run('readwrite', s => s.delete(key)); }
};
const LAST_MODE_KEY = 'nyaega:lastMode';
function rememberFileMode(handle){
  try { localStorage.setItem(LAST_MODE_KEY, 'file'); } catch {}
  HandleStore.set('dataFile', handle).catch(e => console.warn('Could not remember the data file', e));
}
async function forgetFileMode(){
  try { localStorage.removeItem(LAST_MODE_KEY); } catch {}
  try { await HandleStore.del('dataFile'); } catch(e){ console.warn('Could not forget the data file', e); }
}
async function writeFileNow(){
  if (!FILE_HANDLE) return;
  // The library is committed to meta first, so prefer it over S.exercises (which updates only after a successful write).
  const exercises = FileData.meta?.exercises?.list || S.exercises;
  const payload = { app:'nyaega', version:2, savedAt: new Date().toISOString(),meta:FileData.meta||{},
    clients:FileData.clients, groups:FileData.groups, programs:FileData.programs,
    logs:FileData.logs, attendance:FileData.attendance, conditioning:FileData.conditioning,
    schedule:FileData.schedule, scheduleExceptions:FileData.scheduleExceptions, exercises };
  const writable = await FILE_HANDLE.createWritable();
  await writable.write(JSON.stringify(payload, null, 2));
  await writable.close();
}
function fsApiSupported(){ return !!(window.showOpenFilePicker && window.showSaveFilePicker); }
async function openDataFile(){
  if (!fsApiSupported()){ toast('Your browser can\'t do this — try Chrome or Edge, or use Export/Import instead'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({ types:[{ description:'Nyaega data', accept:{'application/json':['.json']} }] });
    if ((await handle.requestPermission({ mode:'readwrite' })) !== 'granted'){ toast('Permission needed to use that file'); return; }
    const data = safeParse(await (await handle.getFile()).text());
    if (data.app !== 'nyaega') throw new Error('not a Nyaega file');
    enterFileMode(handle, data);
    toast('Connected to ' + handle.name);
  } catch(e){ if (e.name !== 'AbortError') toast('Could not open that file — ' + e.message); }
}
async function newDataFile(){
  if (!fsApiSupported()){ toast('Your browser can\'t do this — try Chrome or Edge, or use Export/Import instead'); return; }
  try {
    const handle = await window.showSaveFilePicker({ suggestedName:'nyaega-data.json', types:[{ description:'Nyaega data', accept:{'application/json':['.json']} }] });
    enterFileMode(handle, { clients:{}, groups:{}, programs:{}, logs:{}, attendance:{}, conditioning:{}, schedule:{}, scheduleExceptions:{}, exercises: SEED_EXERCISES });
    await writeFileNow();
    toast('Created ' + handle.name);
  } catch(e){ if (e.name !== 'AbortError') toast('Could not create that file — ' + e.message); }
}
function enterFileMode(handle, data){
  FILE_HANDLE = handle; MODE = 'file';
  rememberFileMode(handle);
  if (!document.querySelector('#tabs button')) buildTabs();   // e.g. coming from the reconnect screen
  FileData = { clients:data.clients||{}, groups:data.groups||{}, programs:data.programs||{}, logs:data.logs||{}, attendance:data.attendance||{}, conditioning:data.conditioning||{}, schedule:data.schedule||{}, scheduleExceptions:data.scheduleExceptions||{}, meta:data.meta||{} };
  S.clients = FileData.clients; S.groups = FileData.groups; S.programs = FileData.programs;
  S.logs = FileData.logs; S.attendance = FileData.attendance; S.conditioning = FileData.conditioning; invalidateLogIndex(); invalidateAttIndex();
  S.schedule = FileData.schedule; S.scheduleExceptions = FileData.scheduleExceptions;
  S.exercises = (data.exercises && data.exercises.length) ? data.exercises : SEED_EXERCISES;
  { const fm = FileData.meta || {}; S.recoveryList = (fm.activeSessions && Array.isArray(fm.activeSessions.sessions) && fm.activeSessions.sessions.length) ? fm.activeSessions.sessions : (fm.activeWorkoutDraft ? [fm.activeWorkoutDraft] : []); }
  S.sessions = [];
  S.recoveryArchive=FileData.meta.workoutDraftArchive||[];
  S.bootState = 'ready';
  S.sel = {}; setStatus(); render();if(S.recoveryList.length)showWorkoutRecovery();
  (async () => { try { const sv = Number((FileData.meta.schemaVersion || {}).version) || 0; if (sv < SCHEMA_VERSION){ await migrate(sv); render({ keepScroll:true }); } } catch(e){ showSaveError(e); } })();
}
async function disconnectFile(){ toast('Disconnecting…'); await forgetFileMode(); setTimeout(() => location.reload(), 400); }

/* Shown at startup when the app was last used with a data file. Nothing from browser
   storage is loaded or saved until the person chooses, so the two copies can't drift apart
   by accident. */
async function showFileReconnect(){
  S.bootState = 'reconnect';
  let handle = null;
  try { handle = await HandleStore.get('dataFile'); } catch(e){ console.warn('Could not read the remembered data file', e); }
  const name = handle?.name || 'your data file';
  const supported = fsApiSupported();
  const status = document.getElementById('status'); if (status){ status.textContent = 'Data file not connected — nothing is being saved'; status.hidden = false; }
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('main').innerHTML = `<div class="panel stack" role="alert" style="max-width:640px;margin:2rem auto">
    <h2>Reconnect your data file</h2>
    <p>Last time, Nyaega was saving to <strong>${esc(name)}</strong>. Reconnect to keep working in that file.</p>
    ${supported ? '' : '<p class="small">This browser can\'t open data files directly. Use Chrome, Edge or Opera on a computer to reconnect.</p>'}
    <p class="small muted" id="reconnectError" role="status"></p>
    <div class="row">
      ${supported && handle ? `<button type="button" class="btn primary" id="reconnectFile">Reconnect to ${esc(name)}</button>` : ''}
      ${supported ? `<button type="button" class="btn ${handle ? 'ghost' : 'primary'}" id="reconnectOther">Open a data file…</button>` : ''}
      <button type="button" class="btn ghost" id="reconnectUseBrowser">Use browser storage instead</button>
    </div>
  </div>`;
  const errorEl = document.getElementById('reconnectError');
  const reconnect = document.getElementById('reconnectFile');
  if (reconnect) reconnect.onclick = async () => {
    try {
      let permission = await handle.queryPermission({ mode:'readwrite' });
      if (permission !== 'granted') permission = await handle.requestPermission({ mode:'readwrite' });
      if (permission !== 'granted'){ errorEl.textContent = 'Permission to use the file was not given. Try again, or open the file yourself.'; return; }
      const data = JSON.parse(await (await handle.getFile()).text());
      if (!data || data.app !== 'nyaega') throw new Error('it isn\'t a Nyaega data file');
      enterFileMode(handle, data);
      toast('Reconnected to ' + handle.name);
    } catch(e){
      console.warn('Reconnect failed', e);
      errorEl.textContent = 'Couldn\'t open ' + name + (e && e.name === 'NotFoundError' ? ' — it may have been moved, renamed or deleted.' : ' — ' + (e && e.message || 'unknown error') + '.') + ' Use "Open a data file…" to find it.';
    }
  };
  const other = document.getElementById('reconnectOther');
  if (other) other.onclick = () => openDataFile();
  document.getElementById('reconnectUseBrowser').onclick = () => dialog('Use browser storage instead?',
    `<p>From now on, changes are saved in this browser — <strong>not</strong> in ${esc(name)}.</p><p class="small muted">The file stays exactly as it is, but the two copies will then differ. You can connect a data file again later from the Data tab.</p>`,
    [{label:'Cancel'},{label:'Use browser storage', kind:'danger', onClick: async () => { await forgetFileMode(); location.reload(); }}]);
}
/* The header note is hidden while everything is normal. It only appears when something needs your attention: the sync is
   stuck, or changes are waiting while offline. (Problems saving locally have their own banner.) */
function setStatus(){
  const el = document.getElementById('status'); if (!el) return;
  const syncing = MODE === 'local' && typeof Sync !== 'undefined' && Sync.enabled() && Sync.signedIn();
  const problem = syncing && (Sync.state === 'attention' || (Sync.state === 'offline' && Sync.pending > 0));
  if (S.bootState === 'ready' && problem){ el.textContent = Sync.label(); el.hidden = false; }
  else if (S.bootState === 'ready'){ el.textContent = ''; el.hidden = true; }
}

/* Polite screen-reader announcement that doesn't depend on a toast being on screen. */
function announce(msg){
  const r = document.getElementById('liveRegion'); if (!r) return;
  r.textContent = ''; setTimeout(() => { r.textContent = msg; }, 50);
}
/* Clickable cards are real keyboard targets: focusable, announced as buttons, Enter/Space activate them. */
function enhanceKeyboard(m){
  m.querySelectorAll('.card:not(.static):not(.today-card):not(button):not([role])').forEach(card => {   // Today's cards are read-only
    if (card.closest('button')) return;
    card.setAttribute('role', 'button'); if (!card.hasAttribute('tabindex')) card.tabIndex = 0;
    card.addEventListener('keydown', e => { if (e.target === card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); card.click(); } });
  });
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
/* A toast with an Undo button. Runs undoFn if it's tapped within 5 seconds (or 7 with keyboard focus on it). */
function undoToast(message, undoFn){
  const t = document.createElement('div');
  t.className = 'toast undo-toast'; t.setAttribute('role','status');
  const text = document.createElement('span'); text.textContent = message;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'undo-btn'; b.textContent = 'Undo';
  t.append(text, b); document.body.appendChild(t);
  let timer = setTimeout(() => t.remove(), 5000);
  b.onfocus = () => { clearTimeout(timer); timer = setTimeout(() => t.remove(), 7000); };
  b.onclick = async () => { clearTimeout(timer); t.remove(); try { await undoFn(); } catch(e){ console.warn('Undo failed', e); toast('Could not undo'); } };
  return t;
}
/* Exercise variants: one name may exist once per equipment (Romanian deadlift with a barbell, with dumbbells…). Each is
   its own library entry with its own records. Where a name has more than one variant it is shown with its equipment. */
const exNorm = v => String(v || '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
/* A coach's own name for a variant ("DB RDL", "Romanian deadlift (dumbbell)", "Cable lateral raises") read as the movement
   and its equipment, so it can be matched to the starter variant: { base:'romanian deadlift', equipment:'dumbbell' }. */
const EQUIP_WORDS = [['Dumbbell', ['dumbbell', 'dumbbells', 'db', 'dbs']], ['Kettlebell', ['kettlebell', 'kettlebells', 'kb', 'kbs']], ['Barbell', ['barbell', 'bb']], ['Cable', ['cable', 'cables']], ['Band', ['band', 'bands', 'banded']]];
const MOVE_PLURALS = { raises:'raise', curls:'curl', thrusts:'thrust', lunges:'lunge', rows:'row', squats:'squat', flys:'fly', flies:'fly', flyes:'fly', flye:'fly', swings:'swing', carries:'carry', presses:'press', deadlifts:'deadlift' };
const MOVE_ALIASES = { 'rdl':'romanian deadlift', 'ohp':'overhead press', 'shoulder press':'overhead press', 'military press':'overhead press', 'one arm row':'single arm row', '1 arm row':'single arm row', 'biceps curl':'bicep curl', 'curl':'bicep curl','farmers carry':'farmer carry', 'farmers walk':'farmer carry', 'farmer walk':'farmer carry', 'pallof':'pallof press', 'lat raise':'lateral raise', 'reverse fly':'rear delt fly' };
function variantKeyOf(name, equipment){
  let eq = '';
  const words = exNorm(name).replace(/['’]/g, '').replace(/[()\[\],.\/&+-]/g, ' ').split(/\s+/).filter(Boolean).filter(w => {
    const hit = EQUIP_WORDS.find(([, ws]) => ws.includes(w)); if (!hit) return true; if (!eq) eq = hit[0]; return false;
  }).map(w => MOVE_PLURALS[w] || w);
  const base = words.join(' ');
  return { base:MOVE_ALIASES[base] || base, equipment:exNorm(eq || equipment) };
}
function exVariants(name){ const n = exNorm(name); return n ? S.exercises.filter(x => exNorm(x.name) === n) : []; }
function exLabelOf(e){ return e.equipment && exVariants(e.name).length > 1 ? e.name + ' · ' + e.equipment : e.name; }
function exName(id){ const e = S.exercises.find(x => x.id === id); return e ? exLabelOf(e) : 'Exercise'; }
/* The library entry for a name + equipment in `list`: the same equipment, or the only exercise with that name when either
   side has no equipment written (older backups and libraries didn't always have one). */
function findExerciseVariant(list, name, equipment){
  const n = exNorm(name), q = exNorm(equipment), same = list.filter(x => exNorm(x.name) === n);
  return same.find(x => exNorm(x.equipment) === q) || (same.length === 1 && (!q || !exNorm(same[0].equipment)) ? same[0] : null);
}
/* Which exercise a logged entry belongs to, as a key ("id:…" or, for an unknown name, "n:…"). Entries carry the exercise
   id; one without a known id is matched by name, a plain name only while it isn't shared by several variants. */
function entryExerciseKey(entry){
  const id = loggedExerciseId(entry), sid = id == null ? '' : String(id);
  if (sid && S.exercises.some(x => String(x.id) === sid)) return 'id:' + sid;
  const n = exNorm(loggedExerciseName(entry));
  if (n){
    const byLabel = S.exercises.filter(x => exNorm(exLabelOf(x)) === n);
    if (byLabel.length === 1) return 'id:' + byLabel[0].id;
  }
  return sid ? 'id:' + sid : n ? 'n:' + n : '';
}
/* The name to show for a logged entry: as logged, with the equipment added if it was logged before a variant existed. */
function entryDisplayName(entry){
  const name = loggedExerciseName(entry), key = entryExerciseKey(entry), ex = key.startsWith('id:') && S.exercises.find(x => 'id:' + x.id === key);
  if (!name) return ex ? exLabelOf(ex) : exName(loggedExerciseId(entry));
  return ex && exNorm(name) === exNorm(ex.name) ? exLabelOf(ex) : name;
}
/* Exercises are archived, never deleted, so programs and history that use them keep working. */
function activeExercises(){ return S.exercises.filter(e => !e.archived); }
function exerciseUsage(exId){
  const key = String(exId);
  let items = 0; const programs = new Set();
  Object.entries(S.programs).forEach(([pid,p]) => (p.days||[]).forEach(d => (d.items||[]).forEach(it => { if (String(it.exId) === key){ items++; programs.add(pid); } })));
  const logs = Object.values(S.logs).filter(l => workoutLogEntries(l).some(e => String(loggedExerciseId(e) ?? '') === key)).length;

  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';

    const linked = await Store.getMeta('syncUser', null);
    await Sync.markErased(cid);
    // queued even while signed out, so the online copy is erased at the next sign-in; the client row becomes a tombstone that always wins
    if (Sync.enabled() && (Sync.signedIn() || Sync.linkedId)) await IDB.put('outbox', 'clients/' + cid, { coll:'clients', id:cid, op:'erase', doc:null, queuedAt:Date.now() });
    const log = ((await Store.getMeta('deletionLog', null)) || { list:[] }).list;
    log.push({ at:new Date().toISOString(), records:erased.length, account:!!linked });   // no names or ids are kept
    await Store.putMeta('deletionLog', { list:log.slice(-200) });
    S.deletionCount = log.length;
  } catch(e){ console.warn('Could not record the deletion', e); }
  Audit.log('delete-client', { records:erased.length });
  if (Sync.signedIn()) Sync.schedule(300);
}

/* ---- retention ---- */
function lastActivityOf(cid){
  const c = S.clients[cid] || {};
  const dates = [...(attIndex().byClient[cid] || []).map(a => a.date), ...(logIndex().byClient[cid] || []).map(l => l.date), c.createdAt && String(c.createdAt).slice(0, 10)].filter(Boolean);
  return dates.sort().pop() || todayISO();
}
const monthsAgoISO = n => { const d = new Date(); d.setMonth(d.getMonth() - n); return isoOf(d); };
function retentionReport(){
  const archiveCut = monthsAgoISO(Number(S.retention.archiveMonths) || 12), deleteCut = monthsAgoISO(Number(S.retention.deleteMonths) || 36);
  const toArchive = [], toDelete = [];
  for (const [id, c] of Object.entries(S.clients)){
    const last = lastActivityOf(id);
    if (c.status === 'archived'){ if (last < deleteCut) toDelete.push({ id, name:c.name, last }); }
    else if (last < archiveCut) toArchive.push({ id, name:c.name, last });
  }
  return { toArchive, toDelete };
}
function retentionReminderHTML(){
  const r = retentionReport(); if (!r.toArchive.length && !r.toDelete.length) return '';
  const lines = [];
  if (r.toArchive.length) lines.push(`${r.toArchive.length} client${r.toArchive.length === 1 ? ' has' : 's have'} had no activity for ${esc(S.retention.archiveMonths)}+ months: ${r.toArchive.slice(0, 4).map(x => esc(x.name)).join(', ')}${r.toArchive.length > 4 ? '…' : ''}. Consider archiving.`);
  if (r.toDelete.length) lines.push(`${r.toDelete.length} archived client${r.toDelete.length === 1 ? ' is' : 's are'} past ${esc(S.retention.deleteMonths)} months: ${r.toDelete.slice(0, 4).map(x => esc(x.name)).join(', ')}${r.toDelete.length > 4 ? '…' : ''}. Consider deleting their data.`);
  return `<div class="panel" role="status" style="margin-top:.8rem;border-left:4px solid var(--warn)"><div class="spread"><div><strong>Data retention</strong><div class="small muted">${lines.join('<br>')}</div></div><button type="button" class="btn ghost sm" data-go="clients">Review clients</button></div></div>`;
}

/* ---------------------------------------------------------------
   Devices and audit log. Each browser that signs in registers itself as a device. The first device is approved
   automatically; every later one must be approved from an approved device, and any device can be revoked. The
   server (row-level security) refuses data requests from devices that are pending or revoked, so revoking works
   immediately even if the lost device still holds a valid sign-in. The audit log is append-only on the server.
----------------------------------------------------------------*/
function deviceLabel(){
  const ua = navigator.userAgent || '';
  const browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
  return browser + (os ? ' on ' + os : '');
}
/* Each device has an id and a secret. The id is how it is named; the secret (random, made here, never shown) is what proves
   it is that device: the server keeps only its hash. Both live only in this browser's storage and are not part of any export. */
async function ensureDeviceId(fresh){
  let m = fresh ? null : await Store.getMeta('deviceId', null), changed = false;
  if (!m || !m.id){ m = { id:(crypto.randomUUID ? crypto.randomUUID() : uid() + uid() + uid()) }; changed = true; }
  if (!m.secret){ m.secret = b64url(crypto.getRandomValues(new Uint8Array(32))); changed = true; }
  if (changed) await Store.putMeta('deviceId', m);
  Sync.deviceId = m.id; Sync.deviceSecret = m.secret;
}
Object.assign(Sync, {
  deviceId:'', devices:[], deviceStatus:'unknown', lastSeenAt:0,
  keySupport:null,   // does the server have the device-key functions (nyaega-supabase-device-keys.sql)? null = not known yet
  async registerDevice(){
    if (!this.deviceId) await ensureDeviceId();
    let done = false;
    if (this.keySupport !== false){
      try {
        const r = await this.api('/rest/v1/rpc/register_device', { method:'POST', body:{ p_device:this.deviceId, p_name:deviceLabel(), p_hash:await sha256Hex(this.deviceSecret) } });
        this.keySupport = true; done = true;
        if (r === 'registered') Audit.log('device-register');   // so a device you did not add shows up in Recent activity
      } catch(e){ if (e.status === 404 || (e.data && e.data.code === 'PGRST202')) this.keySupport = false; else throw e; }
    }
    if (!done) await this.api('/rest/v1/device?on_conflict=coach_id,device_id', { method:'POST', headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' }, body:{ device_id:this.deviceId, name:deviceLabel() } });   // server without device keys
    await this.checkDevice(true);
  },
  /* A device that was registered before device keys existed ties itself to its own secret the first time it syncs. */
  async bindDeviceKey(){
    const done = await Store.getMeta('deviceBound', null);
    if (done && done.id === this.deviceId) return;
    try {
      const r = await this.api('/rest/v1/rpc/bind_device', { method:'POST', body:{ p_hash:await sha256Hex(this.deviceSecret) } });
      if (r === 'bound' || r === 'already') await Store.putMeta('deviceBound', { id:this.deviceId });
    } catch(e){ console.warn('Could not bind this device\'s key yet', e); }
  },
  /* This device lost its key or the server does not recognise it: take a new identity (it must be approved again). */
  async newDeviceIdentity(){
    await Store.putMeta('deviceBound', null); await ensureDeviceId(true);
    this.deviceStatus = 'unknown'; this.keySupport = this.keySupport === false ? false : null;
    await this.registerDevice();
  },
  /* Our own standing, read from the server on every sync round. Anything but "approved" stops syncing. */
  async checkDevice(forceLast){
    const rows = await this.api('/rest/v1/device?select=device_id,name,created_at,last_seen,approved_at,revoked_at&order=created_at.asc');
    this.devices = rows || [];
    const me = this.devices.find(d => d.device_id === this.deviceId);
    this.deviceStatus = !me ? 'unregistered' : me.revoked_at ? 'revoked' : me.approved_at ? 'approved' : 'pending';
    // With device keys the server decides, because it also checks this device's secret.
    if (this.keySupport !== false){
      try {
        const s = await this.api('/rest/v1/rpc/device_standing', { method:'POST', body:{} });
        this.keySupport = true;
        if (['approved', 'pending', 'revoked', 'unregistered', 'mismatch'].includes(s)) this.deviceStatus = s;
      } catch(e){ if (e.status === 404 || (e.data && e.data.code === 'PGRST202')) this.keySupport = false; }
    }
    if (this.deviceStatus === 'approved' && this.keySupport) await this.bindDeviceKey();
    // Does this account ask for approval of new devices? (undefined = the server has no such switch yet)
    if (this.deviceStatus === 'approved' && this.keySupport && (forceLast || Date.now() - (this.settingAt || 0) > 10 * 60 * 1000)){
      this.settingAt = Date.now();
      try { const r = await this.api('/rest/v1/account_setting?select=require_device_approval'); this.requireApproval = !!(r && r[0] && r[0].require_device_approval); }
      catch(e){ if (e.status === 404 || (e.data && e.data.code === 'PGRST205')) this.requireApproval = undefined; }
    }
    if (this.deviceStatus === 'approved' && (forceLast || Date.now() - this.lastSeenAt > 10 * 60 * 1000)){
      this.lastSeenAt = Date.now();
      this.api('/rest/v1/device?device_id=eq.' + encodeURIComponent(this.deviceId), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:{ last_seen:new Date().toISOString() } }).catch(() => {});
    }
    return this.deviceStatus;
  },
  deviceMessage(){
    return this.deviceStatus === 'pending' ? 'this device is waiting for approval from another of your devices'
      : this.deviceStatus === 'revoked' ? 'this device was removed from your account'
      : this.deviceStatus === 'mismatch' ? 'this device\'s security key is not recognised. Register it again, then approve it from another of your devices'
      : 'this device is not registered';
  },
  async setDevice(deviceId, fields){
    const res = await this.api('/rest/v1/device?device_id=eq.' + encodeURIComponent(deviceId), { method:'PATCH', headers:{ Prefer:'return=representation' }, body:fields });
    if (!res || !res.length) throw new Error('The server refused that change. Only an approved device can do it.');
    await this.checkDevice(); return res[0];
  },
  async signOutEverywhere(){
    try { await this.api('/auth/v1/logout?scope=global', { method:'POST' }); } catch {}
    await this.signOut();
  }
});
const Audit = {
  async log(action, detail = {}){
    const entry = { action, detail, at:new Date().toISOString() };
    try {
      const l = ((await Store.getMeta('auditLocal', null)) || { list:[] }).list; l.push(entry);
      await Store.putMeta('auditLocal', { list:l.slice(-200) });
    } catch(e){ console.warn('Could not record local activity', e); }
    if (Sync.signedIn()){
      try {
        const q = ((await Store.getMeta('auditQueue', null)) || { list:[] }).list; q.push(entry);
        await Store.putMeta('auditQueue', { list:q.slice(-500) }); Sync.schedule(2000);
      } catch {}
    }
  },
  /* Sends queued entries to the account's append-only log (the server stamps time and device). */
  async flush(){
    const q = ((await Store.getMeta('auditQueue', null)) || { list:[] }).list; if (!q.length) return;
    const logged = await Sync.api('/rest/v1/audit_log', { method:'POST', headers:{ Prefer:'return=representation' }, body:q.map(e => ({ action:String(e.action).slice(0, 40), detail:{ ...e.detail, clientAt:e.at } })) });
    if (logged && logged[0] && logged[0].at) Sync.noteServerTime(logged[0].at);
    await Store.putMeta('auditQueue', null);
  },
  async recent(){
    if (Sync.signedIn() && Sync.deviceStatus === 'approved'){
      try { return (await Sync.api('/rest/v1/audit_log?select=action,detail,at,device_id&order=at.desc&limit=30')).map(r => ({ action:r.action, detail:r.detail, at:r.at, device:r.device_id })); } catch {}
    }
    return (((await Store.getMeta('auditLocal', null)) || { list:[] }).list).slice(-30).reverse();
  }
};
const AUDIT_TEXT = { 'lock-set':'Set or changed the app PIN', 'lock-off':'Turned off the app lock', 'invite-create':'Created an assistant invitation', 'assistant-accept':'Accepted an invitation', 'assistant-remove':'Removed an assistant', 'assistant-clients':'Changed an assistant\'s clients', 'sign-in':'Signed in', 'sign-out':'Signed out', export:'Exported data', import:'Imported a backup', 'delete-client':'Deleted a client', 'delete-all':'Deleted all data', restore:'Restored a snapshot', 'device-approve':'Approved a device', 'device-revoke':'Removed a device', 'device-register':'Added a new device', 'device-approval-on':'Turned on approval for new devices', 'device-approval-off':'Turned off approval for new devices' };
function auditLineText(e){

}

const assistantBlocked = () => { if (Sync.role === 'assistant'){ toast('Assistant accounts cannot do this'); return true; } return false; };
Object.assign(Sync, {

  scope(){ return this.role === 'assistant' && this.coachId ? '&coach_id=eq.' + encodeURIComponent(this.coachId) : ''; },
  /* Is this account an assistant of someone? Decided by the server, not by anything stored here. */

/* Removes everything stored on this device (collections, sync state) without touching the account. */
async function wipeLocalData(){
  await IDB.run([...COLLS, 'outbox', 'versions', 'conflicts', 'snapshots'], 'readwrite', tx => { [...COLLS, 'outbox', 'versions', 'conflicts', 'snapshots'].forEach(s => tx.objectStore(s).clear()); });
  COLLS.forEach(c => { for (const k of Object.keys(S[c])) delete S[c][k]; });
  for (const k of ['syncInitial', 'syncCursor', 'snapshotIndex']) { try { await Store.putMeta(k, null); } catch {} }
  S.conflicts = []; invalidateLogIndex(); invalidateAttIndex(); render({ keepScroll:true });
}
/* Drops one client and everything about them from this device only (no sync entries are queued). */
async function purgeClientLocal(cid){
  const gone = [['clients', cid]];
  Object.entries(S.logs).forEach(([id, l]) => { if (l.clientId === cid) gone.push(['logs', id]); });
  Object.entries(S.attendance).forEach(([id, a]) => { if (a.clientId === cid) gone.push(['attendance', id]); });
  Object.entries(S.schedule).forEach(([id, s]) => { if ((s.clientIds || []).includes(cid)) gone.push(['schedule', id]); });
  Object.entries(S.scheduleExceptions).forEach(([id, x]) => { if (x.key === cid) gone.push(['scheduleExceptions', id]); });
  for (const [coll, id] of gone){ await IDB.del(coll, id); delete S[coll][id]; await IDB.del('outbox', coll + '/' + id); await IDB.del('versions', coll + '/' + id); }
}

/* ---------------------------------------------------------------
   Sign-in and app lock screen. What it is and is not:
   - The PIN and biometrics UNLOCK THE APP ON THIS DEVICE (a privacy screen for a phone left on a gym bench).
     They are not a server login: the account password (or a "keep me signed in" session) is what reaches your account.
   - The lock keeps casual onlookers out. It does not encrypt the data stored in this browser; anyone with the
     unlocked device and developer tools could still read it. Use a device passcode too.
   - Roles shown here are a hint for what to expect; the server decides what an account really is.
----------------------------------------------------------------*/
const LAST_ROLE_KEY = 'nyaega:lastRole', LOCK_FAILS_KEY = 'nyaega:lockfails';
async function pinDerive(text, saltB64, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(text), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256' }, key, 256)));
}

      pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],

/* ---------------------------------------------------------------
   "Continue with Google" (Supabase OAuth, PKCE flow). Needs Google enabled as a provider in Supabase
   (Authentication > Providers > Google) and this page's address in the redirect URL list. The browser leaves for
   Google and comes back with a one-time code that is exchanged for a session; no password is involved.
----------------------------------------------------------------*/
Object.assign(Sync, {
  async oauth(provider){
    const back = this.redirect();
    if (!back) throw new Error('Google sign-in needs the app to be opened from a web address (not a file).');
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    sessionStorage.setItem('nyaega:pkce', verifier);
    location.href = SUPABASE_URL + '/auth/v1/authorize?provider=' + encodeURIComponent(provider) + '&redirect_to=' + encodeURIComponent(back) + '&code_challenge=' + challenge + '&code_challenge_method=s256';
  },
  async finishOAuth(code, opts = {}){
    const verifier = sessionStorage.getItem('nyaega:pkce'); sessionStorage.removeItem('nyaega:pkce');
    if (!verifier) throw new Error('The sign-in was started in a different window. Please try again.');
    this.keep = true;   // OAuth users expect to stay signed in
    const d = await this.raw('/auth/v1/token?grant_type=pkce', { method:'POST', body:{ auth_code:code, code_verifier:verifier } });
    if (opts.onlyUserId && !(d.user && d.user.id === opts.onlyUserId)){
      try { await this.raw('/auth/v1/logout', { method:'POST', token:d.access_token }); } catch {}
      throw new Error('This device is locked to another account. Use your PIN.');
    }
    await this.afterSignIn(d);
    await this.detectRole();
  }
});
/* Reads (and removes from the address bar) the result of a Google sign-in redirect. */
function takeOAuthResult(){
  try {
    const u = new URL(location.href), code = u.searchParams.get('code');
    const hash = new URLSearchParams(u.hash.replace(/^#/, ''));
    const error = u.searchParams.get('error_description') || u.searchParams.get('error') || hash.get('error_description') || hash.get('error');
    if (!code && !error) return null;
    ['code', 'error', 'error_code', 'error_description'].forEach(k => u.searchParams.delete(k));
    history.replaceState(history.state, '', u.pathname + (u.search || ''));   // keep the back-button state of this entry
    return { code, error };
  } catch { return null; }
}
async function completeOAuth(res){
  if (!res) return;
  if (res.error || !res.code){ toast('Sign-in did not finish: ' + (res.error || 'no code returned')); return; }
  if (Lock.locked && !Sync.linkedId){ toast('This device is locked. Use your PIN.'); return; }
  try { await Sync.finishOAuth(res.code, { onlyUserId:Lock.locked ? Sync.linkedId : undefined }); if (Lock.locked) Lock.hide(); toast(Sync.role === 'assistant' ? 'Welcome, assistant' : 'Signed in'); S.view = 'dashboard'; S.sub = 'today'; S.sel = {}; render(); }
  catch(e){ toast('Sign-in failed: ' + (e.message || 'unknown error')); }
}

/* ---------------------------------------------------------------
   Sync hardening (audit follow-up): changes are queued whenever the device has ever been linked to an account (even
   while signed out); clients only sync with recorded consent for storage outside Kenya; an erasure is a tombstone
   that always wins; queue failures are visible.
----------------------------------------------------------------*/
Object.assign(Sync, {
  linkedId:null, erased:new Set(),
  consentOk(c){ return !!(c && c.consent && c.consent.given && !c.consent.withdrawnAt && c.consent.outsideKenya); },
  /* May this record be copied to the online account? (An assistant only ever works on data the owner already shares.) */
  syncAllowed(coll, doc){
    if (this.role === 'assistant') return true;
    if (coll === 'clients') return this.consentOk(doc);
    if (coll === 'logs' || coll === 'attendance') return !!doc && this.consentOk(S.clients[doc.clientId]);
    if (coll === 'schedule') return !!doc && (doc.clientIds || []).length > 0 && doc.clientIds.every(i => this.consentOk(S.clients[i]));
    if (coll === 'scheduleExceptions'){ const c = doc && S.clients[doc.key]; return c ? this.consentOk(c) : true; }
    return true;
  },
  dependentsOf(cid){
    const out = [];
    Object.entries(S.logs).forEach(([id, d]) => { if (d.clientId === cid) out.push(['logs', id, d]); });
    Object.entries(S.attendance).forEach(([id, d]) => { if (d.clientId === cid) out.push(['attendance', id, d]); });
    Object.entries(S.schedule).forEach(([id, d]) => { if ((d.clientIds || []).includes(cid)) out.push(['schedule', id, d]); });
    Object.entries(S.scheduleExceptions).forEach(([id, d]) => { if (d.key === cid) out.push(['scheduleExceptions', id, d]); });
    return out;
  },
  async put2outbox(op, coll, id, doc){
    await IDB.put('outbox', coll + '/' + id, { coll, id, op, doc: op === 'put' ? JSON.parse(JSON.stringify(doc)) : null, queuedAt:Date.now() });
  },
  /* A client's consent changed: take their records off the server, or put them on it. */
  async consentSweep(cid, doc){
    const allowed = this.consentOk(doc);
    for (const [coll, id, d] of this.dependentsOf(cid)){
      const onServer = (await this.baseVersion(coll, id)) != null;
      if (!allowed && onServer) await this.put2outbox('unshare', coll, id, null);
      else if (allowed && !onServer && (coll !== 'schedule' || (d.clientIds || []).every(i => i === cid || this.consentOk(S.clients[i])))) await this.put2outbox('put', coll, id, d);
    }
  },
  async enqueue(op, coll, id, doc){
    if (!this.enabled() || !(this.signedIn() || this.linkedId)) return;
    try {
      if (this.role !== 'assistant' && op === 'put' && coll === 'clients'){
        await this.consentSweep(id, doc);
        if (!this.consentOk(doc)){
          if ((await this.baseVersion('clients', id)) != null) await this.put2outbox('unshare', 'clients', id, null);
          else await IDB.del('outbox', 'clients/' + id);
          this.pending = await IDB.count('outbox'); refreshSyncUI(); if (this.signedIn()) this.schedule(1500);
          return;
        }
      } else if (op === 'put' && !this.syncAllowed(coll, doc)){
        await IDB.del('outbox', coll + '/' + id); return;   // no consent for this client: stays on this device
      }
      await this.put2outbox(op, coll, id, doc);
      this.pending = await IDB.count('outbox'); refreshSyncUI();
      if (this.signedIn()) this.schedule(1500);
    } catch(e){
      console.warn('Could not queue a change for sync', e);
      if (this.signedIn()) this.setState('attention', 'some changes could not be queued for sync');
      showSaveError(new StorageWriteError('the sync queue', e), { background:true });
    }
  },
  rowOf(it){
    if (it.op === 'unshare') return { id:it.id, ...(this.role === 'assistant' && this.coachId ? { coach_id:this.coachId } : {}), data:{ unshared:true }, deleted_at:new Date().toISOString() };   // taken off the server for lack of consent; the copy on this device stays
    if (it.op === 'erase') return { id:it.id, ...(this.role === 'assistant' && this.coachId ? { coach_id:this.coachId } : {}), data:{ erased:true }, deleted_at:new Date().toISOString() };
    return this.rowFor(it.coll, it.id, it.op === 'put' ? it.doc : null);
  },
  async loadErased(){ this.erased = new Set(((await Store.getMeta('erasedClients', null)) || { list:[] }).list); },
  async markErased(cid){ this.erased.add(cid); await Store.putMeta('erasedClients', { list:[...this.erased].slice(-2000) }); },
  /* Another device erased this client: remove everything about them here and never bring it back. */
  async eraseLocal(cid){
    await this.markErased(cid);
    await purgeClientLocal(cid);
    S.sessions = S.sessions.filter(r => r.logClient !== cid); S.recoveryArchive = (S.recoveryArchive || []).filter(r => r.logClient !== cid);

/* ---------------------------------------------------------------
   N7: a rest that ends for a client who is not on screen still beeps, vibrates and names the client.
----------------------------------------------------------------*/
function openDrafts(){

  if (S.parkedWorkout && S.parkedWorkout.draft) list.push({ draft:S.parkedWorkout.draft, cid:S.parkedWorkout.logClient });

}
function checkOtherRests(current){
  for (const { draft, cid } of openDrafts()){

    draft.restRunning = false; draft.restEndAt = null; draft.restRemainingMs = 0;
    const n = (S.clients[cid] || {}).name || 'a client';

/* The soonest-ending rest of a client who is not the one on screen (shown beside the main rest clock). */
function otherRestInfo(current){
  let best = null;
  for (const { draft, cid } of openDrafts()){
    if (draft === current || !draft.restRunning || !draft.restEndAt) continue;
    const left = draft.restEndAt - Date.now();

const normExName = v => String(v || '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
Object.assign(Sync, {
